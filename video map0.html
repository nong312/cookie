<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebRTC 视频协作与地图定位系统</title>
    <!-- 引入 PeerJS 与 Leaflet -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #f0f2f5; 
        }

        body { display: flex; flex-direction: column; }

        /* 顶部 Tab 导航栏 */
        .tab-bar {
            display: flex;
            background: #1e293b;
            border-bottom: 2px solid #0284c7;
            flex-shrink: 0;
            z-index: 2000;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: #1e293b;
            color: #94a3b8;
            border: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .tab-btn.active {
            color: #ffffff;
            background: #0284c7;
        }

        /* 视图容器 */
        .tab-content {
            flex: 1;
            display: none;
            height: calc(100vh - 45px);
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        /* --- Tab 1 样式 (视频与协作) --- */
        #video-container {
            height: 30vh; min-height: 120px; max-height: 60vh;
            background: #1a1a1a; display: flex; justify-content: space-around;
            align-items: center; padding: 6px; flex-shrink: 0;
        }
        .video-box { width: 48%; height: 100%; background: #000; border-radius: 8px; overflow: hidden; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .video-label { position: absolute; bottom: 4px; left: 4px; background: rgba(0,0,0,0.6); color: #fff; padding: 2px 6px; font-size: 10px; border-radius: 4px; }

        #resizer { height: 8px; background: #ccc; cursor: row-resize; flex-shrink: 0; }
        #resizer:hover, #resizer:active { background: #007bff; }

        #main-container { flex: 1; display: flex; flex-direction: column; padding: 10px; gap: 8px; overflow-y: auto; background: #fff; }
        .card { background: #f8f9fa; border: 1px solid #e9ecef; padding: 8px 10px; border-radius: 8px; flex-shrink: 0; }
        .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
        .row:last-child { margin-bottom: 0; }

        input[type="text"] { padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 110px; font-size: 13px; }
        button { padding: 6px 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .btn-secondary { background: #6c757d; }
        .btn-danger { background: #dc3545; }
        .btn-success { background: #28a745; }
        .btn-warning { background: #ffc107; color: #212529; }
        .btn-info { background: #0284c7; }

        #text-area-container { flex: 1; display: flex; flex-direction: column; min-height: 120px; }
        .text-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        #custom-textarea { flex: 1; width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; resize: none; font-size: 14px; line-height: 1.4; }
        #logs { background: #1e1e1e; color: #00ff00; padding: 6px; font-family: monospace; font-size: 11px; height: 60px; overflow-y: auto; border-radius: 4px; flex-shrink: 0; }

        /* --- Tab 2 样式 (地图定位) --- */
        .map-app { display: flex; width: 100%; height: 100%; }
        .map-panel { width: 360px; flex: 0 0 360px; overflow-y: auto; padding: 14px; background: #fff; box-shadow: 2px 0 12px rgba(0,0,0,0.1); z-index: 1000; }
        .section { margin-bottom: 12px; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; }
        .section h2 { margin-bottom: 6px; font-size: 0.95rem; color: #0f172a; }
        .address-box { font-size: 0.85rem; font-weight: bold; color: #1e293b; background: #fff; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; margin-top: 4px; line-height: 1.4; }
        .coords-info { font-weight: normal; font-size: 0.75rem; color: #64748b; margin-top: 2px; }

        #map-container { flex: 1; position: relative; height: 100%; }
        #map { width: 100%; height: 100%; background: #dbeafe; }

        .wakelock-box { display: flex; align-items: center; justify-content: space-between; background: #f0f9ff; border: 1px solid #bae6fd; padding: 8px 10px; border-radius: 8px; margin-bottom: 10px; }
        .wakelock-box label { margin: 0; cursor: pointer; color: #0369a1; font-size: 0.85rem; font-weight: bold; }

        .center-btn { position: absolute; top: 14px; right: 14px; z-index: 1000; background: #fff; color: #0284c7; border: 2px solid #cbd5e1; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.2); cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .person-icon { width: 34px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        .star-marker { font-size: 24px; text-shadow: 0 0 3px #000; text-align: center; line-height: 24px; }

        @media(max-width:760px){
            .map-app { flex-direction: column; }
            .map-panel { width: 100%; flex: 0 0 auto; max-height: 45vh; padding: 10px; }
            #map-container { flex: 1; width: 100%; min-height: 55vh; }
        }
    </style>
</head>
<body>

    <!-- 顶栏 Tab 切换 -->
    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('tab-video')">📹 视频通话与协同</button>
        <button class="tab-btn" onclick="switchTab('tab-map')">📍 共享地图与定位</button>
    </div>

    <!-- ===== TAB 1: WebRTC 视频与文本协作 ===== -->
    <div id="tab-video" class="tab-content active">
        <div id="video-container">
            <div class="video-box">
                <video id="local-video" autoplay playsinline muted></video>
                <span class="video-label">我</span>
            </div>
            <div class="video-box">
                <video id="remote-video" autoplay playsinline></video>
                <span class="video-label">对方</span>
            </div>
        </div>

        <div id="resizer" title="上下拖动调整视频区域大小"></div>

        <div id="main-container">
            <div class="card">
                <div class="row">
                    <span style="font-size: 12px;"><b>我的 ID:</b> <span id="my-id" style="color: blue;">正在连接...</span></span>
                    <button class="btn-secondary" onclick="copyMyId()" style="padding: 2px 6px; font-size: 11px;">复制 ID</button>
                </div>
                <div class="row">
                    <input type="text" id="peer-id-input" placeholder="贴入对方的 ID">
                    <button class="btn-secondary" onclick="pastePeerId()">粘贴</button>
                    <button onclick="connectToPeer()">呼叫/连接</button>
                    <button id="hangup-btn" onclick="hangupCall()" class="btn-danger">挂断</button>
                    <button id="toggle-video-btn" onclick="toggleVideo()" style="background:#6c757d;">关视频</button>
                </div>
            </div>

            <div class="card">
                <div class="row">
                    <input type="file" id="file-input" style="font-size:11px; flex:1;">
                    <button onclick="sendFile()">发送</button>
                    <button class="btn-success" onclick="loadLocalDocToBox()">显示在框内</button>
                </div>

                <div id="file-receive-area" style="display:none; margin-top:4px; background:#e9ecef; padding:4px; border-radius:4px;" class="row">
                    <span id="file-info" style="font-size:11px;"></span>
                    <button id="download-btn">下载文件</button>
                    <button id="show-text-btn" class="btn-success" style="display:none;">载入框内</button>
                </div>
            </div>

            <div id="text-area-container">
                <div class="text-header">
                    <label style="font-weight: bold; font-size: 12px;">实时协作文本框：</label>
                    <button class="btn-warning" onclick="saveTextToTxt()" style="font-weight: bold;">💾 保存为 TXT</button>
                </div>
                <textarea id="custom-textarea" placeholder="在这里打字，对方可以实时看到；也可以选择本地文件显示在框内..." oninput="onTextInput()"></textarea>
            </div>

            <div id="logs"><b>运行日志：</b><br></div>
        </div>
    </div>

    <!-- ===== TAB 2: 地图共享与定位 ===== -->
    <div id="tab-map" class="tab-content">
        <div class="map-app">
            <aside class="map-panel">
                <!-- 屏幕常亮设置 -->
                <div class="wakelock-box">
                    <label for="wakelock-toggle">💡 <b>保持屏幕常亮</b></label>
                    <input type="checkbox" id="wakelock-toggle">
                </div>

                <!-- 1. Search Location -->
                <section class="section">
                    <h2>🔍 Search Location</h2>
                    <div class="row" style="margin-top:6px;">
                        <input id="search-input" placeholder="输入地址或地名...">
                        <button id="search-btn">搜索</button>
                    </div>
                </section>

                <!-- 2. 我的精确地址 -->
                <section class="section">
                    <h2>🧍 我的精确地址</h2>
                    <div id="my-address" class="address-box">正在自动获取 GPS 定位...</div>
                    <div id="my-coordinates" class="coords-info">经纬度: 获取中...</div>
                </section>

                <!-- 3. 对方的精确地址 -->
                <section class="section">
                    <h2>🟢 对方的精确地址</h2>
                    <div id="friend-address" class="address-box">尚未连接对方或对方未开启定位</div>
                    <div id="friend-coordinates" class="coords-info">经纬度: 未知</div>
                </section>

                <!-- 离线地图与轨迹管理 -->
                <section class="section">
                    <h2>⚙️ 地图与轨迹工具</h2>
                    <div class="row">
                        <button id="clear-track" class="btn-secondary" style="flex:1;">清除行走轨迹</button>
                    </div>
                    <div class="row" style="margin-top:6px;">
                        <button id="download-offline" class="btn-info" style="flex:1;">📥 下载 5km 离线包</button>
                        <button id="clear-offline" class="btn-danger" style="flex:1;">🗑️ 清除缓存</button>
                    </div>
                </section>

                <!-- ⭐ 星型标记与 TXT 交互 -->
                <section class="section">
                    <h2>⭐ 标注与 TXT 导入导出</h2>
                    <p style="font-size:0.75rem; color:#64748b; margin-bottom:6px;">长按或右键地图添加/移除星标。</p>
                    <button id="export-txt" class="btn-secondary" style="width:100%;">💾 导出星标为 TXT</button>
                    <label style="display:block; margin-top:6px; cursor:pointer;">
                        <div style="text-align:center; padding:8px; background:#64748b; color:#fff; border-radius:4px; font-weight:bold; font-size:.8rem;">📂 从 TXT 加载星标</div>
                        <input type="file" id="import-txt" accept=".txt" style="display:none;">
                    </label>
                </section>
            </aside>

            <div id="map-container">
                <button id="center-me-btn" class="center-btn" title="定位到我的位置">🎯</button>
                <main id="map" aria-label="Map"></main>
            </div>
        </div>
    </div>

    <script>
        // --- 全局 Tab 切换逻辑 ---
        let leafletMap = null;

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            const targetContent = document.getElementById(tabId);
            targetContent.classList.add('active');

            // 切换到地图页面时刷新尺寸，防止出现灰块
            if (tabId === 'tab-map' && leafletMap) {
                setTimeout(() => leafletMap.invalidateSize(true), 200);
            }
        }

        function log(msg) {
            const logBox = document.getElementById('logs');
            logBox.innerHTML += `> ${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // --- WebRTC (PeerJS) 核心逻辑 ---
        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun.nextcloud.com:443' },
                    { urls: 'stun:stun.cloudflare.com:3478' }
                ]
            },
            debug: 1
        };

        const peer = new Peer(peerConfig);
        let localStream = null, activeCall = null, dataConnection = null, isVideoEnabled = true;

        peer.on('open', id => {
            document.getElementById('my-id').innerText = id;
            log('<span style="color:#00ff00;">已连接 WebRTC 服务！ID: ' + id + '</span>');
        });

        peer.on('error', err => {
            log('<span style="color:red;">网络错误 [' + err.type + ']: ' + err.message + '</span>');
            if (err.type === 'peer-unavailable') {
                alert('连接失败：找不到对方 ID！');
            }
        });

        async function ensureLocalStream() {
            if (localStream) return localStream;
            try {
                log('正在请求打开本地摄像头与麦克风...');
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: { echoCancellation: true, noiseSuppression: true }
                });
                document.getElementById('local-video').srcObject = localStream;
                log('本地摄像头与麦克风已开启');
                return localStream;
            } catch (err) {
                log('<span style="color:red;">获取摄像头/麦克风失败: ' + err.message + '</span>');
                alert('无法开启摄像头/麦克风！');
                return null;
            }
        }

        function copyMyId() {
            const myIdText = document.getElementById('my-id').innerText;
            if (!myIdText || myIdText.includes('正在连接')) return alert('ID 尚未就绪！');
            navigator.clipboard.writeText(myIdText).then(() => alert('已复制 ID！'));
        }

        async function pastePeerId() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) document.getElementById('peer-id-input').value = text.trim();
            } catch (err) {
                alert('请手动粘贴！');
            }
        }

        peer.on('call', async call => {
            log('收到来自对方的呼叫...');
            const stream = await ensureLocalStream();
            activeCall = call;
            call.answer(stream);
            call.on('stream', remoteStream => handleRemoteStream(remoteStream));
            call.on('close', () => hangupCall(false));
        });

        peer.on('connection', conn => {
            log('收到对方数据通道连接...');
            setupDataConnection(conn);
        });

        async function connectToPeer() {
            const remotePeerId = document.getElementById('peer-id-input').value.trim();
            if (!remotePeerId) return alert('请先填入对方的 ID！');

            const stream = await ensureLocalStream();
            if (!stream) return;

            log('向对方 [' + remotePeerId + '] 发起呼叫...');
            activeCall = peer.call(remotePeerId, stream);
            if (activeCall) {
                activeCall.on('stream', remoteStream => handleRemoteStream(remoteStream));
                activeCall.on('close', () => hangupCall(false));
            }

            const conn = peer.connect(remotePeerId);
            setupDataConnection(conn);
        }

        function handleRemoteStream(remoteStream) {
            const remoteVideo = document.getElementById('remote-video');
            remoteVideo.srcObject = remoteStream;
            remoteVideo.play().catch(() => {
                document.body.addEventListener('click', () => remoteVideo.play(), { once: true });
            });
        }

        function hangupCall(isInitiator = true) {
            if (activeCall) { activeCall.close(); activeCall = null; }
            if (dataConnection) { dataConnection.close(); dataConnection = null; }
            document.getElementById('remote-video').srcObject = null;
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
                document.getElementById('local-video').srcObject = null;
            }
            log('<span style="color:orange;">' + (isInitiator ? '已挂断通话' : '对方已挂断') + '</span>');
        }

        function toggleVideo() {
            if (!localStream) return;
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                isVideoEnabled = !isVideoEnabled;
                videoTrack.enabled = isVideoEnabled;
                const btn = document.getElementById('toggle-video-btn');
                btn.innerText = isVideoEnabled ? '关视频' : '开视频';
                btn.style.background = isVideoEnabled ? '#6c757d' : '#28a745';
            }
        }

        // --- WebRTC 数据通道与定位同步扩展 ---
        function setupDataConnection(conn) {
            dataConnection = conn;
            dataConnection.on('open', () => {
                log('<span style="color:#00ff00;">数据通道建立，自动同步坐标数据已开启！</span>');
                // 连接成功时立即将自己的当前坐标推送给对方
                if (myCurrentPos) sendLocationUpdate(myCurrentPos.lat, myCurrentPos.lng);
            });

            dataConnection.on('data', data => {
                if (data.type === 'text_sync') {
                    document.getElementById('custom-textarea').value = data.content;
                } else if (data.type === 'location_sync') {
                    // 接收对方实时传输的地图 GPS 定位
                    updateFriendLocationOnMap(data.lat, data.lng);
                } else if (data.type === 'file_transfer') {
                    log(`收到文件: <b>${data.fileName}</b>`);
                    const receiveArea = document.getElementById('file-receive-area');
                    receiveArea.style.display = 'flex';
                    document.getElementById('file-info').innerText = `文件: ${data.fileName}`;

                    const isText = data.fileType.startsWith('text/') || data.fileName.endsWith('.txt') || data.fileName.endsWith('.md');
                    document.getElementById('show-text-btn').style.display = isText ? 'inline-block' : 'none';

                    document.getElementById('download-btn').onclick = () => {
                        const blob = new Blob([data.fileData], { type: data.fileType });
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = data.fileName;
                        a.click();
                    };

                    document.getElementById('show-text-btn').onclick = () => {
                        const text = new TextDecoder('utf-8').decode(data.fileData);
                        document.getElementById('custom-textarea').value = text;
                        onTextInput();
                    };
                }
            });
        }

        function sendLocationUpdate(lat, lng) {
            if (dataConnection && dataConnection.open) {
                dataConnection.send({ type: 'location_sync', lat, lng });
            }
        }

        function onTextInput() {
            const textContent = document.getElementById('custom-textarea').value;
            if (dataConnection && dataConnection.open) {
                dataConnection.send({ type: 'text_sync', content: textContent });
            }
        }

        function loadLocalDocToBox() {
            const file = document.getElementById('file-input').files[0];
            if (!file) return alert('请先选择文件！');
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('custom-textarea').value = e.target.result;
                onTextInput();
            };
            reader.readAsText(file, 'UTF-8');
        }

        function sendFile() {
            const file = document.getElementById('file-input').files[0];
            if (!file) return alert('请选择文件！');
            if (!dataConnection || !dataConnection.open) return alert('请先连接对方！');

            const reader = new FileReader();
            reader.onload = e => {
                dataConnection.send({
                    type: 'file_transfer',
                    fileName: file.name,
                    fileSize: file.size,
                    fileType: file.type,
                    fileData: e.target.result
                });
                log('文件发送完毕！');
            };
            reader.readAsArrayBuffer(file);
        }

        function saveTextToTxt() {
            const text = document.getElementById('custom-textarea').value;
            if (!text) return alert('内容为空！');
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `协作文档_${Date.now()}.txt`;
            a.click();
        }

        // --- TAB 2: 地图与自动 GPS 引擎 ---
        let meMarker = null, friendMarker = null, track = [];
        let myCurrentPos = null, friendCurrentPos = null;
        let starMarkers = [], starLeafletMarkers = [], searchMarker = null;

        const personIcon = L.divIcon({ className: '', html: '<div class="person-icon">🧍</div>', iconSize: [34, 42], iconAnchor: [17, 41], popupAnchor: [0, -38] });
        const greenIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], shadowSize: [41, 41]
        });
        const starIcon = L.divIcon({ className: 'star-marker', html: '⭐', iconSize: [24, 24], iconAnchor: [12, 12] });

        function initMap() {
            leafletMap = L.map('map', { zoomControl: true }).setView([20, 0], 2);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19, attribution: '© OpenStreetMap contributors', crossOrigin: true
            }).addTo(leafletMap);

            const line = L.polyline([], { color: '#2563eb', weight: 5, opacity: 0.8 }).addTo(leafletMap);

            // 自动开始高精度 GPS 定位追踪
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    pos => {
                        const { latitude: lat, longitude: lon, accuracy } = pos.coords;
                        myCurrentPos = { lat, lng: lon };

                        document.getElementById('my-coordinates').innerText = `纬度: ${lat.toFixed(6)} | 经度: ${lon.toFixed(6)} | 精度: ±${Math.round(accuracy)}m`;

                        if (!meMarker) {
                            meMarker = L.marker([lat, lon], { icon: personIcon }).addTo(leafletMap);
                            meMarker.bindPopup('<b>🧍 我的位置</b>');
                            leafletMap.setView([lat, lon], 17);
                        } else {
                            meMarker.setLatLng([lat, lon]);
                        }

                        // 异步更新我的反向地理编码地址
                        fetchAddress(lat, lon, 'my-address', '我的位置');

                        // 记录与绘制轨迹
                        if (!track.length || leafletMap.distance(track[track.length - 1], [lat, lon]) >= 3) {
                            track.push([lat, lon]);
                            line.setLatLngs(track);
                        }

                        // 实时通过 DataChannel 将坐标推送到对方
                        sendLocationUpdate(lat, lon);
                    },
                    err => {
                        document.getElementById('my-address').innerText = '无法获取 GPS 定位: ' + err.message;
                    },
                    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
                );
            } else {
                document.getElementById('my-address').innerText = '当前浏览器不支持 GPS 定位';
            }

            // 星标事件支持
            let pressTimer;
            leafletMap.on('mousedown touchstart', e => { pressTimer = setTimeout(() => toggleStar(e.latlng.lat, e.latlng.lng), 800); });
            leafletMap.on('mouseup touchend dragstart zoomstart', () => clearTimeout(pressTimer));
            leafletMap.on('contextmenu', e => toggleStar(e.latlng.lat, e.latlng.lng));

            document.getElementById('clear-track').onclick = () => { track = []; line.setLatLngs([]); };
        }

        // 更新对方在地图上的 Marker 和地址
        function updateFriendLocationOnMap(lat, lng) {
            friendCurrentPos = { lat, lng };
            document.getElementById('friend-coordinates').innerText = `纬度: ${lat.toFixed(6)} | 经度: ${lng.toFixed(6)}`;

            if (!friendMarker) {
                friendMarker = L.marker([lat, lng], { icon: greenIcon, zIndexOffset: 500 }).addTo(leafletMap);
                friendMarker.bindPopup('<b>🟢 对方的位置</b>');
            } else {
                friendMarker.setLatLng([lat, lng]);
            }

            fetchAddress(lat, lng, 'friend-address', '对方的位置');
        }

        // 反向地理编码（获取精准文本地址）
        async function fetchAddress(lat, lon, elementId, label) {
            const cacheKey = `geo_${lat.toFixed(4)}_${lon.toFixed(4)}`;
            const cached = localStorage.getItem(cacheKey);
            if (cached) {
                document.getElementById(elementId).innerText = cached;
                return;
            }

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&accept-language=zh-CN`);
                if (res.ok) {
                    const data = await res.json();
                    const addr = data.display_name || `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
                    document.getElementById(elementId).innerText = addr;
                    localStorage.setItem(cacheKey, addr);
                }
            } catch (_) {
                document.getElementById(elementId).innerText = `坐标: ${lat.toFixed(6)}, ${lon.toFixed(6)}`;
            }
        }

        // 地图定位与离线/搜索逻辑
        document.getElementById('center-me-btn').onclick = () => {
            if (myCurrentPos && leafletMap) {
                leafletMap.setView([myCurrentPos.lat, myCurrentPos.lng], 17);
                if (meMarker) meMarker.openPopup();
            } else {
                alert('GPS 定位获取中，请稍候...');
            }
        };

        document.getElementById('search-btn').onclick = async () => {
            const q = document.getElementById('search-input').value.trim();
            if (!q) return alert('请输入搜索内容！');
            try {
                const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`);
                const d = await r.json();
                if (d && d.length > 0) {
                    const lat = parseFloat(d[0].lat), lon = parseFloat(d[0].lon);
                    leafletMap.setView([lat, lon], 16);
                    if (searchMarker) leafletMap.removeLayer(searchMarker);
                    searchMarker = L.marker([lat, lon]).addTo(leafletMap).bindPopup(`<b>🔍 搜索结果:</b><br>${d[0].display_name}`).openPopup();
                } else { alert('未找到该地址！'); }
            } catch (_) { alert('搜索请求失败'); }
        };

        // 星标与 TXT 逻辑
        function renderStars() {
            starLeafletMarkers.forEach(m => leafletMap.removeLayer(m));
            starLeafletMarkers = [];
            starMarkers.forEach(item => {
                const m = L.marker([item.lat, item.lon], { icon: starIcon }).addTo(leafletMap)
                    .bindPopup(`<b>⭐ 标记点</b><br>${item.address}`);
                starLeafletMarkers.push(m);
            });
            localStorage.setItem('saved_stars', JSON.stringify(starMarkers));
        }

        async function toggleStar(lat, lon) {
            const idx = starMarkers.findIndex(m => Math.abs(m.lat - lat) < 0.0003 && Math.abs(m.lon - lon) < 0.0003);
            if (idx !== -1) {
                starMarkers.splice(idx, 1);
                renderStars();
            } else {
                starMarkers.push({ lat, lon, address: `坐标: ${lat.toFixed(6)}, ${lon.toFixed(6)}` });
                renderStars();
            }
        }

        document.getElementById('export-txt').onclick = () => {
            if (!starMarkers.length) return alert('暂无星标！');
            let txt = '# Starred Locations\n';
            starMarkers.forEach(m => { txt += `${m.lat.toFixed(6)}, ${m.lon.toFixed(6)}, ${m.address}\n`; });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain;charset=utf-8' }));
            a.download = 'star_markers.txt';
            a.click();
        };

        document.getElementById('import-txt').onchange = e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = evt => {
                const lines = evt.target.result.split('\n'), imported = [];
                lines.forEach(l => {
                    l = l.trim();
                    if (!l || l.startsWith('#')) return;
                    const p = l.split(',');
                    if (p.length >= 2) {
                        imported.push({ lat: parseFloat(p[0]), lon: parseFloat(p[1]), address: p.slice(2).join(',').trim() || '未设定地址' });
                    }
                });
                if (imported.length) { starMarkers = imported; renderStars(); alert(`已加载 ${imported.length} 个标注！`); }
            };
            reader.readAsText(file);
        };

        // 离线地图下载与清除
        document.getElementById('download-offline').onclick = async () => {
            if (!myCurrentPos) return alert('等待 GPS 获取当前位置...');
            const p = myCurrentPos;
            alert('正在下载周围 5km 离线瓦片...');
            const cache = await caches.open('offline-map-tiles');
            let downloaded = 0;
            for (let z of [13, 14, 15, 16]) {
                const n = Math.pow(2, z), latRad = p.lat * Math.PI / 180;
                const cx = Math.floor((p.lng + 180) / 360 * n), cy = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
                for (let x = cx - 2; x <= cx + 2; x++) {
                    for (let y = cy - 2; y <= cy + 2; y++) {
                        const sub = ['a', 'b', 'c'][(x + y) % 3], u = `https://${sub}.tile.openstreetmap.org/${z}/${x}/${y}.png`;
                        try { await cache.add(u); downloaded++; } catch (_) {}
                    }
                }
            }
            alert(`已完成 ${downloaded} 块地图瓦片缓存！`);
        };

        document.getElementById('clear-offline').onclick = async () => {
            const deleted = await caches.delete('offline-map-tiles');
            alert(deleted ? '离线地图缓存已成功删除！' : '未找到相关缓存');
        };

        // 屏幕 WakeLock
        let wakeLock = null;
        const wakeLockToggle = document.getElementById('wakelock-toggle');
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                }
            } catch (_) {}
        }
        wakeLockToggle.addEventListener('change', () => {
            if (wakeLockToggle.checked) requestWakeLock();
            else if (wakeLock) wakeLock.release();
        });

        // 页面初始化加载
        window.addEventListener('load', () => {
            initMap();
            const localStars = localStorage.getItem('saved_stars');
            if (localStars) { try { starMarkers = JSON.parse(localStars); renderStars(); } catch (_) {} }
        });

        // 分割线拖拽
        const resizer = document.getElementById('resizer');
        const videoContainer = document.getElementById('video-container');
        let isResizing = false;
        resizer.addEventListener('mousedown', () => isResizing = true);
        resizer.addEventListener('touchstart', () => isResizing = true);
        window.addEventListener('mousemove', e => {
            if (isResizing && e.clientY > 80 && e.clientY < window.innerHeight - 200) {
                videoContainer.style.height = `${e.clientY}px`;
            }
        });
        window.addEventListener('touchmove', e => {
            if (isResizing && e.touches[0].clientY > 80 && e.touches[0].clientY < window.innerHeight - 200) {
                videoContainer.style.height = `${e.touches[0].clientY}px`;
            }
        });
        window.addEventListener('mouseup', () => isResizing = false);
        window.addEventListener('touchend', () => isResizing = false);
    </script>
</body>
</html>
