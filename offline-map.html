<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Map & Route Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; background-color: #f4f4f9; }
    .sidebar { width: 300px; background-color: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); overflow-y: auto; display: flex; flex-direction: column; z-index: 999; }
    .header { background-color: #007bff; color: white; padding: 16px; text-align: center; border-bottom: 2px solid #0056b3; }
    .header h1 { font-size: 1.2rem; margin-bottom: 8px; }
    .content { flex: 1; overflow-y: auto; padding: 12px; }
    .section { margin-bottom: 16px; background-color: #f9f9f9; padding: 12px; border-radius: 8px; border-left: 4px solid #007bff; }
    .section-title { font-weight: bold; font-size: 0.95rem; color: #333; margin-bottom: 10px; }
    .info-box { background-color: #e7f3ff; padding: 8px; border-radius: 4px; font-size: 0.85rem; color: #0056b3; margin-bottom: 8px; line-height: 1.3; }
    .info-text { font-size: 0.9rem; margin-bottom: 4px; }
    .button-group { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .btn { flex: 1; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: bold; min-width: 100px; transition: background-color 0.3s; }
    .btn-primary { background-color: #007bff; color: white; }
    .btn-primary:hover { background-color: #0056b3; }
    .btn-success { background-color: #28a745; color: white; }
    .btn-success:hover { background-color: #218838; }
    .btn-danger { background-color: #dc3545; color: white; }
    .btn-danger:hover { background-color: #c82333; }
    .btn-warning { background-color: #ffc107; color: #333; }
    .btn-warning:hover { background-color: #e0a800; }
    .btn:disabled { background-color: #ccc; cursor: not-allowed; }
    .status { padding: 8px; border-radius: 4px; font-size: 0.85rem; margin-bottom: 8px; }
    .status-online { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status-offline { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .progress-bar { width: 100%; height: 20px; background-color: #ddd; border-radius: 4px; overflow: hidden; margin: 8px 0; }
    .progress-fill { height: 100%; background-color: #28a745; width: 0%; transition: width 0.3s; }
    .map-container { flex: 1; display: flex; flex-direction: column; position: relative; }
    #map { flex: 1; width: 100%; }
    .stat-item { background-color: #fff; border: 1px solid #ddd; padding: 8px; margin-bottom: 6px; border-radius: 4px; font-size: 0.85rem; }
    .stat-label { font-weight: bold; color: #333; }
    .stat-value { color: #007bff; font-size: 0.95rem; }
    .loading { text-align: center; color: #666; font-size: 0.85rem; }
    .storage-info { background-color: #fff3cd; padding: 8px; border-radius: 4px; font-size: 0.8rem; color: #856404; margin-bottom: 8px; }
    
    /* 地图右上方居中按钮样式 */
    .leaflet-control-center {
      background: white;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 4px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
    }
    .leaflet-control-center:hover {
      background-color: #f4f4f4;
    }

    @media (max-width: 768px) { body { flex-direction: column; } .sidebar { width: 100%; height: 35%; } .map-container { height: 65%; } }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="header">
      <h1>🗺️ Offline Map</h1>
      <p>Download & Track Routes</p>
    </div>
    <div class="content">
      <!-- Status Section -->
      <div class="section">
        <div class="section-title">Status</div>
        <div id="online-status" class="status status-online">🟢 Online</div>
        <div class="info-box" id="location-info">📍 Waiting for location...</div>
      </div>

      <!-- Download Maps Section -->
      <div class="section">
        <div class="section-title">📥 Download Maps</div>
        <div class="info-text">Download map within 5km for offline use</div>
        <div class="button-group">
          <button class="btn btn-primary" onclick="downloadMaps()">Download Map</button>
          <button class="btn btn-danger" onclick="clearMaps()">Clear Maps</button>
        </div>
        <div id="download-progress" style="display:none;">
          <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <div class="loading" id="progress-text">0/0 tiles</div>
        </div>
        <div class="storage-info" id="storage-info">Storage: Calculating...</div>
      </div>

      <!-- Route Tracking Section -->
      <div class="section">
        <div class="section-title">📍 Route Tracking</div>
        <div class="button-group">
          <button class="btn btn-success" id="track-btn" onclick="toggleTracking()">Start Tracking</button>
          <button class="btn btn-warning" onclick="resetRoute()">Reset Route</button>
        </div>
        <div id="tracking-stats">
          <div class="stat-item">
            <span class="stat-label">Distance:</span>
            <span class="stat-value" id="distance">0 km</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Duration:</span>
            <span class="stat-value" id="duration">00:00:00</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Points:</span>
            <span class="stat-value" id="points">0</span>
          </div>
        </div>
        <button class="btn btn-primary" onclick="downloadRoute()" style="width: 100%; margin-top: 8px;">💾 Save Route</button>
      </div>
    </div>
  </div>

  <div class="map-container">
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map;
    let userLocation = { lat: 0, lon: 0, accuracy: 0 };
    let isTracking = false;
    let trackingData = { points: [], startTime: null, startLocation: null };
    let routePolyline;
    let userMarker;
    let db;
    let lastAddress = "";
    let watchId = null; // 实时定位监听器 ID
    let durationTimer = null; // 计时器

    // 1. 初始化 IndexedDB
    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('OfflineMapTilesDB', 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('tiles')) {
            db.createObjectStore('tiles');
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        request.onerror = (e) => reject(e);
      });
    }

    function saveTileToDB(key, blob) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('tiles', 'readwrite');
        const store = tx.objectStore('tiles');
        store.put(blob, key);
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e);
      });
    }

    function getTileFromDB(key) {
      return new Promise((resolve) => {
        if (!db) return resolve(null);
        const tx = db.transaction('tiles', 'readonly');
        const store = tx.objectStore('tiles');
        const request = store.get(key);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => resolve(null);
      });
    }

    // 2. 初始化地图
    async function initMap() {
      await initDB();

      map = L.map('map').setView([0, 0], 15);

      const OfflineTileLayer = L.TileLayer.extend({
        createTile: function (coords, done) {
          const tile = document.createElement('img');
          const tileKey = `tile_${coords.z}_${coords.x}_${coords.y}`;
          const url = this.getTileUrl(coords);

          if (navigator.onLine) {
            tile.src = url;
            tile.onload = () => done(null, tile);
            tile.onerror = async () => {
              const blob = await getTileFromDB(tileKey);
              if (blob) tile.src = URL.createObjectURL(blob);
              done(null, tile);
            };
          } else {
            getTileFromDB(tileKey).then((blob) => {
              if (blob) tile.src = URL.createObjectURL(blob);
              else tile.src = '';
              done(null, tile);
            });
          }
          return tile;
        }
      });

      const tileLayer = new OfflineTileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      map.tileLayer = tileLayer;
      addCenterControl();
    }

    // 居中控件
    function addCenterControl() {
      const CenterControl = L.Control.extend({
        options: { position: 'topright' },
        onAdd: function (map) {
          const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-center');
          container.innerHTML = '🎯';
          container.title = "Re-center Map";
          container.onclick = function () {
            if (userLocation.lat !== 0 && userLocation.lon !== 0) {
              map.setView([userLocation.lat, userLocation.lon], map.getZoom());
            } else {
              alert('Location not available yet');
            }
          };
          return container;
        }
      });
      map.addControl(new CenterControl());
    }

    // 网络切换逻辑
    function updateOnlineStatus() {
      const statusDiv = document.getElementById('online-status');
      if (navigator.onLine) {
        statusDiv.className = 'status status-online';
        statusDiv.textContent = '🟢 Online - Internet Available';
      } else {
        statusDiv.className = 'status status-offline';
        statusDiv.textContent = '🔴 Offline - Using Cached Maps';
      }
      if (userLocation.lat !== 0) {
        updateLocationDisplay(userLocation.lat, userLocation.lon, userLocation.accuracy);
      }
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    // 地址请求防抖，避免移动太快时过度调用 API
    let addressTimeout = null;
    async function fetchAddress(lat, lon) {
      if (!navigator.onLine) return null;
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
        if (response.ok) {
          const data = await response.json();
          return data.display_name;
        }
      } catch (e) {
        console.error('Failed to get address:', e);
      }
      return null;
    }

    function updateLocationDisplay(lat, lon, accuracy) {
      if (navigator.onLine) {
        clearTimeout(addressTimeout);
        addressTimeout = setTimeout(async () => {
          const address = await fetchAddress(lat, lon);
          if (address) {
            lastAddress = address;
            document.getElementById('location-info').innerHTML = `🏠 ${address}<br><small style="color:#666;">Accuracy: ${Math.round(accuracy)}m</small>`;
            if (userMarker) userMarker.bindPopup(`<b>${lastAddress}</b><br>Accuracy: ${Math.round(accuracy)}m`);
          }
        }, 1000); // 停止移动 1 秒后查询详细地址，提升性能
      } else {
        document.getElementById('location-info').innerHTML = `📍 ${lat.toFixed(5)}, ${lon.toFixed(5)}<br><small style="color:#666;">Accuracy: ${Math.round(accuracy)}m</small>`;
        if (userMarker) userMarker.bindPopup(`<b>You are here</b><br>Accuracy: ${Math.round(accuracy)}m`);
      }
    }

    // 3. 高频实时定位系统 (watchPosition)
    function startRealtimeLocation() {
      if (!navigator.geolocation) {
        document.getElementById('location-info').textContent = 'Geolocation is not supported';
        return;
      }

      const options = {
        enableHighAccuracy: true, // 开启最高精度 (使用 GPS)
        maximumAge: 1000,         // 允许 1 秒内的缓存
        timeout: 10000            // 超时限制 10 秒
      };

      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const isFirst = (userLocation.lat === 0 && userLocation.lon === 0);
          userLocation.lat = position.coords.latitude;
          userLocation.lon = position.coords.longitude;
          userLocation.accuracy = position.coords.accuracy;

          if (isFirst) {
            map.setView([userLocation.lat, userLocation.lon], 15);
          }

          // 更新蓝点位置
          if (userMarker) {
            userMarker.setLatLng([userLocation.lat, userLocation.lon]);
          } else {
            userMarker = L.circleMarker([userLocation.lat, userLocation.lon], {
              radius: 8,
              fillColor: '#007bff',
              color: '#fff',
              weight: 2,
              opacity: 1,
              fillOpacity: 0.8
            }).addTo(map);
          }

          // 基础经纬度立刻呈现，提高响应感
          if (!lastAddress || !navigator.onLine) {
            document.getElementById('location-info').innerHTML = `📍 ${userLocation.lat.toFixed(5)}, ${userLocation.lon.toFixed(5)}<br><small style="color:#666;">Accuracy: ${Math.round(userLocation.accuracy)}m</small>`;
          }
          updateLocationDisplay(userLocation.lat, userLocation.lon, userLocation.accuracy);

          // 只要在 Track，即时记录轨迹点
          if (isTracking) {
            recordTrackingPoint();
          }
        },
        (error) => {
          console.error('Realtime Geolocation error:', error);
          document.getElementById('location-info').textContent = 'Location access denied / searching...';
        },
        options
      );
    }

    // 4. 下载离线地图
    async function downloadMaps() {
      if (!navigator.onLine) {
        alert('You need internet to download maps');
        return;
      }

      if (userLocation.lat === 0) {
        alert('Please enable location first');
        return;
      }

      document.getElementById('download-progress').style.display = 'block';
      const progressFill = document.getElementById('progress-fill');
      const progressText = document.getElementById('progress-text');

      try {
        const radiusKm = 5;
        const currentZoom = map.getZoom() || 15;
        const zoomLevels = [Math.max(currentZoom - 1, 12), currentZoom, Math.min(currentZoom + 1, 18)];

        function latLngToTile(lat, lng, z) {
          const n = Math.pow(2, z);
          const x = Math.floor(((lng + 180) / 360) * n);
          const latRad = (lat * Math.PI) / 180;
          const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
          return { x, y, z };
        }

        let tiles = [];
        zoomLevels.forEach(zoom => {
          const metersPerPixel = (40075016.686 * Math.cos((userLocation.lat * Math.PI) / 180)) / Math.pow(2, zoom + 8);
          const radiusPixels = (radiusKm * 1000) / metersPerPixel;
          const tileRadius = Math.ceil(radiusPixels / 256);
          const centerTile = latLngToTile(userLocation.lat, userLocation.lon, zoom);

          for (let dx = -tileRadius; dx <= tileRadius; dx++) {
            for (let dy = -tileRadius; dy <= tileRadius; dy++) {
              tiles.push({ x: centerTile.x + dx, y: centerTile.y + dy, z: zoom });
            }
          }
        });

        const totalTiles = tiles.length;
        let downloadedTiles = 0;

        for (const tile of tiles) {
          const tileUrl = `https://tile.openstreetmap.org/${tile.z}/${tile.x}/${tile.y}.png`;
          const tileKey = `tile_${tile.z}_${tile.x}_${tile.y}`;

          try {
            const response = await fetch(tileUrl);
            if (response.ok) {
              const blob = await response.blob();
              await saveTileToDB(tileKey, blob);
            }
          } catch (e) {
            console.error(`Failed to download tile ${tileKey}:`, e);
          }

          downloadedTiles++;
          const progress = (downloadedTiles / totalTiles) * 100;
          progressFill.style.width = progress + '%';
          progressText.textContent = `${downloadedTiles}/${totalTiles} tiles downloaded`;
        }

        alert(`Successfully downloaded ${downloadedTiles} map tiles for offline use!`);
        updateStorageInfo();
      } catch (error) {
        console.error('Download error:', error);
        alert('Error downloading maps');
      } finally {
        document.getElementById('download-progress').style.display = 'none';
      }
    }

    function clearMaps() {
      if (confirm('Delete all cached maps? This will free up storage.')) {
        const tx = db.transaction('tiles', 'readwrite');
        const store = tx.objectStore('tiles');
        const clearReq = store.clear();
        clearReq.onsuccess = () => {
          updateStorageInfo();
          alert('Deleted all cached tiles.');
        };
      }
    }

    // 5. 极速更新的路线追踪系统
    function toggleTracking() {
      const btn = document.getElementById('track-btn');
      if (!isTracking) {
        isTracking = true;
        trackingData = { points: [], startTime: Date.now(), startLocation: { ...userLocation } };
        btn.textContent = 'Stop Tracking';
        btn.className = 'btn btn-danger';
        
        // 轨迹绘制（粗红色线）
        routePolyline = L.polyline([], { color: '#ff3333', weight: 6, opacity: 0.85 }).addTo(map);

        // 立刻抓取当前点
        recordTrackingPoint();

        // 启动单独的时间定时器 (每秒刷新计时)
        durationTimer = setInterval(updateDurationOnly, 1000);
      } else {
        isTracking = false;
        btn.textContent = 'Start Tracking';
        btn.className = 'btn btn-success';
        if (durationTimer) clearInterval(durationTimer);
      }
    }

    function recordTrackingPoint() {
      if (!isTracking) return;

      const newPt = { lat: userLocation.lat, lon: userLocation.lon, timestamp: Date.now() };
      const points = trackingData.points;

      // 剔除微小漂移（如果距离上一点小于 1 米，则忽略不计，防止原地站立时距离猛增）
      if (points.length > 0) {
        const lastPt = points[points.length - 1];
        const dist = calculateDistance(lastPt.lat, lastPt.lon, newPt.lat, newPt.lon);
        if (dist < 0.001) return; // 小于 1 米忽略
      }

      points.push(newPt);

      // 即时画线
      if (routePolyline) {
        routePolyline.addLatLng([newPt.lat, newPt.lon]);
      }

      // 即时更新数据
      updateStats();
    }

    function updateStats() {
      const points = trackingData.points;
      document.getElementById('points').textContent = points.length;

      // 实时计算总距离
      let distance = 0;
      for (let i = 1; i < points.length; i++) {
        const p1 = points[i - 1];
        const p2 = points[i];
        distance += calculateDistance(p1.lat, p1.lon, p2.lat, p2.lon);
      }
      
      // 当距离小于 1km 时，显示精确的米数以增加流畅感知，大于等于 1km 显示 km
      if (distance < 1) {
        document.getElementById('distance').textContent = (distance * 1000).toFixed(0) + ' m';
      } else {
        document.getElementById('distance').textContent = distance.toFixed(3) + ' km';
      }
    }

    function updateDurationOnly() {
      if (trackingData.startTime) {
        const elapsed = Math.floor((Date.now() - trackingData.startTime) / 1000);
        const hours = Math.floor(elapsed / 3600);
        const minutes = Math.floor((elapsed % 3600) / 60);
        const seconds = elapsed % 60;
        document.getElementById('duration').textContent = 
          `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // 地球半径 km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function resetRoute() {
      if (confirm('Clear the current route?')) {
        isTracking = false;
        if (durationTimer) clearInterval(durationTimer);
        trackingData = { points: [], startTime: null, startLocation: null };
        if (routePolyline) {
          map.removeLayer(routePolyline);
          routePolyline = null;
        }
        document.getElementById('track-btn').textContent = 'Start Tracking';
        document.getElementById('track-btn').className = 'btn btn-success';
        document.getElementById('distance').textContent = '0 km';
        document.getElementById('duration').textContent = '00:00:00';
        document.getElementById('points').textContent = '0';
      }
    }

    function downloadRoute() {
      if (trackingData.points.length === 0) {
        alert('No route to save');
        return;
      }

      const routeData = {
        startTime: new Date(trackingData.startTime).toISOString(),
        points: trackingData.points,
        startLocation: trackingData.startLocation
      };

      const dataStr = JSON.stringify(routeData, null, 2);
      const dataBlob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(dataBlob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `route_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      alert('Route saved!');
    }

    function updateStorageInfo() {
      if (!db) return;
      const tx = db.transaction('tiles', 'readonly');
      const store = tx.objectStore('tiles');
      const countReq = store.count();

      countReq.onsuccess = () => {
        const tileCount = countReq.result;
        const estMB = ((tileCount * 20) / 1024).toFixed(2);
        document.getElementById('storage-info').textContent = 
          `Storage: ${tileCount} tiles (~${estMB} MB used in IndexedDB)`;
      };
    }

    // 程序入口
    window.addEventListener('load', async () => {
      await initMap();
      updateOnlineStatus();
      updateStorageInfo();
      startRealtimeLocation(); // 开启高频实时定位
    });
  </script>
</body>
</html>
