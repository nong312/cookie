<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friend Location Sharing</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; background-color: #f4f4f9; }
    .sidebar { width: 350px; background-color: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); overflow-y: auto; display: flex; flex-direction: column; z-index: 999; }
    .header { background-color: #007bff; color: white; padding: 16px; text-align: center; border-bottom: 2px solid #0056b3; }
    .header h1 { font-size: 1.3rem; margin-bottom: 8px; }
    .header p { font-size: 0.85rem; opacity: 0.9; }
    .content { flex: 1; overflow-y: auto; padding: 12px; }
    .section { margin-bottom: 16px; background-color: #f9f9f9; padding: 12px; border-radius: 8px; border-left: 4px solid #007bff; }
    .section-title { font-weight: bold; font-size: 0.95rem; color: #333; margin-bottom: 8px; display: flex; align-items: center; }
    .section-title::before { content: '▶'; margin-right: 6px; font-size: 0.8rem; }
    .my-location-info { background-color: #e7f3ff; padding: 8px; border-radius: 4px; font-size: 0.85rem; color: #0056b3; margin-bottom: 8px; }
    .address-text { font-size: 0.9rem; font-weight: bold; word-break: break-word; margin-top: 4px; }
    .coordinates { font-size: 0.8rem; color: #666; margin-top: 4px; }
    .friend-add { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .friend-add input { flex: 1; min-width: 100px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.85rem; }
    .friend-add button { padding: 8px 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
    .friend-add button:hover { background-color: #218838; }
    .friend-item { background-color: #fff; border: 1px solid #ddd; padding: 8px; margin-bottom: 6px; border-radius: 4px; font-size: 0.85rem; }
    .friend-name { font-weight: bold; color: #333; margin-bottom: 4px; }
    .friend-contact { color: #666; font-size: 0.8rem; margin-bottom: 6px; word-break: break-all; }
    .friend-actions { display: flex; gap: 4px; }
    .friend-actions button { flex: 1; padding: 4px 6px; font-size: 0.75rem; border: none; border-radius: 3px; cursor: pointer; color: white; }
    .btn-view { background-color: #007bff; }
    .btn-view:hover { background-color: #0056b3; }
    .btn-delete { background-color: #dc3545; }
    .btn-delete:hover { background-color: #c82333; }
    .share-section { display: flex; flex-direction: column; gap: 6px; }
    .share-button { padding: 10px; background-color: #ffc107; color: #333; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
    .share-button:hover { background-color: #e0a800; }
    .copy-link { padding: 8px; background-color: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    .copy-link:hover { background-color: #5a6268; }
    .share-link { background-color: #fff; padding: 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.75rem; word-break: break-all; color: #0056b3; max-height: 60px; overflow-y: auto; }
    .facility-item { background-color: #fff; border: 1px solid #ddd; padding: 8px; margin-bottom: 6px; border-radius: 4px; font-size: 0.85rem; }
    .facility-name { font-weight: bold; color: #333; margin-bottom: 3px; }
    .facility-type { display: inline-block; background-color: #007bff; color: white; padding: 2px 6px; border-radius: 3px; font-size: 0.7rem; margin-bottom: 4px; margin-right: 4px; }
    .facility-distance { color: #666; font-size: 0.8rem; }
    .map-container { flex: 1; display: flex; flex-direction: column; }
    #map { flex: 1; width: 100%; }
    .no-items { color: #999; font-size: 0.85rem; text-align: center; padding: 8px; }
    .loading { color: #666; font-size: 0.85rem; text-align: center; padding: 8px; }
    .tooltip { position: relative; display: inline-block; color: #0056b3; cursor: help; text-decoration: underline; font-size: 0.8rem; }
    .tooltip .tooltiptext { visibility: hidden; width: 150px; background-color: #333; color: #fff; text-align: center; border-radius: 6px; padding: 5px; position: absolute; z-index: 1; bottom: 125%; left: 50%; margin-left: -75px; opacity: 0; transition: opacity 0.3s; font-size: 0.75rem; text-decoration: none; }
    .tooltip:hover .tooltiptext { visibility: visible; opacity: 1; }
    @media (max-width: 768px) { body { flex-direction: column; } .sidebar { width: 100%; height: 40%; } .map-container { height: 60%; } }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="header">
      <h1>📍 Location Sharing</h1>
      <p>Share locations with friends & find nearby facilities</p>
    </div>
    <div class="content">
      <div class="section">
        <div class="section-title">My Location</div>
        <div class="my-location-info">
          <div id="address-text">Fetching location...</div>
          <div class="coordinates" id="coordinates-text"></div>
        </div>
      </div>
      <div class="section">
        <div class="section-title">Friends</div>
        <div class="friend-add">
          <input type="text" id="friend-name" placeholder="Friend's name">
          <input type="text" id="friend-contact" placeholder="Email or phone">
          <button onclick="addFriend()">Add</button>
        </div>
        <div id="friends-list"></div>
      </div>
      <div class="section share-section">
        <div class="section-title">Share</div>
        <button class="share-button" onclick="generateShareLink()">📤 Generate Share Link</button>
        <button class="copy-link" onclick="copyToClipboard()">Copy Link</button>
        <div id="share-link" class="share-link" style="display: none;"></div>
      </div>
      <div class="section">
        <div class="section-title">
          Nearby Facilities
          <span class="tooltip">
            ⓘ
            <span class="tooltiptext">Public facilities within 1 km from your location</span>
          </span>
        </div>
        <div id="facilities-list" class="loading">Loading facilities...</div>
      </div>
    </div>
  </div>
  <div class="map-container">
    <div id="map"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let userLocation = { lat: 0, lon: 0 };
    let friends = JSON.parse(localStorage.getItem('friends')) || [];
    let map;
    let markers = {};
    let facilitiesMarkers = [];
    
    function initMap() {
      map = L.map('map').setView([0, 0], 2);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);
    }
    
    function getUserLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            userLocation.lat = position.coords.latitude;
            userLocation.lon = position.coords.longitude;
            map.setView([userLocation.lat, userLocation.lon], 16);
            if (markers['me']) markers['me'].remove();
            markers['me'] = L.marker([userLocation.lat, userLocation.lon], {
              icon: L.icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41]
              })
            }).addTo(map).bindPopup("<b>📍 You</b>").openPopup();
            reverseGeocode(userLocation.lat, userLocation.lon);
            loadNearbyFacilities(userLocation.lat, userLocation.lon);
            document.getElementById('coordinates-text').textContent = `${userLocation.lat.toFixed(5)}, ${userLocation.lon.toFixed(5)}`;
          },
          (error) => {
            console.error('Geolocation error:', error);
            document.getElementById('address-text').textContent = "Unable to retrieve location. Please allow location access.";
          }
        );
      }
    }
    
    function reverseGeocode(lat, lon) {
      fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&accept-language=en`)
        .then(response => response.json())
        .then(data => {
          if (data && data.display_name) {
            document.getElementById('address-text').textContent = data.display_name;
          }
        })
        .catch(error => console.error('Geocoding error:', error));
    }
    
    function loadNearbyFacilities(lat, lon) {
      const facilitiesList = document.getElementById('facilities-list');
      facilitiesList.innerHTML = '<div class="loading">Searching for facilities...</div>';
      facilitiesMarkers.forEach(marker => marker.remove());
      facilitiesMarkers = [];
      const facilities = [];
      const queries = [
        { type: 'Public Toilet', query: 'node[amenity=toilets]', icon: '🚻' },
        { type: 'Bus Station', query: 'node[amenity=bus_station]', icon: '🚌' },
        { type: 'Train Station', query: 'node[amenity=train_station]', icon: '🚂' },
        { type: 'Supermarket', query: 'node[shop=supermarket]', icon: '🛒' },
        { type: 'Restaurant', query: 'node[amenity=restaurant]', icon: '🍽️' }
      ];
      let completedQueries = 0;
      queries.forEach(item => {
        const bbox = `${lon - 0.009},${lat - 0.009},${lon + 0.009},${lat + 0.009}`;
        const overpassUrl = `https://overpass-api.de/api/interpreter?data=[bbox:${bbox}];${item.query};out center;`;
        fetch(overpassUrl)
          .then(response => response.json())
          .then(data => {
            if (data.elements) {
              data.elements.forEach(element => {
                const elemLat = element.center?.lat || element.lat;
                const elemLon = element.center?.lon || element.lon;
                if (elemLat && elemLon) {
                  const distance = calculateDistance(lat, lon, elemLat, elemLon);
                  if (distance <= 1) {
                    facilities.push({
                      type: item.type,
                      icon: item.icon,
                      name: element.tags?.name || `${item.type} #${facilities.length + 1}`,
                      lat: elemLat,
                      lon: elemLon,
                      distance: distance
                    });
                    const markerColor = ['red', 'green', 'orange', 'blue', 'purple'][queries.indexOf(item)];
                    const marker = L.marker([elemLat, elemLon], {
                      icon: L.icon({
                        iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${markerColor}.png`,
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                        iconSize: [25, 41],
                        iconAnchor: [12, 41],
                        popupAnchor: [1, -34],
                        shadowSize: [41, 41]
                      })
                    }).addTo(map).bindPopup(`<b>${item.icon} ${element.tags?.name || item.type}</b><br>${distance.toFixed(2)} km`);
                    facilitiesMarkers.push(marker);
                  }
                }
              });
            }
            completedQueries++;
            if (completedQueries === queries.length) {
              displayFacilities(facilities);
            }
          })
          .catch(error => {
            console.error('Overpass API error:', error);
            completedQueries++;
            if (completedQueries === queries.length) {
              displayFacilities(facilities);
            }
          });
      });
    }
    
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }
    
    function displayFacilities(facilities) {
      const facilitiesList = document.getElementById('facilities-list');
      if (facilities.length === 0) {
        facilitiesList.innerHTML = '<div class="no-items">No facilities found nearby</div>';
        return;
      }
      facilities.sort((a, b) => a.distance - b.distance);
      let html = '';
      facilities.forEach(facility => {
        html += `<div class="facility-item"><div class="facility-name">${facility.icon} ${facility.name}</div><span class="facility-type">${facility.type}</span><div class="facility-distance">📏 ${facility.distance.toFixed(2)} km away</div></div>`;
      });
      facilitiesList.innerHTML = html;
    }
    
    function addFriend() {
      const name = document.getElementById('friend-name').value.trim();
      const contact = document.getElementById('friend-contact').value.trim();
      if (!name || !contact) {
        alert('Please enter friend name and contact information');
        return;
      }
      const friend = { id: Date.now(), name: name, contact: contact, lat: 0, lon: 0 };
      friends.push(friend);
      localStorage.setItem('friends', JSON.stringify(friends));
      document.getElementById('friend-name').value = '';
      document.getElementById('friend-contact').value = '';
      displayFriends();
    }
    
    function displayFriends() {
      const friendsList = document.getElementById('friends-list');
      if (friends.length === 0) {
        friendsList.innerHTML = '<div class="no-items">No friends added yet</div>';
        return;
      }
      let html = '';
      friends.forEach(friend => {
        html += `<div class="friend-item"><div class="friend-name">👤 ${friend.name}</div><div class="friend-contact">📧 ${friend.contact}</div><div class="friend-actions"><button class="btn-view" onclick="viewFriendLocation(${friend.id})">View</button><button class="btn-delete" onclick="deleteFriend(${friend.id})">Delete</button></div></div>`;
      });
      friendsList.innerHTML = html;
    }
    
    function deleteFriend(id) {
      if (confirm('Delete this friend?')) {
        friends = friends.filter(f => f.id !== id);
        localStorage.setItem('friends', JSON.stringify(friends));
        if (markers[`friend-${id}`]) markers[`friend-${id}`].remove();
        displayFriends();
      }
    }
    
    function viewFriendLocation(id) {
      alert('In a real app, this would show your friend\'s live location.\n\nYou would need:\n1. A backend server to store locations\n2. Real-time updates (WebSocket/Firebase)\n3. Friend permission system');
    }
    
    function generateShareLink() {
      const link = `${window.location.href}?lat=${userLocation.lat.toFixed(5)}&lon=${userLocation.lon.toFixed(5)}&name=${encodeURIComponent('Friend Location')}`;
      document.getElementById('share-link').textContent = link;
      document.getElementById('share-link').style.display = 'block';
    }
    
    function copyToClipboard() {
      const shareLink = document.getElementById('share-link').textContent;
      if (!shareLink) {
        alert('Please generate a share link first');
        return;
      }
      navigator.clipboard.writeText(shareLink).then(() => {
        alert('Share link copied to clipboard!');
      }).catch(() => {
        alert('Failed to copy. Please try again.');
      });
    }
    
    window.addEventListener('load', () => {
      initMap();
      getUserLocation();
      displayFriends();
    });
    
    setInterval(getUserLocation, 30000);
  </script>
</body>
</html>
