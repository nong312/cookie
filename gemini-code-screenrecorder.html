<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页屏幕录制器</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary-color: #3b82f6;
            --danger-color: #ef4444;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            color: var(--text-color);
        }

        .video-preview {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .placeholder-text {
            position: absolute;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            border-radius: 8px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-start {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-start:hover {
            background-color: #2563eb;
        }

        .btn-stop {
            background-color: var(--danger-color);
            color: white;
        }

        .btn-stop:hover {
            background-color: #dc2626;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .timer {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            font-mono: monospace;
            color: var(--danger-color);
            height: 24px;
        }

        .notice {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.4;
            background-color: rgba(239, 68, 68, 0.1);
            border-left: 3px solid var(--danger-color);
            padding: 8px 12px;
            border-radius: 4px;
        }

        /* Switch Styling */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #475569;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-color);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>网页版屏幕录制器</h1>

    <div class="video-preview">
        <video id="preview" autoplay muted playsinline></video>
        <div id="placeholder" class="placeholder-text">录制开始后将在此预览画面</div>
    </div>

    <div id="timer" class="timer"></div>

    <div class="controls">
        <div class="option-group">
            <span>录制麦克风声音</span>
            <label class="switch">
                <input type="checkbox" id="micToggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="btn-group">
            <button id="startBtn" class="btn-start">开始录屏</button>
            <button id="stopBtn" class="btn-stop" disabled>停止并下载</button>
        </div>
    </div>

    <div class="notice">
        ⚠️ <strong>手机端注意：</strong>受 Android/iOS 系统安全限制，网页录屏只能录制屏幕画面。若想录制微信小视频的声音，请开启上方的“麦克风”并将手机音量外放。
    </div>
</div>

<script>
    let mediaRecorder;
    let recordedChunks = [];
    let startTime;
    let timerInterval;

    const preview = document.getElementById('preview');
    const placeholder = document.getElementById('placeholder');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const micToggle = document.getElementById('micToggle');
    const timerDisplay = document.getElementById('timer');

    startBtn.addEventListener('click', async () => {
        try {
            // 1. 获取屏幕捕获流
            const displayStream = await navigator.mediaDevices.getDisplayMedia({
                video: { mediaSource: "screen" },
                audio: true // 部分桌面浏览器支持勾选系统声音
            });

            let finalStream = displayStream;

            // 2. 如果开启了麦克风，将麦克风音频流混合进来
            if (micToggle.checked) {
                try {
                    const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const audioTracks = micStream.getAudioTracks();
                    if (audioTracks.length > 0) {
                        finalStream.addTrack(audioTracks[0]);
                    }
                } catch (err) {
                    console.warn("无法获取麦克风权限：", err);
                }
            }

            // 3. 设置预览
            preview.srcObject = displayStream;
            placeholder.style.display = 'none';

            // 4. 配置 MediaRecorder
            recordedChunks = [];
            const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') 
                ? 'video/webm;codecs=vp9' 
                : 'video/webm';

            mediaRecorder = new MediaRecorder(finalStream, { mimeType });

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) {
                    recordedChunks.push(e.data);
                }
            };

            mediaRecorder.onstop = saveVideo;

            // 如果用户点击系统自带的“停止共享”按钮
            displayStream.getVideoTracks()[0].onended = () => {
                stopRecording();
            };

            // 5. 启动录制
            mediaRecorder.start();
            startBtn.disabled = true;
            stopBtn.disabled = false;
            micToggle.disabled = true;

            // 启动计时器
            startTimer();

        } catch (err) {
            console.error("启动录屏失败:", err);
            alert("取消或无法启动录屏机制。");
        }
    });

    stopBtn.addEventListener('click', stopRecording);

    function stopRecording() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
        }
        
        // 停止所有轨道
        if (preview.srcObject) {
            preview.srcObject.getTracks().forEach(track => track.stop());
            preview.srcObject = null;
        }

        placeholder.style.display = 'block';
        startBtn.disabled = false;
        stopBtn.disabled = true;
        micToggle.disabled = false;

        stopTimer();
    }

    function saveVideo() {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        
        // 自动触发下载
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = `screen-record-${Date.now()}.webm`;
        document.body.appendChild(a);
        a.click();
        
        setTimeout(() => {
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }, 100);
    }

    function startTimer() {
        startTime = Date.now();
        timerInterval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const secs = String(elapsed % 60).padStart(2, '0');
            timerDisplay.textContent = `● 录制中 ${mins}:${secs}`;
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timerInterval);
        timerDisplay.textContent = '';
    }
</script>

</body>
</html>
