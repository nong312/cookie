<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智能双语语音与日程桌面 (Smart Bilingual Schedule Dashboard)</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-purple: #8b5cf6;
      --accent-purple-hover: #7c3aed;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-red: #f43f5e;
      --input-bg: #1e293b;
      --cell-hover: rgba(255, 255, 255, 0.08);
      --modal-bg: #1e293b;
      --modal-text: #f8fafc;
    }

    body.light-theme {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-purple: #7c3aed;
      --accent-purple-hover: #6d28d9;
      --accent-blue: #0284c7;
      --accent-green: #16a34a;
      --accent-red: #e11d48;
      --input-bg: #f8fafc;
      --cell-hover: #e2e8f0;
      --modal-bg: #ffffff;
      --modal-text: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      transition: background-color 0.3s, color 0.3s;
      font-size: 16px;
    }

    .main-container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 20px;
      backdrop-filter: blur(12px);
    }

    /* Top Action Bar */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--card-border);
      padding-bottom: 12px;
    }

    .app-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btns {
      display: flex;
      gap: 10px;
    }

    .btn {
      font-size: 1rem;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      touch-action: manipulation;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn:active { transform: scale(0.97); }
    .btn-settings { background-color: #64748b; color: #fff; }
    .btn-purple { background-color: var(--accent-purple); color: #fff; }
    .btn-purple:hover { background-color: var(--accent-purple-hover); }
    .btn-blue { background-color: var(--accent-blue); color: #fff; }
    .btn-red { background-color: var(--accent-red); color: #fff; }
    .btn-green { background-color: var(--accent-green); color: #000; }

    /* Dashboard Rows */
    .dashboard-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: rgba(0,0,0,0.1);
      padding: 18px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
    }

    /* Row 1: Weather */
    .row-weather {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .row-weather input {
      padding: 8px 12px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--input-bg);
      color: var(--text-main);
      width: 140px;
    }

    .weather-info {
      font-size: 1.15rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-blue);
    }

    /* Row 2: Battery */
    .row-battery {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .battery-status {
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
    }

    .battery-low {
      color: var(--accent-red);
      font-weight: bold;
      animation: blink 1s infinite alternate;
    }

    @keyframes blink { from { opacity: 1; } to { opacity: 0.4; } }

    /* Row 3: Clock */
    .row-clock {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent-blue);
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    /* Row 4: Quick Timer & Schedule Bar */
    .timer-control-box {
      background: var(--accent-purple);
      padding: 16px;
      border-radius: 14px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 16px rgba(124, 58, 237, 0.25);
    }

    .timer-input-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .timer-input-group label {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .timer-input-group input {
      padding: 8px 12px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.3);
      background: #ffffff;
      color: #0f172a;
      text-align: center;
    }

    .timer-btn-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .timer-display-status {
      font-size: 1.2rem;
      font-weight: bold;
      background: rgba(0,0,0,0.25);
      padding: 8px 14px;
      border-radius: 8px;
      min-height: 42px;
      display: flex;
      align-items: center;
      width: 100%;
      word-break: break-all;
    }

    /* Excel-like Table Section */
    .table-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .table-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .excel-table-container {
      overflow-x: auto;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      max-height: 500px;
      overflow-y: auto;
    }

    .excel-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .excel-table th, .excel-table td {
      border: 1px solid var(--card-border);
      padding: 12px 14px;
      font-size: 1.05rem;
    }

    .excel-table th {
      background: rgba(0,0,0,0.2);
      font-size: 1.1rem;
      font-weight: 700;
      position: sticky;
      top: 0;
      backdrop-filter: blur(8px);
      z-index: 2;
    }

    .excel-table td.cell-editable {
      cursor: pointer;
      word-break: break-word;
      transition: background 0.15s;
    }

    .excel-table td.cell-editable:hover {
      background: var(--cell-hover);
      outline: 2px dashed var(--accent-purple);
    }

    .row-checked {
      text-decoration: line-through;
      opacity: 0.5;
      background: rgba(0,0,0,0.15);
    }

    .col-checkbox { width: 50px; text-align: center; }
    .col-time { width: 35%; }
    .col-content { width: 55%; }

    /* Popout Modal Window */
    .modal-overlay {
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--modal-bg);
      color: var(--modal-text);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 90%;
      max-width: 550px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-title {
      font-size: 1.3rem;
      font-weight: 700;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      font-size: 1.1rem;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--input-bg);
      color: var(--text-main);
      resize: vertical;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(0,0,0,0.1);
      padding: 12px;
      border-radius: 10px;
    }

    .setting-group label {
      font-size: 1rem;
      font-weight: 600;
    }

    .setting-group select, .setting-group input {
      padding: 8px 12px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: var(--input-bg);
      color: var(--text-main);
    }

    /* Live Voice Indicator */
    .status-msg {
      font-size: 0.95rem;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
    }
  </style>
</head>
<body onload="initApp();">

<div class="main-container">
  <!-- Top Bar -->
  <div class="header-bar">
    <div class="app-title">
      <span>⏰</span> 智能双语语音日程桌面
    </div>
    <div class="header-btns">
      <button class="btn btn-red" onclick="stopCurrentSpeech()">⏹ 停止播放</button>
      <button class="btn btn-settings" onclick="openModal('settingsModal')">⚙️ 设置</button>
    </div>
  </div>

  <!-- Dashboard Panel -->
  <div class="dashboard-panel">
    <!-- Row 1: Weather -->
    <div class="row-weather">
      <span>📍 城市:</span>
      <input type="text" id="weatherLoc" placeholder="当前定位" onchange="fetchWeather()">
      <div id="weatherDisplay" class="weather-info">☀️ 加载天气中...</div>
    </div>

    <!-- Row 2: Battery -->
    <div class="row-battery">
      <span>🔋 电量:</span>
      <span id="batteryDisplay" class="battery-status">检测中...</span>
    </div>

    <!-- Row 3: Clock -->
    <div class="row-clock" id="clockDisplay">
      00:00:00
    </div>

    <!-- Row 4: Quick Timer & Schedule Bar -->
    <div class="timer-control-box">
      <div class="timer-input-group">
        <label>⏱ 定时:</label>
        <input type="text" id="timerInput" style="width: 110px;" value="20m" placeholder="例: 10s, 2m, 1h">
        
        <label>🔁 重复:</label>
        <input type="number" id="repeatInput" style="width: 70px;" value="3" min="1">
        <span>次 (times)</span>
      </div>

      <div class="timer-btn-row">
        <button class="btn btn-green" onclick="startTimerAndGenerate()">▶️ START (启动并生成日程)</button>
        <button class="btn" style="background:#475569; color:#fff;" onclick="stopTimerUI()">⏹ 取消定时</button>
      </div>

      <div class="timer-display-status" id="timerStatusText">
        等待启动定时...
      </div>
    </div>
  </div>

  <!-- Excel-like Table Section -->
  <div class="table-section">
    <div class="table-toolbar">
      <div style="display:flex; gap:8px;">
        <button class="btn btn-purple" onclick="sortTable()">🔀 重新排序表格</button>
        <button class="btn btn-blue" onclick="addTableRow()">➕ 添加一行</button>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn" style="background:#059669; color:white;" onclick="exportTxt()">💾 导出 TXT</button>
        <button class="btn" style="background:#0891b2; color:white;" onclick="triggerImportTxt()">📂 导入 TXT</button>
        <input type="file" id="fileTxtInput" accept=".txt,.csv" style="display:none;" onchange="handleTxtImport(event)">
      </div>
    </div>

    <div class="excel-table-container">
      <table class="excel-table" id="excelTable">
        <thead>
          <tr>
            <th class="col-checkbox">✔</th>
            <th class="col-time">📅 触发时间 / 循环规则 (点击修改)</th>
            <th class="col-content">💬 提醒内容 / 音频文件名 (点击修改)</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Rows rendered via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <div id="statusIndicator" class="status-msg" style="display:none;"></div>
</div>

<!-- Modal 1: Settings Window -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-card">
    <div class="modal-title">
      <span>⚙️ 系统设置</span>
      <button class="btn" style="padding:4px 8px; background:none; color:var(--text-main);" onclick="closeModal('settingsModal')">✕</button>
    </div>

    <!-- Theme -->
    <div class="setting-group">
      <label>🎨 背景主题</label>
      <select id="themeSelect" onchange="changeTheme(this.value)">
        <option value="dark">纯黑 / 暗黑风格 (Default Dark)</option>
        <option value="light">明亮 / 浅色风格 (Light White)</option>
      </select>
    </div>

    <!-- Speech Engine Config -->
    <div class="setting-group">
      <label>🇨🇳 中文语音引擎与语速</label>
      <select id="zhVoiceSelect"></select>
      <div style="display:flex; align-items:center; gap:10px; margin-top:6px;">
        <span>语速: <b id="zhRateVal">1.0</b>x</span>
        <input type="range" id="zhRate" min="0.5" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('zhRateVal').innerText=this.value">
      </div>
    </div>

    <div class="setting-group">
      <label>🇺🇸 英文语音引擎与语速</label>
      <select id="enVoiceSelect"></select>
      <div style="display:flex; align-items:center; gap:10px; margin-top:6px;">
        <span>语速: <b id="enRateVal">1.0</b>x</span>
        <input type="range" id="enRate" min="0.5" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('enRateVal').innerText=this.value">
      </div>
    </div>

    <!-- File Extract Settings -->
    <div class="setting-group">
      <label>📖 随机文件导入与朗读设置</label>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
        <div>
          <span style="font-size:0.9rem;">随机抽取行数:</span>
          <input type="number" id="importLineCount" value="5" min="1" style="width:100%;">
        </div>
        <div>
          <span style="font-size:0.9rem;">朗读间隔(秒):</span>
          <input type="number" id="importIntervalSec" value="30" min="5" style="width:100%;">
        </div>
      </div>
      <div style="margin-top:6px;">
        <span style="font-size:0.9rem;">每段重复朗读遍数:</span>
        <input type="number" id="importReadCount" value="2" min="1" style="width:100%;">
      </div>
      <button class="btn btn-purple" style="margin-top:8px;" onclick="triggerImportTxt()">📂 选择并抽取 TXT 文件内容</button>
    </div>

    <button class="btn btn-blue" style="width:100%; margin-top:10px;" onclick="closeModal('settingsModal')">保存并关闭</button>
  </div>
</div>

<!-- Modal 2: Cell Edit / High Visibility Modal -->
<div class="modal-overlay" id="cellEditModal">
  <div class="modal-card">
    <div class="modal-title">
      <span id="editModalHeader">📝 编辑单元格数据</span>
      <button class="btn" style="padding:4px 8px; background:none; color:var(--text-main);" onclick="closeModal('cellEditModal')">✕</button>
    </div>

    <textarea class="modal-textarea" id="cellModalTextarea" placeholder="在此输入内容..."></textarea>

    <!-- Quick Audio File Picker -->
    <div class="setting-group" id="audioPickerBox" style="display:none;">
      <label>🎵 选择音频来源:</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;">
        <button class="btn btn-purple" style="font-size:0.95rem; padding:8px 12px; width:100%;" onclick="document.getElementById('audioLocalFile').click()">📂 从手机/电脑选取本地音频文件 (.mp3/.wav/.m4a)</button>
        <input type="file" id="audioLocalFile" accept="audio/*" style="display:none;" onchange="handleLocalAudioChoose(event)">
      </div>
      <div id="audioFileInfo" style="font-size:0.9rem; color:var(--accent-green); margin-bottom:8px; display:none;"></div>
      
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-green" id="btnTestPlay" style="font-size:0.9rem; padding:6px 10px; display:none;" onclick="testCurrentAudio()">▶️ 立即试听此本地音频</button>
        <button class="btn" style="background:#475569; color:#fff; font-size:0.9rem; padding:6px 10px;" onclick="setSampleAudio('sample-3s.mp3')">在线测试音源 1</button>
      </div>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:10px;">
      <button class="btn" style="background:#64748b; color:#fff;" onclick="closeModal('cellEditModal')">取消</button>
      <button class="btn btn-blue" onclick="saveCellFromModal()">💾 确定并写入表格</button>
    </div>
  </div>
</div>

<script>
  // Global State
  let wakeLock = null;
  let allNativeVoices = [];
  let currentAudioInstance = null;
  let currentEditingRow = null;
  let currentEditingCol = null;
  
  // Timer State
  let activeTimerInterval = null;
  let timerSingleSeconds = 0;
  let timerStartTimestamp = 0;
  let timerCompletedRounds = 0;

  // Local File Blob Storage Keyed by File Name
  const localAudioFiles = {}; 

  // Table Data Array
  let tableData = [
    { checked: false, time: "15/10/2026, repeat every 10 days", content: "Hello! 这是一条中文和 English 智能混合测试。" },
    { checked: false, time: "14:30", content: "sample-3s.mp3" }
  ];

  const EDGE_VOICES = [
    { name: "[Edge网络] 晓晓 (中文女声)", id: "zh-CN-XiaoxiaoNeural", lang: "zh-CN" },
    { name: "[Edge网络] 云希 (中文男声)", id: "zh-CN-YunxiNeural", lang: "zh-CN" },
    { name: "[Edge网络] Jenny (美音女声)", id: "en-US-JennyNeural", lang: "en-US" },
    { name: "[Edge网络] Guy (美音男声)", id: "en-US-GuyNeural", lang: "en-US" }
  ];

  // 1. Initializer
  function initApp() {
    initVoices();
    requestWakeLock();
    startClock();
    initBattery();
    fetchWeather();
    renderTable();
    checkRecurringOnLoad();

    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    setInterval(checkScheduledEvents, 5000);
  }

  // 2. Screen Wake Lock
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (err) {
      console.log('Wake Lock Error:', err.message);
    }
  }

  // 3. System Voices Loader
  function initVoices() {
    if (!('speechSynthesis' in window)) return;
    
    const populate = () => {
      allNativeVoices = window.speechSynthesis.getVoices();
      const zhSel = document.getElementById('zhVoiceSelect');
      const enSel = document.getElementById('enVoiceSelect');
      
      const currZh = zhSel.value;
      const currEn = enSel.value;

      zhSel.innerHTML = '';
      enSel.innerHTML = '';

      EDGE_VOICES.filter(v => v.lang.startsWith('zh')).forEach(v => zhSel.appendChild(new Option(v.name, `edge|${v.id}`)));
      EDGE_VOICES.filter(v => v.lang.startsWith('en')).forEach(v => enSel.appendChild(new Option(v.name, `edge|${v.id}`)));

      allNativeVoices.filter(v => v.lang.toLowerCase().includes('zh') || v.name.toLowerCase().includes('chinese'))
        .forEach(v => zhSel.appendChild(new Option(`[系统原生] ${v.name}`, `native|${v.name}`)));
        
      allNativeVoices.filter(v => v.lang.toLowerCase().includes('en') || v.name.toLowerCase().includes('english'))
        .forEach(v => enSel.appendChild(new Option(`[系统原生] ${v.name}`, `native|${v.name}`)));

      if (currZh) zhSel.value = currZh;
      if (currEn) enSel.value = currEn;
    };

    populate();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = populate;
    }
  }

  // 4. Live Clock & Hourly Chime
  function startClock() {
    const update = () => {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('clockDisplay').innerText = `${h} : ${m} : ${s}`;

      if (m === '00' && s === '00') {
        announceHourlyChime(now.getHours());
      }
    };
    update();
    setInterval(update, 1000);
  }

  function announceHourlyChime(hours) {
    let str = hours === 0 ? "12 am" : (hours < 12 ? `${hours} am` : (hours === 12 ? "12 pm" : `${hours - 12} pm`));
    speakBilingualText(`It is ${str}`);
  }

  // 5. Battery Monitor
  function initBattery() {
    if ('getBattery' in navigator) {
      navigator.getBattery().then(battery => {
        const updateBat = () => {
          const lvl = Math.round(battery.level * 100);
          const elem = document.getElementById('batteryDisplay');
          elem.innerText = `${lvl}% ${battery.charging ? '⚡(充电中)' : ''}`;
          if (lvl <= 30 && !battery.charging) {
            elem.classList.add('battery-low');
            elem.innerText += " ⚠️ 低电量请充电";
          } else {
            elem.classList.remove('battery-low');
          }
        };
        updateBat();
        battery.addEventListener('levelchange', updateBat);
        battery.addEventListener('chargingchange', updateBat);
      });
    } else {
      document.getElementById('batteryDisplay').innerText = "设备不支持电量API";
    }
  }

  // 6. Weather Widget
  async function fetchWeather() {
    const locInput = document.getElementById('weatherLoc').value.trim();
    const display = document.getElementById('weatherDisplay');
    let lat = -27.47, lon = 153.02;
    
    try {
      if (locInput) {
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(locInput)}&count=1`);
        const geoData = await geoRes.json();
        if (geoData.results && geoData.results.length > 0) {
          lat = geoData.results[0].latitude;
          lon = geoData.results[0].longitude;
        }
      } else if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          queryWeatherData(pos.coords.latitude, pos.coords.longitude);
        }, () => queryWeatherData(lat, lon));
        return;
      }
      queryWeatherData(lat, lon);
    } catch(e) {
      display.innerText = "☀️ 22°C 晴朗";
    }
  }

  async function queryWeatherData(lat, lon) {
    const display = document.getElementById('weatherDisplay');
    try {
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
      const data = await res.json();
      if (data.current_weather) {
        const temp = data.current_weather.temperature;
        const code = data.current_weather.weathercode;
        const desc = getWeatherDesc(code);
        display.innerHTML = `${desc.icon} ${temp}°C ${desc.text}`;
      }
    } catch (e) {
      display.innerText = "🌤️ 24°C 多云";
    }
  }

  function getWeatherDesc(code) {
    if (code === 0) return { icon: "☀️", text: "Sunny 晴朗" };
    if (code <= 3) return { icon: "⛅", text: "Cloudy 多云" };
    if (code <= 67) return { icon: "🌧️", text: "Rain 有雨" };
    return { icon: "🌩️", text: "Storm 雷雨" };
  }

  // 7. Quick Timer
  function parseDurationToSeconds(str) {
    str = str.toLowerCase().trim();
    let total = 0;
    let h = str.match(/([\d\.]+)h/);
    let m = str.match(/([\d\.]+)m/);
    let s = str.match(/([\d\.]+)s/);
    if (h) total += parseFloat(h[1]) * 3600;
    if (m) total += parseFloat(m[1]) * 60;
    if (s) total += parseFloat(s[1]);
    return total;
  }

  function formatTimeEnglishText(seconds) {
    let h = Math.floor(seconds / 3600);
    let m = Math.floor((seconds % 3600) / 60);
    let s = Math.round(seconds % 60);
    let res = "";
    if (h > 0) res += h + (h === 1 ? " hour " : " hours ");
    if (m > 0) res += m + (m === 1 ? " minute " : " minutes ");
    if (s > 0 || (!h && !m)) res += s + (s === 1 ? " second" : " seconds");
    return res.trim();
  }

  function startTimerAndGenerate() {
    stopTimerUI();
    const val = document.getElementById('timerInput').value;
    const repeats = parseInt(document.getElementById('repeatInput').value) || 1;
    
    timerSingleSeconds = parseDurationToSeconds(val);
    if (timerSingleSeconds <= 0) {
      document.getElementById('timerStatusText').innerText = "⚠️ 请输入有效时间，如: 10s, 2m, 1h20m";
      return;
    }

    speakBilingualText(`Starts ${formatTimeEnglishText(timerSingleSeconds)} timer, repeat ${repeats} times.`);

    const now = new Date();
    for (let i = 1; i <= repeats; i++) {
      let futureMs = now.getTime() + (i * timerSingleSeconds * 1000);
      let futureDate = new Date(futureMs);
      let timeStr = formatShortTime(futureDate);
      let accumSeconds = i * timerSingleSeconds;
      let accumText = formatTimeEnglishText(accumSeconds);

      tableData.push({
        checked: false,
        time: timeStr,
        content: accumText
      });
    }

    sortTable();
    renderTable();

    timerStartTimestamp = Date.now();
    timerCompletedRounds = 0;
    activeTimerInterval = setInterval(updateTimerProgress, 200);
  }

  function updateTimerProgress() {
    if (!timerStartTimestamp) return;
    const elapsed = (Date.now() - timerStartTimestamp) / 1000;
    const currentRound = Math.floor(elapsed / timerSingleSeconds);
    const roundProgress = Math.floor(elapsed % timerSingleSeconds);

    document.getElementById('timerStatusText').innerText = 
      `进行中: 第 ${currentRound + 1} 轮 | 进度: ${roundProgress}s / ${timerSingleSeconds}s`;

    if (currentRound > timerCompletedRounds) {
      timerCompletedRounds = currentRound;
      speakBilingualText(formatTimeEnglishText(timerCompletedRounds * timerSingleSeconds));
    }
  }

  function stopTimerUI() {
    if (activeTimerInterval) clearInterval(activeTimerInterval);
    activeTimerInterval = null;
    timerStartTimestamp = 0;
    document.getElementById('timerStatusText').innerText = "已停止/等待启动定时";
  }

  // 8. Bilingual Speech Chunking
  function speakBilingualText(text, onComplete) {
    if (!text) return;
    stopCurrentSpeech();

    const chunks = [];
    const regex = /([\u4e00-\u9fa5]+|[^\u4e00-\u9fa5]+)/g;
    let match;
    while ((match = regex.exec(text)) !== null) {
      if (match[0].trim()) {
        chunks.push({
          text: match[0],
          isChinese: /[\u4e00-\u9fa5]/.test(match[0])
        });
      }
    }

    let index = 0;
    const playNext = () => {
      if (index >= chunks.length) {
        if (onComplete) onComplete();
        return;
      }

      const chunk = chunks[index++];
      const isZh = chunk.isChinese;
      const rate = parseFloat(document.getElementById(isZh ? 'zhRate' : 'enRate').value);
      const voiceVal = document.getElementById(isZh ? 'zhVoiceSelect' : 'enVoiceSelect').value;
      const [type, voiceId] = voiceVal.split('|');

      if (type === 'edge') {
        playEdgeTTS(chunk.text, voiceId, rate, isZh, playNext);
      } else {
        playNativeTTS(chunk.text, voiceId, rate, isZh, playNext);
      }
    };

    playNext();
  }

  function playNativeTTS(text, voiceName, rate, isZh, callback) {
    if (!('speechSynthesis' in window)) { callback(); return; }
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = rate;
    utter.lang = isZh ? 'zh-CN' : 'en-US';

    const target = allNativeVoices.find(v => v.name === voiceName);
    if (target) utter.voice = target;

    utter.onend = callback;
    utter.onerror = callback;
    window.speechSynthesis.speak(utter);
  }

  function playEdgeTTS(text, voiceId, rate, isZh, callback) {
    const ratePercent = Math.round((rate - 1.0) * 100);
    const rateParam = ratePercent >= 0 ? `%2B${ratePercent}%25` : `${ratePercent}%25`;
    const url = `https://api.tts.quest/v3/voiceverse/synthesis?text=${encodeURIComponent(text)}&voice=${voiceId}&rate=${rateParam}`;

    let handled = false;
    const timer = setTimeout(() => {
      if (!handled) {
        handled = true;
        playNativeTTS(text, '', rate, isZh, callback);
      }
    }, 4000);

    fetch(url)
      .then(r => r.json())
      .then(d => {
        if (handled) return;
        if (d && d.audioUrl) {
          currentAudioInstance = new Audio(d.audioUrl);
          currentAudioInstance.onended = () => { clearTimeout(timer); if(!handled){ handled=true; callback(); } };
          currentAudioInstance.onerror = () => { if(!handled){ handled=true; clearTimeout(timer); playNativeTTS(text,'',rate,isZh,callback); } };
          currentAudioInstance.play().catch(() => {
            if(!handled){ handled=true; clearTimeout(timer); playNativeTTS(text,'',rate,isZh,callback); }
          });
        } else {
          throw new Error("Invalid response");
        }
      })
      .catch(() => {
        if (!handled) { handled = true; clearTimeout(timer); playNativeTTS(text, '', rate, isZh, callback); }
      });
  }

  // ===== 核心修复：支持本地文件 Blob 流与网络地址播放 =====
  function playAudioFile(fileName, callback) {
    stopCurrentSpeech();
    
    let playUrl = "";

    // 优先匹配本地内存中的本地文件对象 (Blob)
    if (localAudioFiles[fileName]) {
      playUrl = localAudioFiles[fileName];
    } else if (fileName === 'sample-3s.mp3') {
      playUrl = 'https://samplelib.com/lib/preview/mp3/sample-3s.mp3';
    } else {
      playUrl = fileName; // 直接作为 URL 尝试播放
    }

    try {
      currentAudioInstance = new Audio(playUrl);
      if (!playUrl.startsWith('blob:')) {
        currentAudioInstance.crossOrigin = "anonymous";
      }

      currentAudioInstance.onended = callback;
      currentAudioInstance.onerror = (e) => {
        alert(`⚠️ 音频播放失败: 无法加载【${fileName}】\n提示：如果是本地音频，请点击单元格重新在弹窗中选择选取文件。`);
        if (callback) callback();
      };

      currentAudioInstance.play().catch(e => {
        alert("⚠️ 播放被手机/浏览器阻断：请先点击页面任意按钮激活语音授权。");
        if (callback) callback();
      });
    } catch(err) {
      if (callback) callback();
    }
  }

  function stopCurrentSpeech() {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    if (currentAudioInstance) {
      currentAudioInstance.pause();
      currentAudioInstance = null;
    }
  }

  // 9. Table Operations
  function renderTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    tableData.forEach((row, idx) => {
      const tr = document.createElement('tr');
      if (row.checked) tr.className = 'row-checked';

      tr.innerHTML = `
        <td class="col-checkbox">
          <input type="checkbox" ${row.checked ? 'checked' : ''} onchange="toggleRowCheck(${idx}, this.checked)">
        </td>
        <td class="col-time cell-editable" onclick="openCellModal(${idx}, 'time')">${escapeHtml(row.time)}</td>
        <td class="col-content cell-editable" onclick="openCellModal(${idx}, 'content')">${escapeHtml(row.content)}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function openCellModal(rowIdx, colType) {
    currentEditingRow = rowIdx;
    currentEditingCol = colType;
    const item = tableData[rowIdx];

    document.getElementById('editModalHeader').innerText = colType === 'time' ? "📝 编辑触发时间 / 循环规则" : "💬 编辑提醒内容 / 音频文件名";
    document.getElementById('cellModalTextarea').value = colType === 'time' ? item.time : item.content;

    const audioPicker = document.getElementById('audioPickerBox');
    if (colType === 'content') {
      audioPicker.style.display = 'block';
      const fileInfo = document.getElementById('audioFileInfo');
      const testBtn = document.getElementById('btnTestPlay');
      if (localAudioFiles[item.content]) {
        fileInfo.style.display = 'block';
        fileInfo.innerText = `✅ 已载入本地内存音频: ${item.content}`;
        testBtn.style.display = 'inline-flex';
      } else {
        fileInfo.style.display = 'none';
        testBtn.style.display = 'none';
      }
    } else {
      audioPicker.style.display = 'none';
    }

    openModal('cellEditModal');
  }

  function saveCellFromModal() {
    if (currentEditingRow === null) return;
    const val = document.getElementById('cellModalTextarea').value.trim();
    if (currentEditingCol === 'time') {
      tableData[currentEditingRow].time = val;
    } else {
      tableData[currentEditingRow].content = val;
    }
    closeModal('cellEditModal');
    renderTable();
  }

  function setSampleAudio(filename) {
    document.getElementById('cellModalTextarea').value = filename;
    document.getElementById('audioFileInfo').style.display = 'none';
    document.getElementById('btnTestPlay').style.display = 'none';
  }

  // 处理选中本地音频文件
  function handleLocalAudioChoose(e) {
    const file = e.target.files[0];
    if (file) {
      // 1. 创建内存地址 (Object URL) 供浏览器直接读取二进制流
      const blobUrl = URL.createObjectURL(file);
      localAudioFiles[file.name] = blobUrl;

      // 2. 将文件名填入框内
      document.getElementById('cellModalTextarea').value = file.name;

      // 3. 提示成功并显示试听按钮
      const info = document.getElementById('audioFileInfo');
      info.style.display = 'block';
      info.innerText = `✅ 本地音频【${file.name}】加载成功！点击下方试听确认。`;
      document.getElementById('btnTestPlay').style.display = 'inline-flex';
    }
  }

  function testCurrentAudio() {
    const val = document.getElementById('cellModalTextarea').value.trim();
    if (val) playAudioFile(val);
  }

  function toggleRowCheck(idx, checked) {
    tableData[idx].checked = checked;
    renderTable();
  }

  function addTableRow() {
    tableData.push({ checked: false, time: "", content: "" });
    renderTable();
  }

  // 10. Intelligent Table Sorter
  function sortTable() {
    tableData.sort((a, b) => {
      if (!a.time && !b.time) return 0;
      if (!a.time) return -1;
      if (!b.time) return 1;

      const pA = parseScheduleTime(a.time);
      const pB = parseScheduleTime(b.time);

      return pA - pB;
    });
    renderTable();
  }

  function parseScheduleTime(str) {
    if (!str) return 0;
    const timeMatch = str.match(/(\d{1,2}):(\d{2})/);
    const dateMatch = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);

    let d = new Date();
    if (dateMatch) {
      d.setFullYear(parseInt(dateMatch[3]), parseInt(dateMatch[2]) - 1, parseInt(dateMatch[1]));
    }
    if (timeMatch) {
      d.setHours(parseInt(timeMatch[1]), parseInt(timeMatch[2]), 0, 0);
    } else {
      d.setHours(0,0,0,0);
    }
    return d.getTime();
  }

  // 11. Recurring Date Updater
  function checkRecurringOnLoad() {
    const today = new Date();
    today.setHours(0,0,0,0);

    tableData.forEach(row => {
      if (row.time && row.time.includes('repeat every')) {
        const match = row.time.match(/(\d{1,2})\/(\d{1,2})\/(\d{4}),\s*repeat every (\d+) days/);
        if (match) {
          let origDate = new Date(parseInt(match[3]), parseInt(match[2]) - 1, parseInt(match[1]));
          const interval = parseInt(match[4]);
          
          while (origDate < today) {
            origDate.setDate(origDate.getDate() + interval);
          }
          row.time = `${formatDateStr(origDate)}, repeat every ${interval} days`;
        }
      }
    });
    renderTable();
  }

  // 12. Schedule Trigger Loop
  function checkScheduledEvents() {
    const now = new Date();
    const currHHMM = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    const currDateStr = formatDateStr(now);

    tableData.forEach(row => {
      if (row.checked || !row.time) return;

      if (row.time.includes(currHHMM) || row.time.includes(currDateStr)) {
        row.checked = true;
        renderTable();

        if (row.content.match(/\.(mp3|wav|ogg|m4a|aac)$/i)) {
          playAudioFile(row.content);
        } else {
          speakBilingualText(row.content);
        }
      }
    });
  }

  // TXT Import / Export
  function exportTxt() {
    let content = tableData.map(r => `${r.checked ? '[X]' : '[ ]'}\t${r.time}\t${r.content}`).join('\n');
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Schedule_${formatDateStr(new Date()).replace(/\//g,'-')}.txt`;
    a.click();
  }

  function triggerImportTxt() {
    document.getElementById('fileTxtInput').click();
  }

  function handleTxtImport(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      const text = event.target.result;
      const lines = text.split('\n').map(l => l.trim()).filter(l => l);
      
      const count = parseInt(document.getElementById('importLineCount').value) || 5;
      const interval = parseInt(document.getElementById('importIntervalSec').value) || 30;

      const shuffled = lines.sort(() => 0.5 - Math.random());
      const selected = shuffled.slice(0, Math.min(count, shuffled.length));

      const startTime = new Date();
      selected.forEach((lineText, idx) => {
        let triggerTime = new Date(startTime.getTime() + (idx * interval * 1000));
        tableData.push({
          checked: false,
          time: formatShortTime(triggerTime),
          content: lineText
        });
      });

      sortTable();
      renderTable();
      closeModal('settingsModal');
      alert(`已成功随机导入 ${selected.length} 行数据并加入日程表！`);
    };
    reader.readAsText(file);
  }

  // Helpers
  function openModal(id) { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  function changeTheme(theme) {
    if (theme === 'light') document.body.classList.add('light-theme');
    else document.body.classList.remove('light-theme');
  }
  function formatDateStr(d) {
    return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
  }
  function formatShortTime(d) {
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
  }
  function escapeHtml(str) {
    return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>
