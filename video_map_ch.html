<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>语音定时助手 - 双Tab实时轨迹追踪版</title>
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #0f172a;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  
  header {
    background: #1e293b;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 1000;
  }
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .nav-tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid #334155;
    padding-bottom: 4px;
  }
  .tab-btn {
    background: #334155;
    color: #94a3b8;
    border: none;
    padding: 6px 14px;
    border-radius: 4px 4px 0 0;
    font-size: 13px;
    cursor: pointer;
  }
  .tab-btn.active {
    background: #3b82f6;
    color: #fff;
    font-weight: bold;
  }

  .btn {
    background: #3b82f6;
    color: #fff;
    border: none;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:active { opacity: 0.8; }
  .btn-danger { background: #ef4444; }
  .btn-success { background: #10b981; }
  
  #video-container {
    height: 25vh;
    min-height: 120px;
    background: #000;
    display: flex;
    gap: 2px;
  }
  .video-box {
    flex: 1;
    position: relative;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  video { width: 100%; height: 100%; object-fit: cover; }
  .video-label {
    position: absolute;
    bottom: 6px;
    left: 6px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
  }
  
  #resizer {
    height: 6px;
    background: #334155;
    cursor: row-resize;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #resizer::after {
    content: "";
    width: 30px;
    height: 2px;
    background: #94a3b8;
  }
  
  #main-content {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .tab-content {
    display: none;
    flex: 1;
    flex-direction: column;
    height: 100%;
    position: relative;
  }
  .tab-content.active { display: flex; }

  /* Tab 1: ID与文件 */
  .webrtc-panel {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #0f172a;
    height: 100%;
    overflow-y: auto;
  }
  .card {
    background: #1e293b;
    padding: 10px;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card h4 { font-size: 13px; color: #3b82f6; }

  /* 地图图标自定义样式 */
  .custom-icon-me {
    font-size: 24px;
    text-align: center;
    line-height: 24px;
  }
  .custom-icon-friend {
    width: 16px;
    height: 16px;
    background: #10b981;
    border: 2px solid #fff;
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(16,185,129,0.8);
  }
  .custom-icon-star {
    font-size: 22px;
    text-align: center;
    line-height: 22px;
  }

  /* Tab 2: 地图与控制 */
  #map { flex: 1; width: 100%; background: #0f172a; }
  .control-panel {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    z-index: 999;
    background: rgba(30, 41, 59, 0.85);
    backdrop-filter: blur(4px);
    padding: 8px;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .row { display: flex; gap: 6px; align-items: center; }
  input[type="text"] {
    flex: 1;
    background: #0f172a;
    border: 1px solid #475569;
    color: #fff;
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 12px;
  }
  .info-box {
    font-size: 11px;
    color: #cbd5e1;
    max-height: 45px;
    overflow-y: auto;
    white-space: pre-wrap;
    background: rgba(15, 23, 42, 0.5);
    padding: 4px;
    border-radius: 3px;
  }

  #chat-panel {
    height: 90px;
    background: #1e293b;
    border-top: 1px solid #334155;
    padding: 6px;
    display: flex;
    flex-direction: column;
  }
  #chat-messages {
    flex: 1;
    overflow-y: auto;
    font-size: 11px;
    color: #94a3b8;
    margin-bottom: 4px;
  }
</style>
</head>
<body>

  <header>
    <div class="top-row">
      <div class="row">
        <button id="btn-toggle-video" class="btn">开启视频</button>
        <button id="btn-toggle-audio" class="btn">开启麦克风</button>
      </div>
      <label style="font-size: 11px; color: #94a3b8; display: flex; align-items: center; gap: 4px;">
        <input type="checkbox" id="wakelock-toggle"> 屏幕常亮
      </label>
    </div>
    
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('webrtc-tab', this)">📁 Peer ID & 传输</button>
      <button class="tab-btn" onclick="switchTab('map-tab', this)">🗺️ 轨迹协作地图</button>
    </div>
  </header>

  <div id="video-container">
    <div class="video-box">
      <video id="local-video" autoplay playsinline muted></video>
      <div class="video-label">本地视讯</div>
    </div>
    <div class="video-box">
      <video id="remote-video" autoplay playsinline></video>
      <div class="video-label">远端视讯</div>
    </div>
  </div>

  <div id="resizer"></div>

  <div id="main-content">
    <!-- Tab 1: PeerJS ID 通信 -->
    <div id="webrtc-tab" class="tab-content active">
      <div class="webrtc-panel">
        <div class="card">
          <h4>我的 Peer ID (简短 ID 号)</h4>
          <div class="row">
            <input type="text" id="my-peer-id" readonly placeholder="正在获取 ID...">
            <button id="btn-copy-id" class="btn">复制ID</button>
          </div>
        </div>

        <div class="card">
          <h4>呼叫对方 ID</h4>
          <div class="row">
            <input type="text" id="remote-peer-id" placeholder="输入对方的 Peer ID">
            <button id="btn-call-peer" class="btn btn-success">发起呼叫</button>
          </div>
        </div>

        <div class="card">
          <h4>P2P 文件传输</h4>
          <div class="row">
            <input type="file" id="file-input" style="font-size: 11px; color: #fff;">
            <button id="btn-send-file" class="btn">发送文件</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab 2: 地图与轨迹 -->
    <div id="map-tab" class="tab-content">
      <div class="control-panel">
        <div class="row">
          <input type="text" id="search-input" placeholder="输入地名搜索...">
          <button id="search-btn" class="btn">搜索</button>
          <input type="text" id="star-title-input" placeholder="备注名称" style="width: 80px;">
          <button id="mark-btn" class="btn btn-success">标记⭐</button>
        </div>
        <div class="row">
          <button id="center-me-btn" class="btn">我的位置</button>
          <button id="download-offline" class="btn">缓存周边5km</button>
          <button id="clear-offline" class="btn btn-danger">清空缓存</button>
          <button id="export-txt" class="btn">导出TXT</button>
          <label class="btn" style="margin:0; font-weight:normal;">
            导入<input type="file" id="import-txt" accept=".txt" style="display:none;">
          </label>
        </div>
        <div id="star-info-box" class="info-box">长按地图可生成⭐标记；移动时自动绘制双方行走路径。</div>
      </div>

      <div id="map"></div>
    </div>
  </div>

  <div id="chat-panel">
    <div id="chat-messages">系统初始化完成...</div>
    <div class="row">
      <input type="text" id="chat-input" placeholder="发送协作消息...">
      <button id="send-chat-btn" class="btn">发送</button>
    </div>
  </div>

  <!-- Leaflet JS & PeerJS 库 (用于简短ID呼叫) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <script>
    // --- Tab 切换 ---
    function switchTab(tabId, btnElem) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btnElem.classList.add('active');
      if (tabId === 'map-tab' && leafletMap) {
        setTimeout(() => leafletMap.invalidateSize(), 200);
      }
    }

    // --- 地图与标记图标定义 ---
    let leafletMap = null;
    let meMarker = null, friendMarker = null;
    let myCurrentPos = null;
    let localStream = null;

    // 轨迹路线对象与坐标数组
    let myPathCoords = [];
    let friendPathCoords = [];
    let myPolyline = null;
    let friendPolyline = null;

    let starMarkers = [];
    let starLeafletMarkers = [];
    let selectedStarIndex = -1;

    // 1. 小人图标 (我的位置)
    const meIcon = L.divIcon({
      className: 'custom-icon-me',
      html: '🧍',
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });

    // 2. 绿色小圆点 (对方位置)
    const friendIcon = L.divIcon({
      className: 'custom-icon-friend',
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });

    // 3. 黄色星号 (星标)
    const starYellowIcon = L.divIcon({
      className: 'custom-icon-star',
      html: '⭐',
      iconSize: [24, 24],
      iconAnchor: [12, 12]
    });

    // --- PeerJS ID 通信逻辑 ---
    let peer = null;
    let conn = null;
    let mediaCall = null;

    function initPeer() {
      peer = new Peer(); // 自动生成简短 ID

      peer.on('open', (id) => {
        document.getElementById('my-peer-id').value = id;
        logChat("我的 Peer ID 生成成功: " + id);
      });

      // 接收连接 (DataChannel)
      peer.on('connection', (c) => {
        conn = c;
        setupConnEvents();
      });

      // 接收呼叫 (MediaStream)
      peer.on('call', (call) => {
        mediaCall = call;
        call.answer(localStream);
        call.on('stream', (remoteStream) => {
          document.getElementById('remote-video').srcObject = remoteStream;
        });
      });
    }

    document.getElementById('btn-call-peer').onclick = () => {
      const remoteId = document.getElementById('remote-peer-id').value.trim();
      if (!remoteId) return alert('请输入对方的 Peer ID！');

      // 建立数据通道
      conn = peer.connect(remoteId);
      setupConnEvents();

      // 建立音视频呼叫
      if (localStream) {
        mediaCall = peer.call(remoteId, localStream);
        mediaCall.on('stream', (remoteStream) => {
          document.getElementById('remote-video').srcObject = remoteStream;
        });
      }
      logChat("正在呼叫 ID: " + remoteId);
    };

    function setupConnEvents() {
      conn.on('open', () => {
        logChat("🟢 连接成功！正在同步位置与轨迹...");
        sendMyLocationToPeer();
      });

      conn.on('data', (data) => {
        if (typeof data === 'object' && data.type === 'location') {
          updateFriendPositionAndPath(data.lat, data.lng);
        } else if (typeof data === 'object' && data.type === 'chat') {
          logChat("对方: " + data.text);
        }
      });
    }

    document.getElementById('btn-copy-id').onclick = () => {
      const input = document.getElementById('my-peer-id');
      input.select();
      document.execCommand('copy');
      alert('已复制 ID！');
    };

    // --- 无缝音视频控制 ---
    async function initLocalStream() {
      try {
        if (!localStream) {
          localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          localStream.getVideoTracks().forEach(t => t.enabled = false);
          localStream.getAudioTracks().forEach(t => t.enabled = false);
          document.getElementById('local-video').srcObject = localStream;
        }
      } catch (e) {
        logChat("音视频准备就绪（默认未开启）");
      }
    }

    document.getElementById('btn-toggle-video').onclick = () => {
      if (!localStream) return;
      const vTrack = localStream.getVideoTracks()[0];
      if (vTrack) {
        vTrack.enabled = !vTrack.enabled;
        document.getElementById('btn-toggle-video').innerText = vTrack.enabled ? "关闭视频" : "开启视频";
      }
    };

    document.getElementById('btn-toggle-audio').onclick = () => {
      if (!localStream) return;
      const aTrack = localStream.getAudioTracks()[0];
      if (aTrack) {
        aTrack.enabled = !aTrack.enabled;
        document.getElementById('btn-toggle-audio').innerText = aTrack.enabled ? "关闭麦克风" : "开启麦克风";
      }
    };

    // --- 地图、轨迹与精确地址解析 ---
    function initMap() {
      leafletMap = L.map('map').setView([39.9042, 116.4074], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(leafletMap);

      // 初始化轨迹折线 (我的轨迹: 蓝色，对方轨迹: 绿色)
      myPolyline = L.polyline([], { color: '#3b82f6', weight: 4, opacity: 0.8 }).addTo(leafletMap);
      friendPolyline = L.polyline([], { color: '#10b981', weight: 4, opacity: 0.8 }).addTo(leafletMap);

      leafletMap.on('contextmenu', (e) => handleMapLongPress(e.latlng.lat, e.latlng.lng));

      if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            const { latitude: lat, longitude: lng } = pos.coords;
            myCurrentPos = { lat, lng };

            // 1. 更新小人图标位置
            if (!meMarker) {
              meMarker = L.marker([lat, lng], { icon: meIcon }).addTo(leafletMap).bindPopup("<b>🧍 我的位置</b><br>正在获取街道地址...");
              leafletMap.setView([lat, lng], 16);
            } else {
              meMarker.setLatLng([lat, lng]);
            }

            // 2. 绘制/追加“我的”行走路径
            myPathCoords.push([lat, lng]);
            myPolyline.setLatLngs(myPathCoords);

            // 3. 解析精准街道地址
            fetchAddress(lat, lng, (addr) => {
              meMarker.setPopupContent(`<b>🧍 我的位置</b><br>${addr}`);
            });

            // 4. 实时把坐标发给对方
            sendMyLocationToPeer();
          },
          (err) => console.warn("GPS 错误:", err),
          { enableHighAccuracy: true, maximumAge: 5000, timeout: 5000 }
        );
      }
    }

    // 更新对方的绿色小圆点与行走路径
    function updateFriendPositionAndPath(lat, lng) {
      if (!friendMarker) {
        friendMarker = L.marker([lat, lng], { icon: friendIcon }).addTo(leafletMap).bindPopup("<b>🟢 对方位置</b><br>正在获取街道地址...");
      } else {
        friendMarker.setLatLng([lat, lng]);
      }

      // 追加对方行走轨迹
      friendPathCoords.push([lat, lng]);
      friendPolyline.setLatLngs(friendPathCoords);

      // 解析对方精准地址
      fetchAddress(lat, lng, (addr) => {
        friendMarker.setPopupContent(`<b>🟢 对方位置</b><br>${addr}`);
      });
    }

    function sendMyLocationToPeer() {
      if (conn && conn.open && myCurrentPos) {
        conn.send({ type: 'location', lat: myCurrentPos.lat, lng: myCurrentPos.lng });
      }
    }

    async function fetchAddress(lat, lon, callback) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&accept-language=zh-CN`);
        if (res.ok) {
          const data = await res.json();
          callback(data.display_name || `${lat.toFixed(6)}, ${lon.toFixed(6)}`);
        }
      } catch (_) {
        callback(`坐标: ${lat.toFixed(6)}, ${lon.toFixed(6)}`);
      }
    }

    // --- 星标与搜索功能修复 ---
    function renderStars() {
      starLeafletMarkers.forEach(m => leafletMap.removeLayer(m));
      starLeafletMarkers = [];

      starMarkers.forEach((item, index) => {
        const popupContent = `<b>⭐ ${item.title || '标记点'}</b><br>${item.address}<br><span style="font-size:10px;color:#888;">坐标: ${item.lat.toFixed(6)}, ${item.lon.toFixed(6)}</span>`;
        const m = L.marker([item.lat, item.lon], { icon: starYellowIcon }).addTo(leafletMap).bindPopup(popupContent);
        m.on('click', () => selectStar(index));
        starLeafletMarkers.push(m);
      });
      localStorage.setItem('saved_stars', JSON.stringify(starMarkers));
    }

    function selectStar(index) {
      if (index < 0 || index >= starMarkers.length) return;
      selectedStarIndex = index;
      const item = starMarkers[index];
      document.getElementById('star-info-box').innerText = `⭐ ${item.title || '标记点'}\n地址: ${item.address}\n坐标: ${item.lat.toFixed(6)}, ${item.lon.toFixed(6)}`;
      document.getElementById('star-title-input').value = item.title !== '标记点' ? item.title : '';
    }

    async function createStarAt(lat, lon, customTitle = '标记点') {
      fetchAddress(lat, lon, (addr) => {
        starMarkers.push({ title: customTitle, lat, lon, address: addr });
        renderStars();
        selectStar(starMarkers.length - 1);
        if (starLeafletMarkers.length > 0) {
          starLeafletMarkers[starLeafletMarkers.length - 1].openPopup();
        }
      });
    }

    function handleMapLongPress(lat, lon) {
      const idx = starMarkers.findIndex(m => Math.abs(m.lat - lat) < 0.0003 && Math.abs(m.lon - lon) < 0.0003);
      if (idx !== -1) {
        starMarkers.splice(idx, 1);
        selectedStarIndex = -1;
        document.getElementById('star-info-box').innerText = '已移除该星标⭐';
        renderStars();
      } else {
        createStarAt(lat, lon, '标记点');
      }
    }

    document.getElementById('search-btn').onclick = async () => {
      const q = document.getElementById('search-input').value.trim();
      if (!q) return alert('请输入搜索地名！');
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`);
        const d = await r.json();
        if (d && d.length > 0) {
          const lat = parseFloat(d[0].lat), lon = parseFloat(d[0].lon);
          leafletMap.setView([lat, lon], 16);
          const customName = document.getElementById('star-title-input').value.trim() || q;
          await createStarAt(lat, lon, customName);
        } else { alert('未搜索到该地址，请尝试输入更详细的地名！'); }
      } catch (_) { alert('搜索服务请求失败，请检查网络！'); }
    };

    document.getElementById('mark-btn').onclick = () => {
      const title = document.getElementById('star-title-input').value.trim();
      if (!title) return alert('请先输入备注名称！');
      if (selectedStarIndex >= 0 && selectedStarIndex < starMarkers.length) {
        starMarkers[selectedStarIndex].title = title;
        renderStars();
        selectStar(selectedStarIndex);
      } else {
        alert('请先长按地图或点击已有星标！');
      }
    };

    document.getElementById('export-txt').onclick = () => {
      let txt = '# Starred Locations (格式: 名称 | 地址 | 坐标)\n';
      starMarkers.forEach(m => {
        txt += `${m.title || '标记点'} | ${m.address} | ${m.lat.toFixed(6)}, ${m.lon.toFixed(6)}\n`;
      });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain;charset=utf-8' }));
      a.download = `star_markers_${Date.now()}.txt`;
      a.click();
    };

    document.getElementById('import-txt').onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async evt => {
        const lines = evt.target.result.split('\n');
        for (let l of lines) {
          l = l.trim();
          if (!l || l.startsWith('#')) continue;
          const parts = l.split('|');
          if (parts.length >= 3) {
            const coords = parts[2].trim().split(',');
            starMarkers.push({
              title: parts[0].trim(),
              address: parts[1].trim(),
              lat: parseFloat(coords[0]),
              lon: parseFloat(coords[1])
            });
          }
        }
        renderStars();
        alert('TXT 文件标记点导入成功！');
      };
      reader.readAsText(file);
    };

    document.getElementById('center-me-btn').onclick = () => {
      if (myCurrentPos) leafletMap.setView([myCurrentPos.lat, myCurrentPos.lng], 17);
    };

    // 聊天栏
    document.getElementById('send-chat-btn').onclick = () => {
      const input = document.getElementById('chat-input');
      const val = input.value.trim();
      if (!val) return;
      if (conn && conn.open) {
        conn.send({ type: 'chat', text: val });
        logChat("我: " + val);
        input.value = '';
      } else { logChat("系统: 通道未连接，无法发送"); }
    };

    function logChat(msg) {
      const box = document.getElementById('chat-messages');
      box.innerText += `\n${msg}`;
      box.scrollTop = box.scrollHeight;
    }

    // 屏幕常亮与唤醒
    let wakeLock = null;
    const wakeLockToggle = document.getElementById('wakelock-toggle');
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (_) {}
    }
    wakeLockToggle.addEventListener('change', () => {
      if (wakeLockToggle.checked) requestWakeLock();
      else if (wakeLock) wakeLock.release();
    });

    // 页面初始化
    window.addEventListener('load', () => {
      initMap();
      initPeer();
      initLocalStream();
      const localStars = localStorage.getItem('saved_stars');
      if (localStars) { try { starMarkers = JSON.parse(localStars); renderStars(); } catch (_) {} }
    });

    // 拖拽分割线
    const resizer = document.getElementById('resizer');
    const videoContainer = document.getElementById('video-container');
    let isResizing = false;
    resizer.addEventListener('mousedown', () => isResizing = true);
    resizer.addEventListener('touchstart', () => isResizing = true);
    window.addEventListener('mousemove', e => {
      if (isResizing && e.clientY > 80 && e.clientY < window.innerHeight - 200) videoContainer.style.height = `${e.clientY}px`;
    });
    window.addEventListener('touchmove', e => {
      if (isResizing && e.touches[0].clientY > 80 && e.touches[0].clientY < window.innerHeight - 200) videoContainer.style.height = `${e.touches[0].clientY}px`;
    });
    window.addEventListener('mouseup', () => isResizing = false);
    window.addEventListener('touchend', () => isResizing = false);
  </script>
</body>
</html>
