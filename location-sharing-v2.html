<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>位置分享地图</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3XQiB9e6Z0bJQfD3VwYfJ3h7r8YwM=" crossorigin="">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: Arial, "Microsoft YaHei", sans-serif; background: #f4f6f8; color: #1f2937; }
    .app { display: flex; height: 100vh; }
    .panel { width: 360px; overflow-y: auto; padding: 18px; background: #fff; box-shadow: 2px 0 12px rgba(0,0,0,.12); z-index: 1000; }
    h1 { margin: 0 0 6px; font-size: 1.35rem; color: #075985; }
    .intro { margin: 0 0 18px; color: #64748b; font-size: .9rem; line-height: 1.5; }
    .section { margin-bottom: 16px; padding: 14px; border: 1px solid #e2e8f0; border-radius: 10px; background: #f8fafc; }
    .section h2 { margin: 0 0 10px; font-size: 1rem; }
    label { display: block; margin: 8px 0 4px; font-size: .85rem; font-weight: bold; }
    input { width: 100%; padding: 9px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: .95rem; }
    input:focus { outline: 2px solid #93c5fd; border-color: #2563eb; }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    button { width: 100%; margin-top: 10px; padding: 10px; border: 0; border-radius: 6px; color: #fff; background: #2563eb; font-weight: bold; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button.secondary { background: #059669; }
    button.secondary:hover { background: #047857; }
    button.gray { background: #64748b; }
    button.gray:hover { background: #475569; }
    .status { margin-top: 9px; padding: 8px; border-radius: 6px; background: #e0f2fe; color: #075985; font-size: .85rem; line-height: 1.4; word-break: break-word; }
    .share-link { display: none; margin-top: 10px; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; color: #1d4ed8; font-size: .78rem; line-height: 1.4; word-break: break-all; }
    .hint { margin: 8px 0 0; color: #64748b; font-size: .78rem; line-height: 1.4; }
    #map { flex: 1; min-width: 0; }
    @media (max-width: 760px) { .app { display: block; height: auto; } .panel { width: 100%; max-height: none; } #map { height: 55vh; min-height: 360px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel">
      <h1>📍 位置分享地图</h1>
      <p class="intro">这是新版页面。朋友只需要把他的经度和纬度告诉你，你就可以在下面输入并在地图上查看。</p>

      <section class="section">
        <h2>我的位置</h2>
        <div class="row">
          <div><label for="my-lat">纬度</label><input id="my-lat" type="number" step="any" placeholder="例如 35.681236"></div>
          <div><label for="my-lon">经度</label><input id="my-lon" type="number" step="any" placeholder="例如 139.767125"></div>
        </div>
        <button id="locate-button" type="button">使用浏览器获取我的位置</button>
        <button id="show-my-button" class="gray" type="button">在地图上显示我的位置</button>
        <div id="my-status" class="status">尚未获取位置。</div>
      </section>

      <section class="section">
        <h2>朋友的位置</h2>
        <label for="friend-name">朋友姓名（可选）</label>
        <input id="friend-name" type="text" placeholder="例如 Alex">
        <div class="row">
          <div><label for="friend-lat">纬度</label><input id="friend-lat" type="number" step="any" placeholder="例如 35.6895"></div>
          <div><label for="friend-lon">经度</label><input id="friend-lon" type="number" step="any" placeholder="例如 139.6917"></div>
        </div>
        <button id="show-friend-button" class="secondary" type="button">在地图上显示朋友位置</button>
        <div id="friend-status" class="status">请输入朋友提供的经度和纬度。</div>
      </section>

      <section class="section">
        <h2>分享我的位置</h2>
        <p class="hint">生成的链接会把“我的位置”写入网址参数。对方打开链接后，会看到你分享的位置，而不是自动使用对方自己的 GPS 位置。</p>
        <button id="share-button" type="button">生成我的位置分享链接</button>
        <button id="copy-button" class="gray" type="button">复制分享链接</button>
        <div id="share-link" class="share-link"></div>
      </section>
    </aside>
    <main id="map" aria-label="地图"></main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let myMarker = null;
    let friendMarker = null;
    let sharedMarker = null;

    function validCoordinates(lat, lon) {
      return Number.isFinite(lat) && Number.isFinite(lon) && lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180;
    }

    function readCoordinates(latId, lonId) {
      return {
        lat: Number.parseFloat(document.getElementById(latId).value),
        lon: Number.parseFloat(document.getElementById(lonId).value)
      };
    }

    function showMarker(kind, lat, lon, label) {
      const marker = L.marker([lat, lon]).addTo(map).bindPopup(label).openPopup();
      if (kind === 'my') { if (myMarker) map.removeLayer(myMarker); myMarker = marker; }
      if (kind === 'friend') { if (friendMarker) map.removeLayer(friendMarker); friendMarker = marker; }
      if (kind === 'shared') { if (sharedMarker) map.removeLayer(sharedMarker); sharedMarker = marker; }
      map.setView([lat, lon], 16);
    }

    function setStatus(id, text) { document.getElementById(id).textContent = text; }

    document.getElementById('show-my-button').addEventListener('click', () => {
      const { lat, lon } = readCoordinates('my-lat', 'my-lon');
      if (!validCoordinates(lat, lon)) return setStatus('my-status', '请输入有效的纬度（-90 到 90）和经度（-180 到 180）。');
      showMarker('my', lat, lon, '<b>📍 我的位置</b>');
      setStatus('my-status', `已显示：${lat.toFixed(6)}, ${lon.toFixed(6)}`);
    });

    document.getElementById('show-friend-button').addEventListener('click', () => {
      const { lat, lon } = readCoordinates('friend-lat', 'friend-lon');
      const name = document.getElementById('friend-name').value.trim() || '朋友';
      if (!validCoordinates(lat, lon)) return setStatus('friend-status', '请输入有效的纬度（-90 到 90）和经度（-180 到 180）。');
      showMarker('friend', lat, lon, `<b>👤 ${escapeHtml(name)}</b><br>${lat.toFixed(6)}, ${lon.toFixed(6)}`);
      setStatus('friend-status', `${name} 的位置已显示：${lat.toFixed(6)}, ${lon.toFixed(6)}`);
    });

    document.getElementById('locate-button').addEventListener('click', () => {
      if (!navigator.geolocation) return setStatus('my-status', '此浏览器不支持定位。');
      setStatus('my-status', '正在请求定位权限……');
      navigator.geolocation.getCurrentPosition(position => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        document.getElementById('my-lat').value = lat;
        document.getElementById('my-lon').value = lon;
        showMarker('my', lat, lon, '<b>📍 我的位置</b>');
        setStatus('my-status', `已获取：${lat.toFixed(6)}, ${lon.toFixed(6)}`);
      }, error => setStatus('my-status', `无法获取位置：${error.message}`), { enableHighAccuracy: true, timeout: 10000 });
    });

    document.getElementById('share-button').addEventListener('click', () => {
      const { lat, lon } = readCoordinates('my-lat', 'my-lon');
      const name = document.getElementById('friend-name').value.trim() || '我的位置';
      if (!validCoordinates(lat, lon)) return setStatus('my-status', '请先填写或获取有效的我的位置。');
      const url = new URL(window.location.href);
      url.search = new URLSearchParams({ sharedLat: lat.toFixed(6), sharedLon: lon.toFixed(6), sharedName: name }).toString();
      const link = document.getElementById('share-link');
      link.textContent = url.toString();
      link.style.display = 'block';
    });

    document.getElementById('copy-button').addEventListener('click', async () => {
      const link = document.getElementById('share-link').textContent;
      if (!link) return alert('请先生成分享链接。');
      try { await navigator.clipboard.writeText(link); alert('分享链接已复制。'); }
      catch (error) { alert('复制失败，请手动复制链接。'); }
    });

    function escapeHtml(value) {
      return value.replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
    }

    function loadSharedLocation() {
      const params = new URLSearchParams(window.location.search);
      const lat = Number.parseFloat(params.get('sharedLat'));
      const lon = Number.parseFloat(params.get('sharedLon'));
      const name = params.get('sharedName') || '分享者的位置';
      if (!validCoordinates(lat, lon)) return;
      document.getElementById('my-lat').value = lat;
      document.getElementById('my-lon').value = lon;
      showMarker('shared', lat, lon, `<b>📤 ${escapeHtml(name)}</b><br>${lat.toFixed(6)}, ${lon.toFixed(6)}`);
      setStatus('my-status', `已载入分享位置：${lat.toFixed(6)}, ${lon.toFixed(6)}`);
    }

    loadSharedLocation();
  </script>
</body>
</html>
