<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>语音定时助手</title>
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #0f172a;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  
  header {
    background: #1e293b;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    z-index: 1000;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .btn {
    background: #3b82f6;
    color: #fff;
    border: none;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:active { opacity: 0.8; }
  .btn-danger { background: #ef4444; }
  .btn-success { background: #10b981; }
  
  #video-container {
    height: 35vh;
    min-height: 120px;
    background: #000;
    position: relative;
    display: flex;
    gap: 2px;
  }
  .video-box {
    flex: 1;
    position: relative;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .video-label {
    position: absolute;
    bottom: 6px;
    left: 6px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
  }
  
  #resizer {
    height: 8px;
    background: #334155;
    cursor: row-resize;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #resizer::after {
    content: "";
    width: 30px;
    height: 2px;
    background: #94a3b8;
    border-radius: 2px;
  }
  
  #main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  #map {
    flex: 1;
    width: 100%;
    background: #0f172a;
  }

  .control-panel {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    z-index: 999;
    background: rgba(30, 41, 59, 0.85);
    backdrop-filter: blur(4px);
    padding: 8px;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .row { display: flex; gap: 6px; align-items: center; }
  input[type="text"] {
    flex: 1;
    background: #0f172a;
    border: 1px solid #475569;
    color: #fff;
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 12px;
  }

  .info-box {
    font-size: 11px;
    color: #cbd5e1;
    max-height: 45px;
    overflow-y: auto;
    white-space: pre-wrap;
    background: rgba(15, 23, 42, 0.5);
    padding: 4px;
    border-radius: 3px;
  }

  #chat-panel {
    height: 80px;
    background: #1e293b;
    border-top: 1px solid #334155;
    padding: 6px;
    display: flex;
    flex-direction: column;
  }
  #chat-messages {
    flex: 1;
    overflow-y: auto;
    font-size: 11px;
    color: #94a3b8;
    margin-bottom: 4px;
  }
</style>
</head>
<body>

  <header>
    <div class="row">
      <button id="btn-call" class="btn btn-success">发起呼叫</button>
      <button id="btn-toggle-video" class="btn">开启视频</button>
      <button id="btn-toggle-audio" class="btn">开启麦克风</button>
    </div>
    <div class="row">
      <label style="font-size: 11px; color: #94a3b8; display: flex; align-items: center; gap: 4px;">
        <input type="checkbox" id="wakelock-toggle"> 屏幕常亮
      </label>
    </div>
  </header>

  <div id="video-container">
    <div class="video-box">
      <video id="local-video" autoplay playsinline muted></video>
      <div class="video-label">本地视讯</div>
    </div>
    <div class="video-box">
      <video id="remote-video" autoplay playsinline></video>
      <div class="video-label">远端视讯</div>
    </div>
  </div>

  <div id="resizer"></div>

  <div id="main-content">
    <div class="control-panel">
      <div class="row">
        <input type="text" id="search-input" placeholder="搜索地点...">
        <button id="search-btn" class="btn">搜索</button>
        <input type="text" id="star-title-input" placeholder="备注名称" style="width: 80px;">
        <button id="mark-btn" class="btn btn-success">标记</button>
      </div>
      <div class="row">
        <button id="center-me-btn" class="btn">我的位置</button>
        <button id="download-offline" class="btn">缓存周边5km</button>
        <button id="clear-offline" class="btn btn-danger">清空缓存</button>
        <button id="export-txt" class="btn">导出TXT</button>
        <label class="btn" style="margin:0; font-weight:normal;">
          导入<input type="file" id="import-txt" accept=".txt" style="display:none;">
        </label>
      </div>
      <div id="star-info-box" class="info-box">长按地图可直接生成星标标记点。</div>
    </div>

    <div id="map"></div>
  </div>

  <div id="chat-panel">
    <div id="chat-messages">系统初始化完成...</div>
    <div class="row">
      <input type="text" id="chat-input" placeholder="发送协作消息...">
      <button id="send-chat-btn" class="btn">发送</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // --- 全局变量声明 ---
    let leafletMap = null;
    let meMarker = null, friendMarker = null;
    let myCurrentPos = null;
    let localStream = null;
    let peerConnection = null;
    let dataChannel = null;

    let starMarkers = [];
    let starLeafletMarkers = [];
    let selectedStarIndex = -1;

    // 自定义星标 Icon
    const starIcon = L.icon({
      iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34]
    });

    // --- 音视频与 WebRTC 无缝控制修补 ---
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    async function initLocalStream() {
      try {
        if (!localStream) {
          localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          // 默认关闭音视频轨，等待手动点击开启
          localStream.getVideoTracks().forEach(t => t.enabled = false);
          localStream.getAudioTracks().forEach(t => t.enabled = false);
          
          const localVideo = document.getElementById('local-video');
          if (localVideo) localVideo.srcObject = localStream;

          if (peerConnection) {
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
          }
        }
      } catch (e) {
        logChat("音视频设备初始化提示: " + e.message);
      }
    }

    document.getElementById('btn-toggle-video').onclick = () => {
      if (!localStream) return;
      const vTrack = localStream.getVideoTracks()[0];
      if (vTrack) {
        vTrack.enabled = !vTrack.enabled;
        document.getElementById('btn-toggle-video').innerText = vTrack.enabled ? "关闭视频" : "开启视频";
      }
    };

    document.getElementById('btn-toggle-audio').onclick = () => {
      if (!localStream) return;
      const aTrack = localStream.getAudioTracks()[0];
      if (aTrack) {
        aTrack.enabled = !aTrack.enabled;
        document.getElementById('btn-toggle-audio').innerText = aTrack.enabled ? "关闭麦克风" : "开启麦克风";
      }
    };

    function logChat(msg) {
      const box = document.getElementById('chat-messages');
      box.innerText += `\n${msg}`;
      box.scrollTop = box.scrollHeight;
    }

    // --- 地图初始化与 GPS 定位 ---
    function initMap() {
      leafletMap = L.map('map').setView([39.9042, 116.4074], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(leafletMap);

      leafletMap.on('contextmenu', (e) => {
        handleMapLongPress(e.latlng.lat, e.latlng.lng);
      });

      if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            const { latitude: lat, longitude: lng } = pos.coords;
            myCurrentPos = { lat, lng };
            
            if (!meMarker) {
              meMarker = L.marker([lat, lng]).addTo(leafletMap).bindPopup("我的位置");
              leafletMap.setView([lat, lng], 16);
            } else {
              meMarker.setLatLng([lat, lng]);
            }
            fetchAddress(lat, lng, 'my-address', null, '我的位置');
          },
          (err) => console.warn("GPS 获取失败", err),
          { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
        );
      }
    }

    async function fetchAddress(lat, lon, elementId, popupElemId, label) {
      const cacheKey = `geo_${lat.toFixed(4)}_${lon.toFixed(4)}`;
      const cached = localStorage.getItem(cacheKey);

      const updatePopup = (addrText) => {
        const popElem = document.getElementById(popupElemId);
        if (popElem) popElem.innerText = addrText;
        else if (elementId === 'my-address' && meMarker) meMarker.setPopupContent(`<b>🧍 ${label}</b><br>${addrText}`);
        else if (elementId === 'friend-address' && friendMarker) friendMarker.setPopupContent(`<b>🟢 ${label}</b><br>${addrText}`);
      };

      if (cached) {
        const elem = document.getElementById(elementId);
        if (elem) elem.innerText = cached;
        updatePopup(cached);
        return;
      }

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&accept-language=zh-CN`);
        if (res.ok) {
          const data = await res.json();
          const addr = data.display_name || `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
          const elem = document.getElementById(elementId);
          if (elem) elem.innerText = addr;
          updatePopup(addr);
          localStorage.setItem(cacheKey, addr);
        }
      } catch (_) {
        const fallback = `坐标: ${lat.toFixed(6)}, ${lon.toFixed(6)}`;
        const elem = document.getElementById(elementId);
        if (elem) elem.innerText = fallback;
        updatePopup(fallback);
      }
    }

    // --- 星标管理与渲染系统 ---
    function renderStars() {
      starLeafletMarkers.forEach(m => leafletMap.removeLayer(m));
      starLeafletMarkers = [];

      starMarkers.forEach((item, index) => {
        const popupContent = `<b>${item.title || '标记点'}</b><br>${item.address}<br><span style="font-size:10px;color:#666;">坐标: ${item.lat.toFixed(6)}, ${item.lon.toFixed(6)}</span>`;
        const m = L.marker([item.lat, item.lon], { icon: starIcon }).addTo(leafletMap).bindPopup(popupContent);
        
        m.on('click', () => selectStar(index));
        starLeafletMarkers.push(m);
      });

      localStorage.setItem('saved_stars', JSON.stringify(starMarkers));
    }

    function selectStar(index) {
      if (index < 0 || index >= starMarkers.length) return;
      selectedStarIndex = index;
      const item = starMarkers[index];
      const infoText = `${item.title || '标记点'}\n地址: ${item.address}\n坐标: ${item.lat.toFixed(6)}, ${item.lon.toFixed(6)}`;
      document.getElementById('star-info-box').innerText = infoText;
      document.getElementById('star-title-input').value = item.title !== '标记点' ? item.title : '';
    }

    async function createStarAt(lat, lon, customTitle = '标记点') {
      let addr = `获取地址中...`;
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&accept-language=zh-CN`);
        if (res.ok) {
          const data = await res.json();
          addr = data.display_name || `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
        }
      } catch (_) {
        addr = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
      }

      const newStar = { title: customTitle, lat, lon, address: addr };
      starMarkers.push(newStar);
      renderStars();
      selectStar(starMarkers.length - 1);
      
      if (starLeafletMarkers.length > 0) {
        starLeafletMarkers[starLeafletMarkers.length - 1].openPopup();
      }
    }

    function handleMapLongPress(lat, lon) {
      const idx = starMarkers.findIndex(m => Math.abs(m.lat - lat) < 0.0003 && Math.abs(m.lon - lon) < 0.0003);
      if (idx !== -1) {
        starMarkers.splice(idx, 1);
        selectedStarIndex = -1;
        document.getElementById('star-info-box').innerText = '已取消该星标';
        renderStars();
      } else {
        createStarAt(lat, lon, '标记点');
      }
    }

    // --- 按钮与文件导入导出绑定 ---
    document.getElementById('search-btn').onclick = async () => {
      const q = document.getElementById('search-input').value.trim();
      if (!q) return alert('请输入搜索内容！');
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`);
        const d = await r.json();
        if (d && d.length > 0) {
          const lat = parseFloat(d[0].lat), lon = parseFloat(d[0].lon);
          leafletMap.setView([lat, lon], 16);
          const titleName = document.getElementById('star-title-input').value.trim() || '标记点';
          await createStarAt(lat, lon, titleName);
        } else { alert('未找到该地址！'); }
      } catch (_) { alert('搜索请求失败'); }
    };

    document.getElementById('mark-btn').onclick = () => {
      const inputTitle = document.getElementById('star-title-input').value.trim();
      if (!inputTitle) return alert('请先在左侧框内输入名称（如：我的车、某某饭店）！');

      if (selectedStarIndex >= 0 && selectedStarIndex < starMarkers.length) {
        starMarkers[selectedStarIndex].title = inputTitle;
        renderStars();
        selectStar(selectedStarIndex);
        if (starLeafletMarkers[selectedStarIndex]) starLeafletMarkers[selectedStarIndex].openPopup();
      } else {
        alert('请先选择或长按地图生成一颗星标！');
      }
    };

    document.getElementById('export-txt').onclick = () => {
      if (!starMarkers.length) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([''], { type: 'text/plain;charset=utf-8' }));
        a.download = 'star_markers_empty.txt';
        a.click();
        return;
      }

      let txt = '# Starred Locations (格式: 名称 | 地址 | 坐标)\n';
      starMarkers.forEach(m => {
        txt += `${m.title || '标记点'} | ${m.address} | ${m.lat.toFixed(6)}, ${m.lon.toFixed(6)}\n`;
      });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain;charset=utf-8' }));
      a.download = `star_markers_${Date.now()}.txt`;
      a.click();
    };

    document.getElementById('import-txt').onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async evt => {
        const lines = evt.target.result.split('\n');
        let loadedCount = 0;

        for (let l of lines) {
          l = l.trim();
          if (!l || l.startsWith('#')) continue;

          const parts = l.includes('|') ? l.split('|') : l.split(',');

          if (parts.length >= 3) {
            const title = parts[0].trim();
            const address = parts[1].trim();
            const coords = parts[2].trim().split(' ');
            const lat = parseFloat(coords[0] || parts[2]);
            const lon = parseFloat(coords[1] || parts[3]);

            if (!isNaN(lat) && !isNaN(lon)) {
              starMarkers.push({ title, address, lat, lon });
              loadedCount++;
            }
          } else if (parts.length === 1 || parts.length === 2) {
            const addressToSearch = parts.length === 2 ? parts[1].trim() : parts[0].trim();
            const customTitle = parts.length === 2 ? parts[0].trim() : '标记点';

            try {
              const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addressToSearch)}`);
              const d = await r.json();
              if (d && d.length > 0) {
                starMarkers.push({
                  title: customTitle,
                  address: d[0].display_name,
                  lat: parseFloat(d[0].lat),
                  lon: parseFloat(d[0].lon)
                });
                loadedCount++;
              }
            } catch (_) {}
          }
        }

        renderStars();
        alert(`从文件成功载入并标出 ${loadedCount} 个标记点！`);
      };
      reader.readAsText(file);
    };

    document.getElementById('center-me-btn').onclick = () => {
      if (myCurrentPos && leafletMap) {
        leafletMap.setView([myCurrentPos.lat, myCurrentPos.lng], 17);
        if (meMarker) meMarker.openPopup();
      } else { alert('GPS 定位获取中，请稍候...'); }
    };

    document.getElementById('download-offline').onclick = async () => {
      if (!myCurrentPos) return alert('等待 GPS 获取当前位置...');
      const p = myCurrentPos;
      alert('正在下载周围 5km 离线瓦片...');
      const cache = await caches.open('offline-map-tiles');
      let downloaded = 0;
      for (let z of [13, 14, 15, 16]) {
        const n = Math.pow(2, z), latRad = p.lat * Math.PI / 180;
        const cx = Math.floor((p.lng + 180) / 360 * n), cy = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
        for (let x = cx - 2; x <= cx + 2; x++) {
          for (let y = cy - 2; y <= cy + 2; y++) {
            const sub = ['a', 'b', 'c'][(x + y) % 3], u = `https://${sub}.tile.openstreetmap.org/${z}/${x}/${y}.png`;
            try { await cache.add(u); downloaded++; } catch (_) {}
          }
        }
      }
      alert(`已完成 ${downloaded} 块地图瓦片缓存！`);
    };

    document.getElementById('clear-offline').onclick = async () => {
      const deleted = await caches.delete('offline-map-tiles');
      alert(deleted ? '离线地图缓存已成功删除！' : '未找到相关缓存');
    };

    // --- 屏幕 WakeLock 与切屏保护 ---
    let wakeLock = null;
    const wakeLockToggle = document.getElementById('wakelock-toggle');
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
      } catch (_) {}
    }
    wakeLockToggle.addEventListener('change', () => {
      if (wakeLockToggle.checked) requestWakeLock();
      else if (wakeLock) wakeLock.release();
    });

    document.addEventListener('visibilitychange', async () => {
      if (wakeLockToggle.checked && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    // --- 页面加载与分割线拖拽 ---
    window.addEventListener('load', () => {
      initMap();
      initLocalStream();
      const localStars = localStorage.getItem('saved_stars');
      if (localStars) { try { starMarkers = JSON.parse(localStars); renderStars(); } catch (_) {} }
    });

    const resizer = document.getElementById('resizer');
    const videoContainer = document.getElementById('video-container');
    let isResizing = false;

    resizer.addEventListener('mousedown', () => isResizing = true);
    resizer.addEventListener('touchstart', () => isResizing = true);

    window.addEventListener('mousemove', e => {
      if (isResizing && e.clientY > 80 && e.clientY < window.innerHeight - 200) {
        videoContainer.style.height = `${e.clientY}px`;
      }
    });
    window.addEventListener('touchmove', e => {
      if (isResizing && e.touches[0].clientY > 80 && e.touches[0].clientY < window.innerHeight - 200) {
        videoContainer.style.height = `${e.touches[0].clientY}px`;
      }
    });
    window.addEventListener('mouseup', () => isResizing = false);
    window.addEventListener('touchend', () => isResizing = false);
  </script>
</body>
</html>
