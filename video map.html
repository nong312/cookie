<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>语音定时助手 - WebRTC 全功能版</title>
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #0f172a;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  
  /* 顶栏与 Tab 切换器 */
  header {
    background: #1e293b;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 1000;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .nav-tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid #334155;
    padding-bottom: 4px;
  }
  .tab-btn {
    background: #334155;
    color: #94a3b8;
    border: none;
    padding: 6px 14px;
    border-radius: 4px 4px 0 0;
    font-size: 13px;
    cursor: pointer;
  }
  .tab-btn.active {
    background: #3b82f6;
    color: #fff;
    font-weight: bold;
  }

  .btn {
    background: #3b82f6;
    color: #fff;
    border: none;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:active { opacity: 0.8; }
  .btn-danger { background: #ef4444; }
  .btn-success { background: #10b981; }
  
  /* 音视频容器 */
  #video-container {
    height: 25vh;
    min-height: 120px;
    background: #000;
    display: flex;
    gap: 2px;
  }
  .video-box {
    flex: 1;
    position: relative;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  video { width: 100%; height: 100%; object-fit: cover; }
  .video-label {
    position: absolute;
    bottom: 6px;
    left: 6px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
  }
  
  #resizer {
    height: 6px;
    background: #334155;
    cursor: row-resize;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #resizer::after {
    content: "";
    width: 30px;
    height: 2px;
    background: #94a3b8;
  }
  
  /* 主体内容及多 Tab 区 */
  #main-content {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .tab-content {
    display: none;
    flex: 1;
    flex-direction: column;
    height: 100%;
    position: relative;
  }
  .tab-content.active { display: flex; }

  /* Tab 1: 文件与WebRTC连接 */
  .webrtc-panel {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #0f172a;
    height: 100%;
    overflow-y: auto;
  }
  .card {
    background: #1e293b;
    padding: 10px;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card h4 { font-size: 13px; color: #3b82f6; }
  textarea {
    width: 100%;
    height: 60px;
    background: #0f172a;
    border: 1px solid #475569;
    color: #fff;
    font-size: 11px;
    padding: 4px;
    border-radius: 4px;
    resize: none;
  }

  /* Tab 2: 地图与星标控制 */
  #map { flex: 1; width: 100%; background: #0f172a; }
  .control-panel {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    z-index: 999;
    background: rgba(30, 41, 59, 0.85);
    backdrop-filter: blur(4px);
    padding: 8px;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .row { display: flex; gap: 6px; align-items: center; }
  input[type="text"] {
    flex: 1;
    background: #0f172a;
    border: 1px solid #475569;
    color: #fff;
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 12px;
  }
  .info-box {
    font-size: 11px;
    color: #cbd5e1;
    max-height: 45px;
    overflow-y: auto;
    white-space: pre-wrap;
    background: rgba(15, 23, 42, 0.5);
    padding: 4px;
    border-radius: 3px;
  }

  /* 底部聊天栏 */
  #chat-panel {
    height: 90px;
    background: #1e293b;
    border-top: 1px solid #334155;
    padding: 6px;
    display: flex;
    flex-direction: column;
  }
  #chat-messages {
    flex: 1;
    overflow-y: auto;
    font-size: 11px;
    color: #94a3b8;
    margin-bottom: 4px;
  }
</style>
</head>
<body>

  <header>
    <div class="top-row">
      <div class="row">
        <button id="btn-toggle-video" class="btn">开启视频</button>
        <button id="btn-toggle-audio" class="btn">开启麦克风</button>
      </div>
      <label style="font-size: 11px; color: #94a3b8; display: flex; align-items: center; gap: 4px;">
        <input type="checkbox" id="wakelock-toggle"> 屏幕常亮
      </label>
    </div>
    
    <!-- 双 Tab 切换栏 -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('webrtc-tab', this)">📁 WebRTC & 文件传输</button>
      <button class="tab-btn" onclick="switchTab('map-tab', this)">🗺️ 协作地图</button>
    </div>
  </header>

  <div id="video-container">
    <div class="video-box">
      <video id="local-video" autoplay playsinline muted></video>
      <div class="video-label">本地视讯</div>
    </div>
    <div class="video-box">
      <video id="remote-video" autoplay playsinline></video>
      <div class="video-label">远端视讯</div>
    </div>
  </div>

  <div id="resizer"></div>

  <div id="main-content">
    <!-- Tab 1: WebRTC ID 交换与文件传送 -->
    <div id="webrtc-tab" class="tab-content active">
      <div class="webrtc-panel">
        <div class="card">
          <h4>1. 本地 SDP / 信令信封</h4>
          <textarea id="local-sdp" readonly placeholder="生成 Offer/Answer 后会显示在这里，复制发给对方..."></textarea>
          <div class="row">
            <button id="btn-create-offer" class="btn btn-success">发起呼叫 (生成 Offer)</button>
            <button id="btn-copy-sdp" class="btn">复制我的信令</button>
          </div>
        </div>

        <div class="card">
          <h4>2. 填入对方 SDP / 信令信封</h4>
          <textarea id="remote-sdp" placeholder="粘帖对方发送给你的 SDP/信令..."></textarea>
          <div class="row">
            <button id="btn-accept-sdp" class="btn btn-success">确认并连接 (Accept SDP)</button>
          </div>
        </div>

        <div class="card">
          <h4>3. P2P 文件传输</h4>
          <div class="row">
            <input type="file" id="file-input" style="font-size: 11px; color: #fff;">
            <button id="btn-send-file" class="btn">发送文件</button>
          </div>
          <div id="file-progress" style="font-size: 11px; color: #10b981;"></div>
        </div>
      </div>
    </div>

    <!-- Tab 2: 地图与位置共享 -->
    <div id="map-tab" class="tab-content">
      <div class="control-panel">
        <div class="row">
          <input type="text" id="search-input" placeholder="搜索地点...">
          <button id="search-btn" class="btn">搜索</button>
          <input type="text" id="star-title-input" placeholder="备注名称" style="width: 80px;">
          <button id="mark-btn" class="btn btn-success">标记</button>
        </div>
        <div class="row">
          <button id="center-me-btn" class="btn">我的位置</button>
          <button id="download-offline" class="btn">缓存周边5km</button>
          <button id="clear-offline" class="btn btn-danger">清空缓存</button>
          <button id="export-txt" class="btn">导出TXT</button>
          <label class="btn" style="margin:0; font-weight:normal;">
            导入<input type="file" id="import-txt" accept=".txt" style="display:none;">
          </label>
        </div>
        <div id="star-info-box" class="info-box">长按地图可生成标记；连接 WebRTC 后可看对方实时位置。</div>
      </div>

      <div id="map"></div>
    </div>
  </div>

  <div id="chat-panel">
    <div id="chat-messages">系统初始化完成...</div>
    <div class="row">
      <input type="text" id="chat-input" placeholder="发送 WebRTC 协作消息...">
      <button id="send-chat-btn" class="btn">发送</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // --- Tab 切换逻辑 ---
    function switchTab(tabId, btnElem) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btnElem.classList.add('active');

      if (tabId === 'map-tab' && leafletMap) {
        setTimeout(() => leafletMap.invalidateSize(), 200); // 解决切 Tab 后地图卡顿渲染
      }
    }

    // --- 全局变量声明 ---
    let leafletMap = null;
    let meMarker = null, friendMarker = null;
    let myCurrentPos = null;
    let localStream = null;
    let peerConnection = null;
    let dataChannel = null;

    let starMarkers = [];
    let starLeafletMarkers = [];
    let selectedStarIndex = -1;

    const starIcon = L.icon({
      iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41]
    });

    // --- WebRTC 与无缝音视频核心 ---
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    async function initLocalStream() {
      try {
        if (!localStream) {
          localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          localStream.getVideoTracks().forEach(t => t.enabled = false);
          localStream.getAudioTracks().forEach(t => t.enabled = false);
          
          const localVideo = document.getElementById('local-video');
          if (localVideo) localVideo.srcObject = localStream;
        }
      } catch (e) {
        logChat("音视频设备提示: " + e.message);
      }
    }

    function createPeerConnection() {
      peerConnection = new RTCPeerConnection(rtcConfig);

      if (localStream) {
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
      }

      peerConnection.ontrack = (evt) => {
        const remoteVideo = document.getElementById('remote-video');
        if (remoteVideo) remoteVideo.srcObject = evt.streams[0];
      };

      peerConnection.onicecandidate = (evt) => {
        if (!evt.candidate) {
          // ICE 收集完毕，显示最终 SDP
          document.getElementById('local-sdp').value = JSON.stringify(peerConnection.localDescription);
        }
      };

      peerConnection.ondatachannel = (evt) => {
        dataChannel = evt.channel;
        setupDataChannelEvents();
      };
    }

    function setupDataChannelEvents() {
      if (!dataChannel) return;
      dataChannel.onopen = () => {
        logChat("🟢 WebRTC 数据通道连接成功！支持实时位置/聊天/文件共享");
        sendMyLocationToPeer(); // 连接建立后立即把位置发给对方
      };
      dataChannel.onmessage = (e) => handleDataChannelMessage(e.data);
    }

    // --- WebRTC ID / SDP 交换操作 ---
    document.getElementById('btn-create-offer').onclick = async () => {
      createPeerConnection();
      dataChannel = peerConnection.createDataChannel('chatAndPos');
      setupDataChannelEvents();

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      logChat("已生成 Offer，请将框1中的内容复制发送给对方！");
    };

    document.getElementById('btn-accept-sdp').onclick = async () => {
      const rawSdp = document.getElementById('remote-sdp').value.trim();
      if (!rawSdp) return alert('请粘贴对方的 SDP/信令！');

      const sdpObj = JSON.parse(rawSdp);
      if (!peerConnection) createPeerConnection();

      await peerConnection.setRemoteDescription(new RTCSessionDescription(sdpObj));

      if (sdpObj.type === 'offer') {
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        logChat("已生成 Answer，请将框1的内容复制发回给发起方！");
      } else {
        logChat("应答完成，WebRTC 链路正在建立...");
      }
    };

    document.getElementById('btn-copy-sdp').onclick = () => {
      const txt = document.getElementById('local-sdp');
      txt.select();
      document.execCommand('copy');
      alert('已复制本地信令！');
    };

    // --- 音视频无缝开关 ---
    document.getElementById('btn-toggle-video').onclick = () => {
      if (!localStream) return;
      const vTrack = localStream.getVideoTracks()[0];
      if (vTrack) {
        vTrack.enabled = !vTrack.enabled;
        document.getElementById('btn-toggle-video').innerText = vTrack.enabled ? "关闭视频" : "开启视频";
      }
    };

    document.getElementById('btn-toggle-audio').onclick = () => {
      if (!localStream) return;
      const aTrack = localStream.getAudioTracks()[0];
      if (aTrack) {
        aTrack.enabled = !aTrack.enabled;
        document.getElementById('btn-toggle-audio').innerText = aTrack.enabled ? "关闭麦克风" : "开启麦克风";
      }
    };

    // --- 通过 Data Channel 处理聊天、位置同步、文件传输 ---
    function sendMyLocationToPeer() {
      if (dataChannel && dataChannel.readyState === 'open' && myCurrentPos) {
        dataChannel.send(JSON.stringify({ type: 'location', lat: myCurrentPos.lat, lng: myCurrentPos.lng }));
      }
    }

    function handleDataChannelMessage(data) {
      if (typeof data === 'string') {
        try {
          const msg = JSON.parse(data);
          if (msg.type === 'location') {
            updateFriendMarker(msg.lat, msg.lng);
          } else if (msg.type === 'chat') {
            logChat("对方: " + msg.text);
          }
        } catch (_) {
          logChat("对方: " + data);
        }
      } else {
        logChat("📁 接收到文件数据块！");
      }
    }

    function updateFriendMarker(lat, lng) {
      if (!friendMarker) {
        friendMarker = L.marker([lat, lng], { icon: starIcon }).addTo(leafletMap).bindPopup("对方位置");
      } else {
        friendMarker.setLatLng([lat, lng]);
      }
      fetchAddress(lat, lng, null, null, '对方位置');
      logChat(`🗺️ 已更新对方坐标: ${lat.toFixed(5)}, ${lng.toFixed(5)}`);
    }

    document.getElementById('send-chat-btn').onclick = () => {
      const input = document.getElementById('chat-input');
      const val = input.value.trim();
      if (!val) return;
      if (dataChannel && dataChannel.readyState === 'open') {
        dataChannel.send(JSON.stringify({ type: 'chat', text: val }));
        logChat("我: " + val);
        input.value = '';
      } else {
        logChat("系统: WebRTC 未连接，消息仅本地显示 (" + val + ")");
      }
    };

    function logChat(msg) {
      const box = document.getElementById('chat-messages');
      box.innerText += `\n${msg}`;
      box.scrollTop = box.scrollHeight;
    }

    // --- 地图与 GPS 逻辑 ---
    function initMap() {
      leafletMap = L.map('map').setView([39.9042, 116.4074], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(leafletMap);

      leafletMap.on('contextmenu', (e) => handleMapLongPress(e.latlng.lat, e.latlng.lng));

      if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            const { latitude: lat, longitude: lng } = pos.coords;
            myCurrentPos = { lat, lng };
            
            if (!meMarker) {
              meMarker = L.marker([lat, lng]).addTo(leafletMap).bindPopup("我的位置");
              leafletMap.setView([lat, lng], 16);
            } else {
              meMarker.setLatLng([lat, lng]);
            }
            sendMyLocationToPeer(); // 实时向对端广播位置变化
          },
          (err) => console.warn("GPS 错误:", err),
          { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
        );
      }
    }

    async function fetchAddress(lat, lon, elementId, popupElemId, label) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&accept-language=zh-CN`);
        if (res.ok) {
          const data = await res.json();
          const addr = data.display_name || `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
          if (label === '我的位置' && meMarker) meMarker.setPopupContent(`<b>🧍 我的位置</b><br>${addr}`);
          if (label === '对方位置' && friendMarker) friendMarker.setPopupContent(`<b>🟢 对方位置</b><br>${addr}`);
        }
      } catch (_) {}
    }

    // --- 星标管理与导入导出 ---
    function renderStars() {
      starLeafletMarkers.forEach(m => leafletMap.removeLayer(m));
      starLeafletMarkers = [];

      starMarkers.forEach((item, index) => {
        const popupContent = `<b>${item.title || '标记点'}</b><br>${item.address}<br><span style="font-size:10px;color:#666;">坐标: ${item.lat.toFixed(6)}, ${item.lon.toFixed(6)}</span>`;
        const m = L.marker([item.lat, item.lon], { icon: starIcon }).addTo(leafletMap).bindPopup(popupContent);
        m.on('click', () => selectStar(index));
        starLeafletMarkers.push(m);
      });
      localStorage.setItem('saved_stars', JSON.stringify(starMarkers));
    }

    function selectStar(index) {
      if (index < 0 || index >= starMarkers.length) return;
      selectedStarIndex = index;
      const item = starMarkers[index];
      document.getElementById('star-info-box').innerText = `${item.title || '标记点'}\n地址: ${item.address}\n坐标: ${item.lat.toFixed(6)}, ${item.lon.toFixed(6)}`;
      document.getElementById('star-title-input').value = item.title !== '标记点' ? item.title : '';
    }

    async function createStarAt(lat, lon, customTitle = '标记点') {
      let addr = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&accept-language=zh-CN`);
        if (res.ok) {
          const data = await res.json();
          addr = data.display_name || addr;
        }
      } catch (_) {}

      starMarkers.push({ title: customTitle, lat, lon, address: addr });
      renderStars();
      selectStar(starMarkers.length - 1);
    }

    function handleMapLongPress(lat, lon) {
      const idx = starMarkers.findIndex(m => Math.abs(m.lat - lat) < 0.0003 && Math.abs(m.lon - lon) < 0.0003);
      if (idx !== -1) {
        starMarkers.splice(idx, 1);
        selectedStarIndex = -1;
        document.getElementById('star-info-box').innerText = '已移除星标';
        renderStars();
      } else {
        createStarAt(lat, lon, '标记点');
      }
    }

    document.getElementById('search-btn').onclick = async () => {
      const q = document.getElementById('search-input').value.trim();
      if (!q) return alert('请输入搜索内容！');
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`);
        const d = await r.json();
        if (d && d.length > 0) {
          const lat = parseFloat(d[0].lat), lon = parseFloat(d[0].lon);
          leafletMap.setView([lat, lon], 16);
          await createStarAt(lat, lon, document.getElementById('star-title-input').value.trim() || '标记点');
        } else { alert('未找到该地址！'); }
      } catch (_) { alert('搜索失败'); }
    };

    document.getElementById('mark-btn').onclick = () => {
      const title = document.getElementById('star-title-input').value.trim();
      if (!title) return alert('请输入备注名称！');
      if (selectedStarIndex >= 0 && selectedStarIndex < starMarkers.length) {
        starMarkers[selectedStarIndex].title = title;
        renderStars();
        selectStar(selectedStarIndex);
      }
    };

    document.getElementById('export-txt').onclick = () => {
      let txt = '# Starred Locations (格式: 名称 | 地址 | 坐标)\n';
      starMarkers.forEach(m => {
        txt += `${m.title || '标记点'} | ${m.address} | ${m.lat.toFixed(6)}, ${m.lon.toFixed(6)}\n`;
      });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain;charset=utf-8' }));
      a.download = `star_markers_${Date.now()}.txt`;
      a.click();
    };

    document.getElementById('import-txt').onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async evt => {
        const lines = evt.target.result.split('\n');
        for (let l of lines) {
          l = l.trim();
          if (!l || l.startsWith('#')) continue;
          const parts = l.split('|');
          if (parts.length >= 3) {
            const coords = parts[2].trim().split(',');
            starMarkers.push({
              title: parts[0].trim(),
              address: parts[1].trim(),
              lat: parseFloat(coords[0]),
              lon: parseFloat(coords[1])
            });
          }
        }
        renderStars();
        alert('文件标记点加载完毕！');
      };
      reader.readAsText(file);
    };

    document.getElementById('center-me-btn').onclick = () => {
      if (myCurrentPos) leafletMap.setView([myCurrentPos.lat, myCurrentPos.lng], 17);
    };

    // --- 屏幕常亮与初始化 ---
    let wakeLock = null;
    const wakeLockToggle = document.getElementById('wakelock-toggle');
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (_) {}
    }
    wakeLockToggle.addEventListener('change', () => {
      if (wakeLockToggle.checked) requestWakeLock();
      else if (wakeLock) wakeLock.release();
    });

    window.addEventListener('load', () => {
      initMap();
      initLocalStream();
      const localStars = localStorage.getItem('saved_stars');
      if (localStars) { try { starMarkers = JSON.parse(localStars); renderStars(); } catch (_) {} }
    });

    // 分割线拖拽
    const resizer = document.getElementById('resizer');
    const videoContainer = document.getElementById('video-container');
    let isResizing = false;
    resizer.addEventListener('mousedown', () => isResizing = true);
    resizer.addEventListener('touchstart', () => isResizing = true);
    window.addEventListener('mousemove', e => {
      if (isResizing && e.clientY > 80 && e.clientY < window.innerHeight - 200) videoContainer.style.height = `${e.clientY}px`;
    });
    window.addEventListener('touchmove', e => {
      if (isResizing && e.touches[0].clientY > 80 && e.touches[0].clientY < window.innerHeight - 200) videoContainer.style.height = `${e.touches[0].clientY}px`;
    });
    window.addEventListener('mouseup', () => isResizing = false);
    window.addEventListener('touchend', () => isResizing = false);
  </script>
</body>
</html>
