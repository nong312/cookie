<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>双语朗读与词典工具 (Edge TTS 高音质版)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 12px; color: #333; background: #f5f5f7; line-height: 1.6; }
    h2 { font-size: 20px; text-align: center; margin: 10px 0 15px; color: #1d1d1f; }
    
    textarea { width: 100%; height: 110px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; background: #fff; resize: vertical; }
    
    .controls { background: #fff; border: 1px solid #e0e0e0; padding: 12px; border-radius: 12px; margin: 12px 0; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .btn-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .row { display: flex; align-items: center; gap: 8px; width: 100%; }
    .voice-row { display: flex; flex-direction: column; gap: 6px; width: 100%; }
    
    button { min-height: 44px; padding: 0 12px; border: none; border-radius: 8px; background: #0066cc; color: white; font-size: 15px; font-weight: 600; cursor: pointer; flex: 1; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
    button:active { opacity: 0.8; }
    button.secondary { background: #6c757d; }
    button.danger { background: #dc3545; }
    button.mixed { background: #28a745; }
    
    select { height: 44px; width: 100%; padding: 0 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; background: #fff; }
    input[type="file"] { font-size: 14px; width: 100%; }

    #reader-view { border: 1px solid #d1d1d6; padding: 12px; border-radius: 10px; min-height: 160px; max-height: 320px; overflow-y: auto; background: #fff; font-size: 18px; line-height: 1.8; word-break: break-word; scroll-behavior: smooth; }
    
    .sentence-block { display: inline; border-radius: 4px; padding: 2px 0; transition: background-color 0.2s ease; }
    .word { cursor: pointer; padding: 0 1px; border-radius: 3px; display: inline-block; }
    
    .selected-start { background-color: #ffeeba !important; border-bottom: 2px solid #ffc107; font-weight: bold; color: #856404; }
    .active-lookup { background-color: #d1ecf1 !important; color: #0c5460; font-weight: bold; }
    .reading-highlight { background-color: #ffdeeb !important; border-bottom: 2px solid #ff2d55; color: #b3002d; font-weight: 500; }

    .dict-panel { margin-top: 15px; padding: 14px; background: #eef6ff; border: 1px solid #b8daff; border-radius: 10px; }
    .dict-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .dict-word { font-size: 20px; font-weight: bold; color: #0052a3; }
    .dict-body { font-size: 15px; color: #24292e; white-space: pre-line; line-height: 1.5; }
    
    .status-tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #e0e0e0; color: #666; margin-left: 6px; }
    .status-tag.active { background: #d4edda; color: #155724; }
  </style>
</head>
<body>

  <h2>双语朗读与词典工具 <span class="status-tag active">Edge TTS 极清模式</span></h2>
  
  <textarea id="text-input" placeholder="在此粘贴中英文混合文本..."></textarea>
  
  <div class="controls">
    <div class="row">
      <input type="file" id="file-input" accept=".txt,.pdf">
      <button onclick="loadText()" class="secondary" style="max-width: 90px;">加载</button>
    </div>
    
    <div class="voice-row">
      <div class="row">
        <label style="font-size:13px; font-weight:bold; min-width:65px;">中文声线:</label>
        <select id="zh-voice-select">
          <option value="zh-CN-XiaoxiaoNeural">晓晓 (女声 - 甜美自然首选)</option>
          <option value="zh-CN-YunxiNeural">云希 (男声 - 阳朗青年)</option>
          <option value="zh-CN-YunjianNeural">云健 (男声 - 稳重沉稳)</option>
          <option value="zh-CN-XiaoyiNeural">晓伊 (女声 - 亲切柔和)</option>
        </select>
      </div>
      <div class="row">
        <label style="font-size:13px; font-weight:bold; min-width:65px;">英文声线:</label>
        <select id="en-voice-select">
          <option value="en-US-JennyNeural">Jenny (美音女声 - 标准清晰)</option>
          <option value="en-US-GuyNeural">Guy (美音男声 - 自然流畅)</option>
          <option value="en-GB-SoniaNeural">Sonia (英音女声 - 优雅标准)</option>
          <option value="en-US-AnaNeural">Ana (美音童声/活泼)</option>
        </select>
      </div>
    </div>

    <div class="btn-group">
      <button onclick="startSpeech('mixed')" class="mixed">🔊 智能中英高音质朗读</button>
    </div>
    <div class="btn-group">
      <button onclick="startSpeech('zh-CN')">🔊 仅纯中文</button>
      <button onclick="startSpeech('en-US')">🔊 仅纯英文</button>
      <button onclick="stopText()" class="danger" style="flex: 0.6;">停止</button>
    </div>
    
    <div class="row" style="margin-top: 5px;">
      <label for="rate" style="font-size: 14px; white-space: nowrap;">语速: <span id="rate-val">1.0</span>x</label>
      <input type="range" id="rate" min="0.5" max="2" value="1" step="0.1" style="width: 100%;" onchange="document.getElementById('rate-val').innerText = this.value">
    </div>
  </div>

  <p style="font-size: 12px; color: #666; margin: 5px 0; text-align: center;">
    👉 <b>点击任意字词</b>：设置起点 | 👈 <b>长按/双击</b>：查词典
  </p>
  
  <div id="reader-view">点击“加载”后，文本将在此处生成。</div>

  <div class="dict-panel">
    <div class="dict-header">
      <span class="dict-word" id="dict-title">词典 / 释义</span>
      <button id="dict-audio-btn" onclick="speakCurrentWord()" style="display:none; max-width: 90px; min-height: 32px; font-size: 13px;">🔊 读音</button>
    </div>
    <div class="dict-body" id="dict-content">在上方双击或长按任意词语，此处将显示中英双语释义。</div>
  </div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  
  let selectedWord = '';
  let startIndex = 0; 
  let sentences = []; 
  let isSpeaking = false;
  let currentSentenceIndex = 0;
  let currentSubChunkIndex = 0;
  let currentMode = 'mixed';
  let currentAudio = null; // 用于控制 Edge TTS 音频对象

  document.getElementById('file-input').addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (!file) return;

    if (file.type === "application/pdf") {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let text = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(' ') + '\n';
      }
      document.getElementById('text-input').value = text;
    } else {
      const reader = new FileReader();
      reader.onload = (event) => document.getElementById('text-input').value = event.target.result;
      reader.readAsText(file);
    }
    loadText();
  });

  function loadText() {
    stopText();
    const rawText = document.getElementById('text-input').value;
    const container = document.getElementById('reader-view');
    container.innerHTML = '';
    startIndex = 0;
    sentences = [];

    if (!rawText.trim()) {
      container.innerHTML = '请先输入或上传文本。';
      return;
    }

    // 1. 按天然标点断句
    const rawSentences = rawText.split(/(?<=[。！？!?;；\n])/g);

    rawSentences.forEach((sentenceText) => {
      if (!sentenceText.trim()) return;

      const sentenceIndex = sentences.length;
      const sentenceSpan = document.createElement('span');
      sentenceSpan.className = 'sentence-block';
      sentenceSpan.id = `sentence-${sentenceIndex}`;

      const segments = Array.from(sentenceText);
      let wordBuffer = '';

      segments.forEach((char) => {
        if (/[a-zA-Z0-9]/.test(char)) {
          wordBuffer += char;
        } else {
          if (wordBuffer) {
            appendWordSpan(sentenceSpan, wordBuffer, sentenceIndex);
            wordBuffer = '';
          }
          if (char.trim()) {
            appendWordSpan(sentenceSpan, char, sentenceIndex);
          } else {
            sentenceSpan.appendChild(document.createTextNode(char));
          }
        }
      });
      
      if (wordBuffer) {
        appendWordSpan(sentenceSpan, wordBuffer, sentenceIndex);
      }

      container.appendChild(sentenceSpan);

      // 2. 按中英文切割片段 (SubChunks)，实现句内精准音色切换
      const subChunks = [];
      const chunkRegex = /([\u4e00-\u9fa5]+|[^\u4e00-\u9fa5]+)/g;
      let match;
      while ((match = chunkRegex.exec(sentenceText)) !== null) {
        if (match[0].trim()) {
          subChunks.push({
            text: match[0],
            isChinese: /[\u4e00-\u9fa5]/.test(match[0])
          });
        }
      }

      sentences.push({
        id: sentenceIndex,
        text: sentenceText,
        subChunks: subChunks,
        el: sentenceSpan
      });
    });
  }

  function appendWordSpan(parent, text, sentenceIdx) {
    const wordSpan = document.createElement('span');
    wordSpan.textContent = text;
    wordSpan.className = 'word';

    let touchTimer = null;
    let lastTap = 0;

    wordSpan.onclick = (e) => {
      e.stopPropagation();
      stopText();
      document.querySelectorAll('.word').forEach(w => w.classList.remove('selected-start'));
      wordSpan.classList.add('selected-start');
      startIndex = sentenceIdx; 
    };

    wordSpan.ondblclick = (e) => {
      e.stopPropagation();
      triggerDict(text, wordSpan);
    };

    wordSpan.addEventListener('touchstart', function(e) {
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTap;
      touchTimer = setTimeout(() => {
        triggerDict(text, wordSpan);
      }, 400);

      if (tapLength < 300 && tapLength > 0) {
        e.preventDefault();
        clearTimeout(touchTimer);
        triggerDict(text, wordSpan);
      }
      lastTap = currentTime;
    }, { passive: false });

    wordSpan.addEventListener('touchend', () => clearTimeout(touchTimer));
    wordSpan.addEventListener('touchmove', () => clearTimeout(touchTimer));

    parent.appendChild(wordSpan);
  }

  function triggerDict(text, el) {
    document.querySelectorAll('.word').forEach(w => w.classList.remove('active-lookup'));
    if (el) el.classList.add('active-lookup');
    handleDoubleClick(text);
  }

  function startSpeech(mode) {
    stopText();
    if (sentences.length === 0) return;

    isSpeaking = true;
    currentMode = mode;
    currentSentenceIndex = startIndex;
    currentSubChunkIndex = 0;
    
    playCurrentChunk();
  }

  // 核心：使用 Edge TTS API 替代原有的原生 speechSynthesis
  async function playCurrentChunk() {
    if (!isSpeaking || currentSentenceIndex >= sentences.length) {
      stopText();
      return;
    }

    const currentSentence = sentences[currentSentenceIndex];

    // 视觉高亮居中
    clearHighlights();
    currentSentence.el.classList.add('reading-highlight');
    currentSentence.el.scrollIntoView({ behavior: 'smooth', block: 'center' });

    if (currentSubChunkIndex >= currentSentence.subChunks.length) {
      currentSentenceIndex++;
      currentSubChunkIndex = 0;
      playCurrentChunk();
      return;
    }

    const currentChunk = currentSentence.subChunks[currentSubChunkIndex];

    // 根据模式和片段属性挑选 Edge TTS 极清音色
    let selectedVoice = 'zh-CN-XiaoxiaoNeural';
    if (currentMode === 'mixed') {
      selectedVoice = currentChunk.isChinese 
        ? document.getElementById('zh-voice-select').value 
        : document.getElementById('en-voice-select').value;
    } else if (currentMode === 'zh-CN') {
      selectedVoice = document.getElementById('zh-voice-select').value;
    } else {
      selectedVoice = document.getElementById('en-voice-select').value;
    }

    // 语速换算（Edge TTS 百分比格式）
    const rateVal = parseFloat(document.getElementById('rate').value);
    const ratePercentage = Math.round((rateVal - 1.0) * 100);
    const rateStr = ratePercentage >= 0 ? `+${ratePercentage}%` : `${ratePercentage}%`;

    // 构造 Edge-TTS 免费 API 请求路径
    const ttsUrl = `https://api.everlink.my/api/tts?text=${encodeURIComponent(currentChunk.text)}&voice=${selectedVoice}&rate=${rateStr}`;

    try {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }

      currentAudio = new Audio(ttsUrl);

      currentAudio.onended = () => {
        if (isSpeaking) {
          currentSubChunkIndex++;
          playCurrentChunk();
        }
      };

      currentAudio.onerror = (err) => {
        console.warn("音频获取失败，跳过该片段:", err);
        if (isSpeaking) {
          currentSubChunkIndex++;
          playCurrentChunk();
        }
      };

      await currentAudio.play();

    } catch (e) {
      console.error("播放音频中断:", e);
    }
  }

  function clearHighlights() {
    document.querySelectorAll('.reading-highlight').forEach(el => el.classList.remove('reading-highlight'));
  }

  function stopText() {
    isSpeaking = false;
    currentSentenceIndex = -1;
    currentSubChunkIndex = 0;
    
    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
    }
    clearHighlights();
  }

  async function handleDoubleClick(word) {
    if (!word) return;
    selectedWord = word.trim();

    document.getElementById('dict-title').innerText = selectedWord;
    document.getElementById('dict-audio-btn').style.display = 'inline-block';
    document.getElementById('dict-content').innerText = '正在获取翻译...';

    speakCurrentWord();

    try {
      const isChinese = /[\u4e00-\u9fa5]/.test(selectedWord);
      const pair = isChinese ? 'zh|en' : 'en|zh';
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(selectedWord)}&langpair=${pair}`);
      const data = await res.json();
      const translation = data.responseData.translatedText;

      document.getElementById('dict-content').innerHTML = 
        `<strong>词语 / Word:</strong> ${selectedWord}\n` +
        `<strong>英文 / English:</strong> ${isChinese ? translation : selectedWord}\n` +
        `<strong>中文 / Chinese:</strong> ${isChinese ? selectedWord : translation}`;
    } catch (err) {
      document.getElementById('dict-content').innerText = '网络连接异常，无法获取在线释义。';
    }
  }

  function speakCurrentWord() {
    if (!selectedWord) return;
    const isChinese = /[\u4e00-\u9fa5]/.test(selectedWord);
    const voice = isChinese 
      ? document.getElementById('zh-voice-select').value 
      : document.getElementById('en-voice-select').value;
      
    const rateVal = parseFloat(document.getElementById('rate').value);
    const ratePercentage = Math.round((rateVal - 1.0) * 100);
    const rateStr = ratePercentage >= 0 ? `+${ratePercentage}%` : `${ratePercentage}%`;

    const wordAudio = new Audio(`https://api.everlink.my/api/tts?text=${encodeURIComponent(selectedWord)}&voice=${voice}&rate=${rateStr}`);
    wordAudio.play();
  }
</script>
</body>
</html>
