<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 视频通话简易 Demo</title>
    <!-- 引入 PeerJS 库 -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; }
        video { width: 45%; max-width: 400px; background: #000; margin: 5px; border-radius: 8px; }
        .controls { margin: 15px 0; }
        input { padding: 8px; width: 60%; max-width: 250px; }
        button { padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #logs { background: #1e1e1e; color: #00ff00; padding: 10px; font-family: monospace; font-size: 12px; height: 120px; overflow-y: auto; border-radius: 6px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>我的 ID: <span id="my-id" style="color: blue;">生成中...</span></h2>
    
    <div class="controls">
        <input type="text" id="peer-id-input" placeholder="输入对方的 ID">
        <button onclick="connectToPeer()">呼叫对方</button>
    </div>

    <div>
        <!-- 本地视频：必须静音(muted)防止回音 -->
        <video id="local-video" autoplay playsinline muted></video>
        <!-- 远程视频：绝对不能静音 -->
        <video id="remote-video" autoplay playsinline></video>
    </div>

    <!-- 日志输出面板 -->
    <div id="logs"><b>运行日志：</b><br></div>

    <script>
        // 0. 日志输出函数（防止 log 未定义导致代码崩溃）
        function log(msg) {
            const logBox = document.getElementById('logs');
            logBox.innerHTML += `> ${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // 1. 初始化 Peer 对象（添加 STUN 服务器帮助跨网络打洞）
        const peer = new Peer({
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        });
        
        let localStream = null;

        // 获取自己的 ID
        peer.on('open', id => {
            document.getElementById('my-id').innerText = id;
            log('信令服务器连接成功！我的 ID: ' + id);
        });

        peer.on('error', err => {
            log('<span style="color:red;">Peer 错误: ' + err.type + ' - ' + err.message + '</span>');
        });

        // 2. 强制获取高清麦克风，并开启硬件消音/降噪
        navigator.mediaDevices.getUserMedia({ 
            video: true, 
            audio: {
                echoCancellation: true, // 消除回音
                noiseSuppression: true, // 消除噪音
                autoGainControl: true   // 自动增益
            } 
        })
        .then(stream => {
            localStream = stream;
            document.getElementById('local-video').srcObject = stream;
            
            // 检查麦克风音轨是否正常开启
            const audioTracks = stream.getAudioTracks();
            if (audioTracks.length === 0) {
                log('<span style="color:red;">警告：没有检测到麦克风音轨！</span>');
            } else {
                log('麦克风已成功启用：' + audioTracks[0].label);
            }
        })
        .catch(err => {
            log('<span style="color:red;">获取摄像头/麦克风失败: ' + err.message + '</span>');
        });

        // 3. 监听并接收来电
        peer.on('call', call => {
            log('收到呼叫，正在接通...');
            if (!localStream) {
                log('<span style="color:red;">接听失败：本地音视频流未准备好</span>');
                return;
            }
            call.answer(localStream);
            call.on('stream', remoteStream => {
                log('已收到对方音视频流！');
                handleRemoteStream(remoteStream);
            });
        });

        // 4. 呼叫对方的函数
        function connectToPeer() {
            const remotePeerId = document.getElementById('peer-id-input').value.trim();
            if (!remotePeerId) return alert('请输入对方的 ID');
            if (!localStream) return alert('请先允许麦克风和摄像头权限！');
            
            log('尝试呼叫: ' + remotePeerId);
            const call = peer.call(remotePeerId, localStream);
            
            if (!call) {
                log('<span style="color:red;">呼叫创建失败</span>');
                return;
            }

            call.on('stream', remoteStream => {
                log('呼叫成功，收到对方音视频流');
                handleRemoteStream(remoteStream);
            });

            call.on('error', err => {
                log('<span style="color:red;">通话过程出错: ' + err + '</span>');
            });
        }

        // 5. 强化远端音视频流绑定逻辑
        function handleRemoteStream(remoteStream) {
            const remoteVideo = document.getElementById('remote-video');
            
            remoteVideo.muted = false; // 绝不静音
            remoteVideo.srcObject = remoteStream;
            
            // 检查对方传过来的音轨
            const remoteAudioTracks = remoteStream.getAudioTracks();
            if (remoteAudioTracks.length === 0) {
                log('<span style="color:red;">提示：对方未发送音频（对方麦克风可能关闭/无权限）</span>');
            } else {
                log('已成功接收到对方音频轨！');
            }

            // 播放视频并解锁音频
            const playPromise = remoteVideo.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    log('音视频播放成功！');
                }).catch(error => {
                    log('<span style="color:orange;">声音被自动播放限制拦截，请【点击屏幕任意位置】播放声音！</span>');
                    // 点击任意地方解除限制
                    const unlockAudio = () => {
                        remoteVideo.play();
                        document.body.removeEventListener('click', unlockAudio);
                        log('声音已手动解锁！');
                    };
                    document.body.addEventListener('click', unlockAudio);
                });
            }
        }
    </script>
</body>
</html>
