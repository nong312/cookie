<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC 视频通话与协作系统</title>
    <!-- 引入 PeerJS 库 -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; height: 100vh; display: flex; flex-direction: column; background: #f0f2f5; overflow: hidden; }

        /* 顶部视频区域 */
        #video-container {
            height: 35vh; min-height: 140px; max-height: 70vh;
            background: #1a1a1a; display: flex; justify-content: space-around; align-items: center; padding: 8px;
        }
        .video-box { width: 48%; height: 100%; background: #000; border-radius: 8px; overflow: hidden; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .video-label { position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,0.6); color: #fff; padding: 2px 6px; font-size: 11px; border-radius: 4px; }

        /* 可拖拽分割线 */
        #resizer { height: 8px; background: #ccc; cursor: row-resize; }
        #resizer:hover, #resizer:active { background: #007bff; }

        /* 主控制区 */
        #main-container { flex: 1; display: flex; flex-direction: column; padding: 12px; gap: 10px; overflow-y: auto; background: #fff; }
        .card { background: #f8f9fa; border: 1px solid #e9ecef; padding: 10px; border-radius: 8px; }
        .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
        
        input[type="text"] { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 140px; }
        button { padding: 6px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        button:hover { background: #0056b3; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #a71d2a; }
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #1e7e34; }

        /* 文本框区 */
        #text-area-container { flex: 1; display: flex; flex-direction: column; min-height: 120px; }
        #custom-textarea { flex: 1; width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; resize: none; font-size: 14px; line-height: 1.4; }

        /* 日志 */
        #logs { background: #1e1e1e; color: #00ff00; padding: 8px; font-family: monospace; font-size: 11px; height: 90px; overflow-y: auto; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- 1. 视频区域 -->
    <div id="video-container">
        <div class="video-box">
            <video id="local-video" autoplay playsinline muted></video>
            <span class="video-label">我</span>
        </div>
        <div class="video-box">
            <video id="remote-video" autoplay playsinline></video>
            <span class="video-label">对方</span>
        </div>
    </div>

    <!-- 2. 拖拽分割线 -->
    <div id="resizer" title="上下拖动调整视频区域大小"></div>

    <!-- 3. 下方操作与控制区 -->
    <div id="main-container">
        
        <!-- 连接与通话控制 -->
        <div class="card">
            <div class="row">
                <b>我的 ID:</b> <span id="my-id" style="color: blue; font-weight: bold;">正在连接服务器...</span>
            </div>
            <div class="row">
                <input type="text" id="peer-id-input" placeholder="贴入对方的 ID">
                <button onclick="connectToPeer()">呼叫/连接对方</button>
                <button id="hangup-btn" onclick="hangupCall()" class="btn-danger">断开通话</button>
                <button id="toggle-video-btn" onclick="toggleVideo()" style="background:#6c757d;">关闭视频</button>
            </div>
        </div>

        <!-- 文件操作与本地文档加载 -->
        <div class="card">
            <div class="row">
                <span style="font-weight:bold; font-size:13px;">发送文件给对方：</span>
                <input type="file" id="file-input">
                <button onclick="sendFile()">发送文件</button>
            </div>

            <div class="row" style="margin-top: 8px; border-top: 1px dashed #ccc; padding-top: 8px;">
                <span style="font-weight:bold; font-size:13px;">打开本地文本文档：</span>
                <input type="file" id="local-doc-input" accept=".txt,.md,.json,.js,.html,.css">
                <button class="btn-success" onclick="loadLocalDoc()">显示在下方文本框</button>
            </div>

            <!-- 接收文件提示卡片 -->
            <div id="file-receive-area" style="display:none; margin-top:8px; background:#e9ecef; padding:6px; border-radius:4px;" class="row">
                <span id="file-info" style="font-size:12px;"></span>
                <button id="download-btn">下载文件</button>
                <button id="show-text-btn" class="btn-success" style="display:none;">在文本框显示</button>
            </div>
        </div>

        <!-- 实时协同文本框 -->
        <div id="text-area-container">
            <label style="font-weight: bold; font-size: 13px; margin-bottom: 4px;">实时协作文本框（打字对方实时可见）：</label>
            <textarea id="custom-textarea" placeholder="在这里打字，对方可以实时看到；也可以打开本地文档或填充收到的文本文件..." oninput="onTextInput()"></textarea>
        </div>

        <!-- 日志面板 -->
        <div id="logs"><b>运行日志：</b><br></div>
    </div>

    <script>
        function log(msg) {
            const logBox = document.getElementById('logs');
            logBox.innerHTML += `> ${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // --- 核心修复：添加多组公共 STUN 服务器打洞 ---
        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun.nextcloud.com:443' },
                    { urls: 'stun:stun.cloudflare.com:3478' }
                ]
            },
            debug: 1 // 打印基础错误日志
        };

        const peer = new Peer(peerConfig);

        let localStream = null;
        let activeCall = null;
        let dataConnection = null;
        let isVideoEnabled = true;

        peer.on('open', id => {
            document.getElementById('my-id').innerText = id;
            log('<span style="color:#00ff00;">已成功连接信令服务器！你的 ID 为: ' + id + '</span>');
        });

        peer.on('error', err => {
            log('<span style="color:red;">网络/连接错误 [' + err.type + ']: ' + err.message + '</span>');
            if (err.type === 'peer-unavailable') {
                alert('连接失败：找不到对方的 ID，请确认对方页面是否开启且 ID 输入正确！');
            }
        });

        // 1. 获取音视频权限
        navigator.mediaDevices.getUserMedia({
            video: true,
            audio: { echoCancellation: true, noiseSuppression: true }
        }).then(stream => {
            localStream = stream;
            document.getElementById('local-video').srcObject = stream;
            log('本地摄像头与麦克风就绪');
        }).catch(err => {
            log('<span style="color:red;">获取摄像头/麦克风失败: ' + err.message + '</span>');
        });

        // 2. 接收来自对方的呼叫 (视频)
        peer.on('call', call => {
            log('收到对方的视频呼叫，正在自动接听...');
            activeCall = call;
            call.answer(localStream);

            call.on('stream', remoteStream => {
                log('收到对方视频流！');
                handleRemoteStream(remoteStream);
            });
            call.on('close', () => hangupCall(false));
            call.on('error', err => log('<span style="color:red;">通话异常: ' + err + '</span>'));
        });

        // 3. 接收来自对方的数据通道 (文本与文件)
        peer.on('connection', conn => {
            log('收到对方的数据通信请求...');
            setupDataConnection(conn);
        });

        // 4. 发起呼叫 (点击呼叫按钮)
        function connectToPeer() {
            const remotePeerId = document.getElementById('peer-id-input').value.trim();
            if (!remotePeerId) return alert('请填入对方页面显示的【我的 ID】！');
            if (!localStream) return alert('请先允许麦克风和摄像头权限！');

            log('正在向对方 [' + remotePeerId + '] 发起视频呼叫...');
            
            // 4.1 发起音视频呼叫
            activeCall = peer.call(remotePeerId, localStream);
            if (activeCall) {
                activeCall.on('stream', remoteStream => {
                    log('对方已接听视频！');
                    handleRemoteStream(remoteStream);
                });
                activeCall.on('close', () => hangupCall(false));
                activeCall.on('error', err => log('<span style="color:red;">呼叫失败: ' + err + '</span>'));
            }

            // 4.2 发起数据通道连接 (用于文本同步和文件传输)
            log('正在与对方建立文本/文件通道...');
            const conn = peer.connect(remotePeerId);
            setupDataConnection(conn);
        }

        // 处理远端视频播放
        function handleRemoteStream(remoteStream) {
            const remoteVideo = document.getElementById('remote-video');
            remoteVideo.srcObject = remoteStream;
            remoteVideo.play().catch(err => {
                log('<span style="color:orange;">请点一下屏幕任意位置解锁声音和播放！</span>');
                document.body.addEventListener('click', () => remoteVideo.play(), { once: true });
            });
            log('<span style="color:#00ff00; font-weight:bold;">视频与声音已建立成功！</span>');
        }

        // 5. 断开/挂断通话
        function hangupCall(isInitiator = true) {
            if (activeCall) { activeCall.close(); activeCall = null; }
            if (dataConnection) { dataConnection.close(); dataConnection = null; }
            document.getElementById('remote-video').srcObject = null;
            document.getElementById('file-receive-area').style.display = 'none';
            log('<span style="color:orange;">' + (isInitiator ? '已被您手动断开连接。' : '对方已断开通话。') + '</span>');
        }

        // 6. 开/关视频
        function toggleVideo() {
            if (!localStream) return;
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                isVideoEnabled = !isVideoEnabled;
                videoTrack.enabled = isVideoEnabled;
                const btn = document.getElementById('toggle-video-btn');
                btn.innerText = isVideoEnabled ? '关闭视频' : '开启视频';
                btn.style.background = isVideoEnabled ? '#6c757d' : '#28a745';
                log(isVideoEnabled ? '已开启视频' : '已切换为纯语音模式');
            }
        }

        // 7. 配置数据通道事件
        function setupDataConnection(conn) {
            dataConnection = conn;
            dataConnection.on('open', () => {
                log('<span style="color:#00ff00; font-weight:bold;">文本同步与文件传输通道已就绪！</span>');
            });

            dataConnection.on('data', data => {
                if (data.type === 'text_sync') {
                    document.getElementById('custom-textarea').value = data.content;
                } else if (data.type === 'file_transfer') {
                    log(`收到文件: <b>${data.fileName}</b> (${Math.round(data.fileSize/1024)} KB)`);
                    const receiveArea = document.getElementById('file-receive-area');
                    const fileInfo = document.getElementById('file-info');
                    const showTextBtn = document.getElementById('show-text-btn');
                    
                    receiveArea.style.display = 'flex';
                    fileInfo.innerText = `收到文件: ${data.fileName}`;

                    const isText = data.fileType.startsWith('text/') || data.fileName.endsWith('.txt') || data.fileName.endsWith('.md') || data.fileName.endsWith('.json');
                    showTextBtn.style.display = isText ? 'inline-block' : 'none';

                    document.getElementById('download-btn').onclick = () => {
                        const blob = new Blob([data.fileData], { type: data.fileType });
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = data.fileName;
                        a.click();
                        log('文件已下发到本地下载');
                    };

                    showTextBtn.onclick = () => {
                        const decoder = new TextDecoder('utf-8');
                        const text = decoder.decode(data.fileData);
                        document.getElementById('custom-textarea').value = text;
                        onTextInput();
                        log('文本文件已显示在文本框');
                    };
                }
            });

            dataConnection.on('close', () => {
                log('<span style="color:orange;">数据传输通道已关闭</span>');
            });
        }

        // 8. 实时打字同步
        function onTextInput() {
            const textContent = document.getElementById('custom-textarea').value;
            if (dataConnection && dataConnection.open) {
                dataConnection.send({
                    type: 'text_sync',
                    content: textContent
                });
            }
        }

        // 9. 打开本地文档
        function loadLocalDoc() {
            const fileInput = document.getElementById('local-doc-input');
            const file = fileInput.files[0];
            if (!file) return alert('请先选择本地文本文档！');

            const reader = new FileReader();
            reader.onload = function(e) {
                const textContent = e.target.result;
                document.getElementById('custom-textarea').value = textContent;
                onTextInput();
                log(`已加载本地文件 [${file.name}] 到文本框`);
            };
            reader.readAsText(file, 'UTF-8');
        }

        // 10. 发送文件
        function sendFile() {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            if (!file) return alert('请选择要发送的文件！');
            if (!dataConnection || !dataConnection.open) return alert('通道尚未建立，请先点击呼叫/连接对方！');

            log(`正在发送文件: ${file.name}...`);
            const reader = new FileReader();
            reader.onload = function(e) {
                dataConnection.send({
                    type: 'file_transfer',
                    fileName: file.name,
                    fileSize: file.size,
                    fileType: file.type,
                    fileData: e.target.result
                });
                log('文件发送成功！');
                fileInput.value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        // 11. 拖拽分割线调节视频区域大小
        const resizer = document.getElementById('resizer');
        const videoContainer = document.getElementById('video-container');
        let isResizing = false;

        resizer.addEventListener('mousedown', () => isResizing = true);
        resizer.addEventListener('touchstart', () => isResizing = true);

        window.addEventListener('mousemove', e => {
            if (isResizing && e.clientY > 100 && e.clientY < window.innerHeight - 150) {
                videoContainer.style.height = `${e.clientY}px`;
            }
        });
        window.addEventListener('touchmove', e => {
            if (isResizing && e.touches[0].clientY > 100 && e.touches[0].clientY < window.innerHeight - 150) {
                videoContainer.style.height = `${e.touches[0].clientY}px`;
            }
        });
        window.addEventListener('mouseup', () => isResizing = false);
        window.addEventListener('touchend', () => isResizing = false);
    </script>
</body>
</html>
