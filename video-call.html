<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebRTC 视频通话与协作系统 (固定ID版)</title>
    <!-- 引入 PeerJS 库 -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body { 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: #f0f2f5; 
        }

        body { 
            display: flex; 
            flex-direction: column; 
        }

        /* 顶部视频区域 */
        #video-container {
            height: 30vh; 
            min-height: 120px; 
            max-height: 60vh;
            background: #1a1a1a; 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            padding: 6px;
            flex-shrink: 0;
        }
        .video-box { width: 48%; height: 100%; background: #000; border-radius: 8px; overflow: hidden; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .video-label { position: absolute; bottom: 4px; left: 4px; background: rgba(0,0,0,0.6); color: #fff; padding: 2px 6px; font-size: 10px; border-radius: 4px; }

        /* 拖拽分割线 */
        #resizer { height: 8px; background: #ccc; cursor: row-resize; flex-shrink: 0; }
        #resizer:hover, #resizer:active { background: #007bff; }

        /* 下方主控制与文本区 */
        #main-container { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            padding: 10px; 
            gap: 8px; 
            overflow-y: auto; 
            background: #fff; 
        }

        .card { background: #f8f9fa; border: 1px solid #e9ecef; padding: 8px 10px; border-radius: 8px; flex-shrink: 0; }
        .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
        .row:last-child { margin-bottom: 0; }
        
        input[type="text"] { padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 90px; font-size: 13px; }
        button { padding: 5px 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
        button:hover { background: #0056b3; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #a71d2a; }
        .btn-success { background: #28a745; }
        .btn-success:hover { background: #1e7e34; }
        .btn-warning { background: #ffc107; color: #212529; }
        .btn-warning:hover { background: #e0a800; }

        /* 文本框区域 */
        #text-area-container { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            min-height: 140px; 
        }
        
        .text-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 4px; 
        }

        #custom-textarea { 
            flex: 1; 
            width: 100%; 
            padding: 8px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            resize: none; 
            font-size: 14px; 
            line-height: 1.4; 
        }

        /* 日志面板 */
        #logs { background: #1e1e1e; color: #00ff00; padding: 6px; font-family: monospace; font-size: 11px; height: 60px; overflow-y: auto; border-radius: 4px; flex-shrink: 0; }
    </style>
</head>
<body>

    <!-- 1. 顶部视频区域 -->
    <div id="video-container">
        <div class="video-box">
            <video id="local-video" autoplay playsinline muted></video>
            <span class="video-label">我</span>
        </div>
        <div class="video-box">
            <video id="remote-video" autoplay playsinline webkit-playsinline></video>
            <span class="video-label">对方</span>
        </div>
    </div>

    <!-- 2. 可拖拽分割线 -->
    <div id="resizer" title="上下拖动调整视频区域大小"></div>

    <!-- 3. 下方操作与控制区 -->
    <div id="main-container">
        
        <!-- 固定 ID 配置与通话控制 -->
        <div class="card">
            <!-- 第一行：设置我自己的固定名字 -->
            <div class="row">
                <span style="font-size: 12px; font-weight: bold;">我的固定名字:</span>
                <input type="text" id="my-custom-id-input" placeholder="例如: phoneA" style="max-width: 120px;">
                <button class="btn-warning" onclick="saveMyIdConfig()">💾 设定我的名字并重启服务</button>
                <span style="font-size: 11px; color: #666;">(修改后需点设定)</span>
            </div>

            <!-- 第二行：输入对方的名字并呼叫 -->
            <div class="row">
                <span style="font-size: 12px; font-weight: bold;">呼叫对方名字:</span>
                <input type="text" id="target-id-input" placeholder="例如: phoneB">
                <button class="btn-success" onclick="saveTargetId()">💾 记住对方</button>
                <button onclick="connectToPeer()">一键呼叫</button>
                <button id="hangup-btn" onclick="hangupCall()" class="btn-danger">挂断</button>
                <button id="toggle-video-btn" onclick="toggleVideo()" style="background:#6c757d;">关视频</button>
            </div>
        </div>

        <!-- 精简合并后的文件操作 -->
        <div class="card">
            <div class="row">
                <input type="file" id="file-input" style="font-size:11px; flex:1;">
                <button onclick="sendFile()">发送</button>
                <button class="btn-success" onclick="loadLocalDocToBox()">显示在框内</button>
            </div>

            <!-- 接收文件提示卡片 -->
            <div id="file-receive-area" style="display:none; margin-top:4px; background:#e9ecef; padding:4px; border-radius:4px;" class="row">
                <span id="file-info" style="font-size:11px;"></span>
                <button id="download-btn">下载文件</button>
                <button id="show-text-btn" class="btn-success" style="display:none;">载入框内</button>
            </div>
        </div>

        <!-- 4. 实时协同文本框 -->
        <div id="text-area-container">
            <div class="text-header">
                <label style="font-weight: bold; font-size: 12px;">实时协作文本框：</label>
                <button class="btn-warning" onclick="saveTextToTxt()" style="font-weight: bold;">💾 保存/下载为 TXT 文件</button>
            </div>
            <textarea id="custom-textarea" placeholder="在这里打字，对方可以实时看到；也可以选择本地文件显示在框内..." oninput="onTextInput()"></textarea>
        </div>

        <!-- 日志面板 -->
        <div id="logs"><b>运行日志：</b><br></div>
    </div>

    <script>
        function log(msg) {
            const logBox = document.getElementById('logs');
            logBox.innerHTML += `> ${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun.nextcloud.com:443' },
                    { urls: 'stun:stun.cloudflare.com:3478' }
                ]
            },
            debug: 1
        };

        let peer = null;
        let localStream = null;
        let activeCall = null;
        let dataConnection = null;
        let isVideoEnabled = true;
        let myCurrentId = null;

        // 页面加载时：初始化固定 ID 逻辑
        window.addEventListener('DOMContentLoaded', () => {
            // 1. 读取或赋予默认的“我自己的名字”
            let savedMyId = localStorage.getItem('my_fixed_id');
            if (!savedMyId) {
                // 如果没有设置过，随机给个默认名字防止空白
                savedMyId = 'myDevice_' + Math.floor(Math.random() * 1000);
                localStorage.setItem('my_fixed_id', savedMyId);
            }
            document.getElementById('my-custom-id-input').value = savedMyId;

            // 2. 读取“对方的名字”
            const savedTargetId = localStorage.getItem('target_fixed_id');
            if (savedTargetId) {
                document.getElementById('target-id-input').value = savedTargetId;
            }

            // 3. 使用这个固定名字初始化 Peer
            initPeer(savedMyId);
        });

        // 初始化 Peer（使用自定义固定 ID）
        function initPeer(customId) {
            if (peer) {
                peer.destroy();
            }
            log(`正在以固定名称 [${customId}] 连接信令服务...`);
            peer = new Peer(customId, peerConfig);

            peer.on('open', id => {
                myCurrentId = id;
                log(`<span style="color:#00ff00;">上线成功！我的固定名称: ${id}</span>`);
            });

            peer.on('error', err => {
                log(`<span style="color:red;">网络错误 [${err.type}]: ${err.message}</span>`);
                if (err.type === 'unavailable-id') {
                    alert(`错误：名字 "${customId}" 已经被其他在线设备占用了！请换一个不重名的名字。`);
                }
            });

            // 接收呼叫
            peer.on('call', async call => {
                log('收到来自对方的呼叫，准备自动接听...');
                if (call.peer) {
                    document.getElementById('target-id-input').value = call.peer;
                    localStorage.setItem('target_fixed_id', call.peer);
                }
                const stream = await ensureLocalStream();
                activeCall = call;
                call.answer(stream);

                call.on('stream', remoteStream => {
                    log('视频流建立成功！');
                    handleRemoteStream(remoteStream);
                });
                call.on('close', () => hangupCall(false));
                call.on('error', err => log('<span style="color:red;">通话中断: ' + err + '</span>'));
            });

            // 接收数据通道
            peer.on('connection', conn => {
                log('收到对方数据通道连接...');
                if (conn.peer) {
                    document.getElementById('target-id-input').value = conn.peer;
                    localStorage.setItem('target_fixed_id', conn.peer);
                }
                setupDataConnection(conn);
            });
        }

        // 用户点击“设定我的名字”
        function saveMyIdConfig() {
            const newId = document.getElementById('my-custom-id-input').value.trim();
            if (!newId) return alert('名字不能为空！');
            localStorage.setItem('my_fixed_id', newId);
            alert(`已保存我的名字为: ${newId}，系统将重新连接...`);
            initPeer(newId);
        }

        // 记住对方的名字
        function saveTargetId() {
            const targetId = document.getElementById('target-id-input').value.trim();
            if (!targetId) return alert('对方名字不能为空！');
            localStorage.setItem('target_fixed_id', targetId);
            alert(`💾 已记住对方名字: ${targetId}`);
        }

        async function ensureLocalStream() {
            if (localStream) return localStream;
            try {
                log('正在请求打开本地摄像头与麦克风...');
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });
                document.getElementById('local-video').srcObject = localStream;
                log('本地摄像头与麦克风已开启');
                return localStream;
            } catch (err) {
                log('<span style="color:red;">获取摄像头/麦克风失败: ' + err.message + '</span>');
                alert('无法开启摄像头/麦克风，请检查浏览器权限设置！');
                return null;
            }
        }

        // 主动呼叫对方
        async function connectToPeer() {
            const targetPeerId = document.getElementById('target-id-input').value.trim();
            if (!targetPeerId) return alert('请先输入对方的名字！');
            if (targetPeerId === myCurrentId) return alert('不能呼叫自己！');

            const stream = await ensureLocalStream();
            if (!stream) return;

            log(`向固定名字 [${targetPeerId}] 发起呼叫...`);
            
            activeCall = peer.call(targetPeerId, stream);
            if (activeCall) {
                activeCall.on('stream', remoteStream => {
                    log('对方已接听！');
                    handleRemoteStream(remoteStream);
                });
                activeCall.on('close', () => hangupCall(false));
                activeCall.on('error', err => log('<span style="color:red;">呼叫失败（对方可能未在线）: ' + err + '</span>'));
            }

            const conn = peer.connect(targetPeerId);
            setupDataConnection(conn);
        }

        function handleRemoteStream(remoteStream) {
            const remoteVideo = document.getElementById('remote-video');
            remoteVideo.srcObject = remoteStream;
            remoteVideo.volume = 1.0;
            remoteVideo.muted = false;

            remoteVideo.play().then(() => {
                log('远端媒体流播放成功（已强制外放）');
            }).catch(err => {
                log('<span style="color:orange;">请点击任意屏幕位置以彻底唤醒外放声音！</span>');
            });
        }

        document.body.addEventListener('click', () => {
            const remoteVideo = document.getElementById('remote-video');
            if (remoteVideo && remoteVideo.srcObject) {
                remoteVideo.volume = 1.0;
                remoteVideo.play().catch(() => {});
            }
        }, { once: true });

        function hangupCall(isInitiator = true) {
            if (activeCall) { activeCall.close(); activeCall = null; }
            if (dataConnection) { dataConnection.close(); dataConnection = null; }
            document.getElementById('remote-video').srcObject = null;
            document.getElementById('file-receive-area').style.display = 'none';

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
                document.getElementById('local-video').srcObject = null;
            }

            log('<span style="color:orange;">' + (isInitiator ? '已手动挂断并关闭摄像头。' : '对方已挂断，设备已重置。') + '</span>');
        }

        function toggleVideo() {
            if (!localStream) return;
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                isVideoEnabled = !isVideoEnabled;
                videoTrack.enabled = isVideoEnabled;
                const btn = document.getElementById('toggle-video-btn');
                btn.innerText = isVideoEnabled ? '关视频' : '开视频';
                btn.style.background = isVideoEnabled ? '#6c757d' : '#28a745';
            }
        }

        function setupDataConnection(conn) {
            dataConnection = conn;
            dataConnection.on('open', () => {
                log('<span style="color:#00ff00;">数据通信通道已成功就绪！</span>');
            });

            dataConnection.on('data', data => {
                if (data.type === 'text_sync') {
                    document.getElementById('custom-textarea').value = data.content;
                } else if (data.type === 'file_transfer') {
                    log(`收到文件: <b>${data.fileName}</b>`);
                    const receiveArea = document.getElementById('file-receive-area');
                    const fileInfo = document.getElementById('file-info');
                    const showTextBtn = document.getElementById('show-text-btn');
                    
                    receiveArea.style.display = 'flex';
                    fileInfo.innerText = `文件: ${data.fileName}`;

                    const isText = data.fileType.startsWith('text/') || data.fileName.endsWith('.txt') || data.fileName.endsWith('.md') || data.fileName.endsWith('.json');
                    showTextBtn.style.display = isText ? 'inline-block' : 'none';

                    document.getElementById('download-btn').onclick = () => {
                        const blob = new Blob([data.fileData], { type: data.fileType });
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = data.fileName;
                        a.click();
                    };

                    showTextBtn.onclick = () => {
                        const decoder = new TextDecoder('utf-8');
                        const text = decoder.decode(data.fileData);
                        document.getElementById('custom-textarea').value = text;
                        onTextInput();
                    };
                }
            });
        }

        function onTextInput() {
            const textContent = document.getElementById('custom-textarea').value;
            if (dataConnection && dataConnection.open) {
                dataConnection.send({ type: 'text_sync', content: textContent });
            }
        }

        function loadLocalDocToBox() {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            if (!file) return alert('请先选择一个文件！');

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('custom-textarea').value = e.target.result;
                onTextInput();
                log(`已加载文件 [${file.name}] 到框内`);
            };
            reader.readAsText(file, 'UTF-8');
        }

        function sendFile() {
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];
            if (!file) return alert('请选择要发送的文件！');
            if (!dataConnection || !dataConnection.open) return alert('通道未建立，请先呼叫连接对方！');

            log(`发送中: ${file.name}...`);
            const reader = new FileReader();
            reader.onload = function(e) {
                dataConnection.send({
                    type: 'file_transfer',
                    fileName: file.name,
                    fileSize: file.size,
                    fileType: file.type,
                    fileData: e.target.result
                });
                log('文件发送完毕！');
                fileInput.value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        function saveTextToTxt() {
            const textContent = document.getElementById('custom-textarea').value;
            if (!textContent) return alert('文本框内容为空，无需保存！');

            const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
            const now = new Date();
            const timeStr = `${now.getFullYear()}${now.getMonth()+1}${now.getDate()}_${now.getHours()}${now.getMinutes()}`;
            const fileName = `协作文档_${timeStr}.txt`;

            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            link.click();
            URL.revokeObjectURL(link.href);
            log(`已保存文本为本地文件: ${fileName}`);
        }

        const resizer = document.getElementById('resizer');
        const videoContainer = document.getElementById('video-container');
        let isResizing = false;

        resizer.addEventListener('mousedown', () => isResizing = true);
        resizer.addEventListener('touchstart', () => isResizing = true);

        window.addEventListener('mousemove', e => {
            if (isResizing && e.clientY > 80 && e.clientY < window.innerHeight - 200) {
                videoContainer.style.height = `${e.clientY}px`;
            }
        });
        window.addEventListener('touchmove', e => {
            if (isResizing && e.touches[0].clientY > 80 && e.touches[0].clientY < window.innerHeight - 200) {
                videoContainer.style.height = `${e.touches[0].clientY}px`;
            }
        });
        window.addEventListener('mouseup', () => isResizing = false);
        window.addEventListener('touchend', () => isResizing = false);
    </script>
</body>
</html>
