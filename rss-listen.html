<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常亮 RSS 新闻播报与定时器</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --highlight: #fef08a;
            --highlight-text: #0f172a;
            --selected-row: #1e3a8a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 100vh;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--panel-bg);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        select, input[type="text"], button {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        select {
            cursor: pointer;
        }

        select.speed-select {
            padding: 8px 6px;
            min-width: auto;
            border-left: none;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }

        button.btn-has-speed {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }

        #rssSelect {
            flex: 1;
            min-width: 200px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 150px;
        }

        button {
            cursor: pointer;
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: 600;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.btn-danger {
            background-color: var(--danger);
        }
        button.btn-danger:hover {
            background-color: var(--danger-hover);
        }

        button.btn-success {
            background-color: var(--success);
        }

        .timer-display {
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: bold;
            color: #f59e0b;
            min-width: 100px;
        }

        .main-container {
            display: flex;
            gap: 12px;
            flex: 1;
            min-height: 450px;
        }

        .table-container {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow-y: auto;
            max-height: calc(100vh - 230px);
            scroll-behavior: smooth;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            position: sticky;
            top: 0;
            background-color: #0f172a;
            color: var(--text-muted);
            font-size: 0.85rem;
            z-index: 2;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }

        tr.selected {
            background-color: var(--selected-row) !important;
        }

        td.col-chk {
            width: 40px;
            text-align: center;
        }

        .content-container {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            max-height: calc(100vh - 230px);
            scroll-behavior: smooth;
        }

        .content-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .content-body {
            line-height: 1.6;
            font-size: 1rem;
            color: var(--text-main);
            white-space: pre-wrap;
        }

        .sentence-highlight {
            background-color: var(--highlight);
            color: var(--highlight-text);
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: bold;
            display: inline-block;
        }

        .status-bar {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .table-container, .content-container {
                max-height: 300px;
            }
        }
    </style>
</head>
<body>

    <div class="row">
        <label for="rssSelect">新闻源:</label>
        <select id="rssSelect"></select>
        <button id="addRssBtn">+ </button>
        <button id="delRssBtn" class="btn-danger">-- </button>
        <button id="exportRssBtn">📤 </button>
        <button id="importRssBtn">📥 </button>
        <input type="file" id="importFileInput" accept=".txt" style="display: none;">
    </div>

    <div class="row">
        <button id="filterBtn">🔍 筛选保留</button>
        <button id="clearAllBtn" class="btn-danger">🗑 清空列表</button>
        <button id="stopBtn" class="btn-danger">⏹ </button>
        
        <!-- 中文播放组 -->
        <div class="btn-group">
            <button id="playZhBtn" class="btn-success btn-has-speed">▶️ 中</button>
            <select id="zhSpeedSelect" class="speed-select" title="中文语速">
                <option value="0.5">0.5</option>
                <option value="0.75">0.75</option>
                <option value="1.0" selected>1.0</option>
                <option value="1.25">1.25</option>
                <option value="1.5">1.5</option>
                <option value="1.75">1.75</option>
                <option value="2.0">2.0</option>
            </select>
        </div>

        <!-- 英文播放组 -->
        <div class="btn-group">
            <button id="playEnBtn" class="btn-success btn-has-speed">▶️ 英</button>
            <select id="enSpeedSelect" class="speed-select" title="英文语速">
                <option value="0.5">0.5</option>
                <option value="0.75">0.75</option>
                <option value="1.0" selected>1.0</option>
                <option value="1.25">1.25</option>
                <option value="1.5">1.5</option>
                <option value="1.75">1.75</option>
                <option value="2.0">2.0</option>
            </select>
        </div>

        
    </div>

    <div class="row">
        <label for="timeInput">倒计时 (例: 20s, 30m, 1h20m):</label>
        <input type="text" id="timeInput" placeholder="比如: 20s 或 15m 或 1h30m">
        <button id="startTimerBtn">⏱ 开始计时</button>
        <button id="stopTimerBtn" class="btn-danger">取消计时</button>
        <div id="timerDisplay" class="timer-display">00:00:00</div>
    </div>

    <div class="status-bar">
        <span id="screenStatus">💡 屏幕常亮: 正在初始化...</span>
        <span id="speechStatus">🗣 播放状态: 静止</span>
    </div>

    <div class="main-container">
        <div class="table-container" id="tableContainer">
            <table>
                <thead>
                    <tr>
                        <th class="col-chk"><input type="checkbox" id="selectAllChk"></th>
                        <th>新闻标题 (点击查看/选择播放起点)</th>
                    </tr>
                </thead>
                <tbody id="newsTableBody">
                    <tr><td colspan="2" style="text-align:center; color: var(--text-muted);">正在加载 RSS 新闻列表...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="content-container" id="contentContainer">
            <div id="contentTitle" class="content-title">新闻详情预看</div>
            <div id="contentBody" class="content-body">在左侧选择一条新闻后，此处将显示完整详情。点击“中文播放”或“英文播放”开始朗读，朗读的句子会自动滚动并高亮突出。</div>
        </div>
    </div>

<script>
    const DEFAULT_FEEDS = [
        
        { name: "BBC News 中文", url: "https://feedx.net/rss/bbc.xml" },
        { name: "SBS", url: "https://www.sbs.com.au/language/chinese/zh-hans/rss" },
        { name: "ABC", url: "https://www.abc.net.au/news/feed/8443904/rss.xml" },
        { name: "x联合早报-国际", url: "https://plink.anyfeeder.com/zaobao/realtime/world" },
        { name: "纽约时报中文网", url: "https://feedx.net/rss/nytimes.xml" },
        { name: "google AU", url: "https://news.google.com/rss?hl=en-AU&gl=AU&ceid=AU:en-AU" },
        { name: "Al Jazeera", url: "https://www.aljazeera.com/xml/rss/all.xml" },
        { name: "The Guardian Asia", url: "https://www.theguardian.com/world/asia-pacific" },
        { name: "The Guardian AU", url: "https://www.theguardian.com/australia-news/rss" },
        { name: "BBC World News", url: "https://feeds.bbci.co.uk/news/rss.xml" },
        { name: "BBC World Sub-section", url: "https://feeds.bbci.co.uk/news/world/rss.xml" },
        { name: "BBC Asia", url: "https://feeds.bbci.co.uk/news/world/asia/rss.xml" },
        { name: "BBC US & Canada", url: "https://feeds.bbci.co.uk/news/world/us_and_canada/rss.xml" },
        { name: "RTHK World (英文新闻)", url: "https://rthk.hk/rthk/news/rss/e_expressnews_einternational.xml" },
        
    ];

    let rssList = [...DEFAULT_FEEDS];
    let currentNewsList = [];
    let selectedNewsIndex = 0;
    let wakeLock = null;
    let timerId = null;
    let timerTotalSeconds = 0;

    let synth = window.speechSynthesis;
    let isPlaying = false;
    let currentPlayList = [];
    let currentPlayListIndex = 0;
    let currentSentences = [];
    let currentSentenceIndex = 0;
    let activeLang = 'zh-CN';
    let currentSpeed = 1.0;

    const rssSelect = document.getElementById('rssSelect');
    const addRssBtn = document.getElementById('addRssBtn');
    const delRssBtn = document.getElementById('delRssBtn');
    const exportRssBtn = document.getElementById('exportRssBtn');
    const importRssBtn = document.getElementById('importRssBtn');
    const importFileInput = document.getElementById('importFileInput');

    const newsTableBody = document.getElementById('newsTableBody');
    const selectAllChk = document.getElementById('selectAllChk');
    const contentTitle = document.getElementById('contentTitle');
    const contentBody = document.getElementById('contentBody');
    const contentContainer = document.getElementById('contentContainer');
    const tableContainer = document.getElementById('tableContainer');

    const filterBtn = document.getElementById('filterBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const playZhBtn = document.getElementById('playZhBtn');
    const playEnBtn = document.getElementById('playEnBtn');
    const zhSpeedSelect = document.getElementById('zhSpeedSelect');
    const enSpeedSelect = document.getElementById('enSpeedSelect');
    const stopBtn = document.getElementById('stopBtn');

    const timeInput = document.getElementById('timeInput');
    const startTimerBtn = document.getElementById('startTimerBtn');
    const stopTimerBtn = document.getElementById('stopTimerBtn');

    const timerDisplay = document.getElementById('timerDisplay');
    const screenStatus = document.getElementById('screenStatus');
    const speechStatus = document.getElementById('speechStatus');

    const API_ENDPOINTS = [
        url => `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`,
        url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`
    ];

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                screenStatus.textContent = "💡 屏幕常亮: 已开启 (防止屏幕熄灭)";
            } else {
                screenStatus.textContent = "💡 屏幕常亮: 浏览器不支持 WakeLock API";
            }
        } catch (err) {
            screenStatus.textContent = "💡 屏幕常亮: 无法锁定屏幕 (" + err.message + ")";
        }
    }

    document.addEventListener("visibilitychange", () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
            requestWakeLock();
        }
    });

    function initRssDropdown() {
        rssSelect.innerHTML = '';
        rssList.forEach((item, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.textContent = item.name;
            rssSelect.appendChild(opt);
        });
    }

    async function loadRss(url) {
        let parsedItems = null;

        try {
            const res = await fetch(API_ENDPOINTS[0](url));
            if (res.ok) {
                const data = await res.json();
                if (data.status === 'ok' && data.items) {
                    parsedItems = data.items.map(item => ({
                        title: item.title || "无标题",
                        content: (item.description || item.content || item.title).replace(/<[^>]+>/g, '').trim(),
                        checked: false
                    }));
                }
            }
        } catch (e) {
            console.warn("主 API 解析失败，切换到备用...", e);
        }

        if (!parsedItems) {
            try {
                const res = await fetch(API_ENDPOINTS[1](url));
                if (res.ok) {
                    const data = await res.json();
                    if (data.contents) {
                        const parser = new DOMParser();
                        const xmlDoc = parser.parseFromString(data.contents, "text/xml");
                        const items = xmlDoc.querySelectorAll("item, entry");
                        parsedItems = [];
                        items.forEach(item => {
                            const title = item.querySelector("title")?.textContent || "无标题";
                            let description = item.querySelector("description, summary, content")?.textContent || title;
                            description = description.replace(/<[^>]+>/g, '').trim();
                            parsedItems.push({
                                title: title.trim(),
                                content: description || title.trim(),
                                checked: false
                            });
                        });
                    }
                }
            } catch (e) {
                console.error("备用代理也失败:", e);
            }
        }

        if (parsedItems && parsedItems.length > 0) {
            currentNewsList = currentNewsList.concat(parsedItems);
            renderTable();
        } else {
            alert("加载该源失败，请检查链接或网络！");
        }
    }

    function renderTable() {
        newsTableBody.innerHTML = '';
        if (currentNewsList.length === 0) {
            newsTableBody.innerHTML = `<tr><td colspan="2" style="text-align:center; color: var(--text-muted);">列表为空，请选择新闻源拉取</td></tr>`;
            return;
        }

        selectAllChk.checked = false;

        currentNewsList.forEach((news, idx) => {
            const tr = document.createElement('tr');
            tr.id = `news-row-${idx}`;
            if (idx === selectedNewsIndex) tr.classList.add('selected');

            tr.innerHTML = `
                <td class="col-chk"><input type="checkbox" class="news-chk" data-idx="${idx}" ${news.checked ? 'checked' : ''}></td>
                <td>${escapeHtml(news.title)}</td>
            `;

            tr.addEventListener('click', (e) => {
                if (e.target.tagName !== 'INPUT') {
                    selectNewsItem(idx);
                }
            });

            const chk = tr.querySelector('.news-chk');
            chk.addEventListener('change', (e) => {
                currentNewsList[idx].checked = e.target.checked;
            });

            newsTableBody.appendChild(tr);
        });
    }

    function selectNewsItem(index) {
        if (index < 0 || index >= currentNewsList.length) return;
        selectedNewsIndex = index;
        renderTable();
        
        const tr = document.getElementById(`news-row-${index}`);
        if (tr) {
            tr.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        contentTitle.textContent = currentNewsList[index].title;
        contentBody.textContent = currentNewsList[index].content;
        contentContainer.scrollTop = 0;
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    exportRssBtn.addEventListener('click', () => {
        let textContent = "";
        rssList.forEach(item => {
            textContent += `${item.name} | ${item.url}\n`;
        });

        const blob = new Blob([textContent], { type: "text/plain;charset=utf-8" });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "rss_subscriptions.txt";
        a.click();
        URL.revokeObjectURL(a.href);
    });

    importRssBtn.addEventListener('click', () => {
        importFileInput.click();
    });

    importFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            const lines = evt.target.result.split('\n');
            let count = 0;
            lines.forEach(line => {
                const parts = line.split('|');
                if (parts.length >= 2) {
                    const name = parts[0].trim();
                    const url = parts[1].trim();
                    if (name && url && !rssList.some(r => r.url === url)) {
                        rssList.push({ name, url });
                        count++;
                    }
                }
            });
            if (count > 0) {
                initRssDropdown();
                alert(`成功导入 ${count} 个新闻源！`);
            } else {
                alert("未匹配到新的有效 RSS 资源或均已存在。");
            }
        };
        reader.readAsText(file);
        importFileInput.value = '';
    });

    filterBtn.addEventListener('click', () => {
        currentNewsList = currentNewsList.filter(news => news.checked);
        selectedNewsIndex = 0;
        renderTable();
        if (currentNewsList.length > 0) {
            selectNewsItem(0);
        } else {
            contentTitle.textContent = "列表已清空";
            contentBody.textContent = "没有保留任何新闻。";
        }
    });

    clearAllBtn.addEventListener('click', () => {
        currentNewsList = [];
        selectedNewsIndex = 0;
        renderTable();
        contentTitle.textContent = "新闻详情预看";
        contentBody.textContent = "列表已清空。您可以切换新闻源重新收集新闻。";
    });

    selectAllChk.addEventListener('change', (e) => {
        const isChecked = e.target.checked;
        currentNewsList.forEach(news => news.checked = isChecked);
        renderTable();
    });

    addRssBtn.addEventListener('click', () => {
        const name = prompt("请输入 RSS 新闻网站名称:");
        if (!name) return;
        const url = prompt("请输入 RSS 推送链接 (URL):");
        if (!url) return;

        rssList.push({ name, url });
        initRssDropdown();
        rssSelect.value = rssList.length - 1;
        loadRss(url);
    });

    delRssBtn.addEventListener('click', () => {
        if (rssList.length <= 1) {
            alert("至少保留一个 RSS 源！");
            return;
        }
        const idx = parseInt(rssSelect.value);
        rssList.splice(idx, 1);
        initRssDropdown();
    });

    rssSelect.addEventListener('change', (e) => {
        const idx = parseInt(e.target.value);
        loadRss(rssList[idx].url);
    });

    // 开始播放（传入语言与对应的速度）
    function startPlaylist(lang, speed) {
        stopSpeech();
        activeLang = lang;
        currentSpeed = parseFloat(speed);

        if (currentNewsList.length === 0) {
            alert("列表中没有可播放的新闻！");
            return;
        }

        let startIdx = selectedNewsIndex >= 0 && selectedNewsIndex < currentNewsList.length ? selectedNewsIndex : 0;

        currentPlayList = [];
        for (let i = startIdx; i < currentNewsList.length; i++) {
            currentPlayList.push({ ...currentNewsList[i], originalIndex: i });
        }

        isPlaying = true;
        currentPlayListIndex = 0;
        playCurrentNewsItem();
    }

    function playCurrentNewsItem() {
        if (!isPlaying || currentPlayListIndex >= currentPlayList.length) {
            stopSpeech();
            speechStatus.textContent = "🗣 播放状态: 播放结束";
            return;
        }

        const news = currentPlayList[currentPlayListIndex];
        selectNewsItem(news.originalIndex);

        const textToRead = `${news.title}。${news.content}`;
        currentSentences = textToRead.split(/([。！？\n!;?]+)/).filter(Boolean);
        
        let mergedSentences = [];
        for (let i = 0; i < currentSentences.length; i++) {
            if (i % 2 === 0) {
                let sentence = currentSentences[i];
                let punct = currentSentences[i+1] || '';
                if (sentence.trim()) {
                    mergedSentences.push(sentence + punct);
                }
            }
        }
        currentSentences = mergedSentences;
        currentSentenceIndex = 0;

        speechStatus.textContent = `🗣 播放状态: 正在以 ${currentSpeed}x 速度播放第 (${news.originalIndex + 1}/${currentNewsList.length}) 条`;
        playNextSentence();
    }

    function playNextSentence() {
        if (!isPlaying) return;

        if (currentSentenceIndex >= currentSentences.length) {
            currentPlayListIndex++;
            playCurrentNewsItem();
            return;
        }

        const sentenceText = currentSentences[currentSentenceIndex];

        renderHighlightedContent(sentenceText);

        const utterance = new SpeechSynthesisUtterance(sentenceText);
        utterance.lang = activeLang;
        utterance.rate = currentSpeed; // 应用当前调好的播放速度

        utterance.onend = () => {
            currentSentenceIndex++;
            playNextSentence();
        };

        utterance.onerror = (err) => {
            console.error("朗读错误:", err);
            currentSentenceIndex++;
            playNextSentence();
        };

        synth.speak(utterance);
    }

    function renderHighlightedContent(targetSentence) {
        const fullText = currentNewsList[selectedNewsIndex]?.content || "";
        const titleText = currentNewsList[selectedNewsIndex]?.title || "";

        let htmlTitle = escapeHtml(titleText);
        let htmlBody = escapeHtml(fullText);

        const escapedTarget = escapeHtml(targetSentence.trim());
        if (escapedTarget && htmlTitle.includes(escapedTarget)) {
            htmlTitle = htmlTitle.replace(escapedTarget, `<span class="sentence-highlight" id="active-highlight">${escapedTarget}</span>`);
        } else if (escapedTarget && htmlBody.includes(escapedTarget)) {
            htmlBody = htmlBody.replace(escapedTarget, `<span class="sentence-highlight" id="active-highlight">${escapedTarget}</span>`);
        } else if (escapedTarget) {
            htmlBody = `<span class="sentence-highlight" id="active-highlight">${escapedTarget}</span><br>` + htmlBody;
        }

        contentTitle.innerHTML = htmlTitle;
        contentBody.innerHTML = htmlBody;

        setTimeout(() => {
            const highlightEl = document.getElementById('active-highlight');
            if (highlightEl) {
                highlightEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }, 50);
    }

    function stopSpeech() {
        isPlaying = false;
        if (synth) synth.cancel();
        speechStatus.textContent = "🗣 播放状态: 已停止";
        if (currentNewsList[selectedNewsIndex]) {
            contentTitle.textContent = currentNewsList[selectedNewsIndex].title;
            contentBody.textContent = currentNewsList[selectedNewsIndex].content;
        }
    }

    // 绑定带自定义速度的播放点击事件
    playZhBtn.addEventListener('click', () => startPlaylist('zh-CN', zhSpeedSelect.value));
    playEnBtn.addEventListener('click', () => startPlaylist('en-US', enSpeedSelect.value));
    stopBtn.addEventListener('click', stopSpeech);

    function parseCustomTime(str) {
        if (!str) return 0;
        let seconds = 0;
        const regex = /(\d+)\s*([shm])/gi;
        let match;
        while ((match = regex.exec(str)) !== null) {
            const value = parseInt(match[1]);
            const unit = match[2].toLowerCase();
            if (unit === 's') seconds += value;
            if (unit === 'm') seconds += value * 60;
            if (unit === 'h') seconds += value * 3600;
        }
        return seconds;
    }

    function formatTime(totalSec) {
        const h = Math.floor(totalSec / 3600).toString().padStart(2, '0');
        const m = Math.floor((totalSec % 3600) / 60).toString().padStart(2, '0');
        const s = (totalSec % 60).toString().padStart(2, '0');
        return `${h}:${m}:${s}`;
    }

    startTimerBtn.addEventListener('click', () => {
        const inputStr = timeInput.value.trim();
        const seconds = parseCustomTime(inputStr);

        if (seconds <= 0) {
            alert("请输入有效的时间，格式如: 20s, 30m, 1h20m");
            return;
        }

        clearInterval(timerId);
        timerTotalSeconds = seconds;
        timerDisplay.textContent = formatTime(timerTotalSeconds);

        timerId = setInterval(() => {
            timerTotalSeconds--;
            timerDisplay.textContent = formatTime(timerTotalSeconds);

            if (timerTotalSeconds <= 0) {
                clearInterval(timerId);
                onTimerFinished();
            }
        }, 1000);
    });

    stopTimerBtn.addEventListener('click', () => {
        clearInterval(timerId);
        timerDisplay.textContent = "00:00:00";
    });

    function onTimerFinished() {
        stopSpeech();
        const utterance = new SpeechSynthesisUtterance("Time is up! 时间到了！");
        utterance.lang = "en-US";
        synth.speak(utterance);
        alert("⏱ 时间到！(Time is up)");
    }

    window.addEventListener('DOMContentLoaded', () => {
        requestWakeLock();
        initRssDropdown();
        loadRss(rssList[0].url);
    });
</script>
</body>
</html>
