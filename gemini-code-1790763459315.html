<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常亮 RSS 新闻播报与定时器器</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --highlight: #fef08a;
            --highlight-text: #0f172a;
            --selected-row: #1e3a8a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 100vh;
        }

        /* 顶部与各行布局 */
        .row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--panel-bg);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        select, input[type="text"], button {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        select {
            flex: 1;
            min-width: 200px;
            cursor: pointer;
        }

        input[type="text"] {
            flex: 1;
            min-width: 150px;
        }

        button {
            cursor: pointer;
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: 600;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.btn-danger {
            background-color: var(--danger);
        }
        button.btn-danger:hover {
            background-color: var(--danger-hover);
        }

        button.btn-success {
            background-color: var(--success);
        }

        /* 定时器状态样式 */
        .timer-display {
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: bold;
            color: #f59e0b;
            min-width: 100px;
        }

        /* 主内容双栏区域 */
        .main-container {
            display: flex;
            gap: 12px;
            flex: 1;
            min-height: 450px;
        }

        /* 左侧表格容器 */
        .table-container {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow-y: auto;
            max-height: calc(100vh - 230px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            position: sticky;
            top: 0;
            background-color: #0f172a;
            color: var(--text-muted);
            font-size: 0.85rem;
            z-index: 2;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }

        tr.selected {
            background-color: var(--selected-row) !important;
        }

        td.col-chk {
            width: 40px;
            text-align: center;
        }

        /* 右侧正文显示 */
        .content-container {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            max-height: calc(100vh - 230px);
        }

        .content-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .content-body {
            line-height: 1.6;
            font-size: 1rem;
            color: var(--text-main);
            white-space: pre-wrap;
        }

        /* 朗读句子高亮显示 */
        .sentence-highlight {
            background-color: var(--highlight);
            color: var(--highlight-text);
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: bold;
        }

        .status-bar {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .table-container, .content-container {
                max-height: 300px;
            }
        }
    </style>
</head>
<body>

    <!-- 第一行：弹出式列表，右侧 add, delete 按钮 -->
    <div class="row">
        <label for="rssSelect">新闻源:</label>
        <select id="rssSelect"></select>
        <button id="addRssBtn">+ 添加 RSS</button>
        <button id="delRssBtn" class="btn-danger">- 删除 RSS</button>
    </div>

    <!-- 第二行：筛选按钮, 中文播放, 英文播放, 停止键 -->
    <div class="row">
        <button id="filterBtn">🔍 筛选保留勾选</button>
        <button id="playZhBtn" class="btn-success">▶️ 中文播放</button>
        <button id="playEnBtn" class="btn-success">▶️ 英文播放 (English)</button>
        <button id="stopBtn" class="btn-danger">⏹ 停止播放</button>
    </div>

    <!-- 第三行：Timer 倒计时设置与控制 -->
    <div class="row">
        <label for="timeInput">倒计时 (例: 20s, 30m, 1h20m):</label>
        <input type="text" id="timeInput" placeholder="比如: 20s 或 15m 或 1h30m">
        <button id="startTimerBtn">⏱ 开始计时</button>
        <button id="stopTimerBtn" class="btn-danger">取消计时</button>
        <div id="timerDisplay" class="timer-display">00:00:00</div>
    </div>

    <!-- 状态指示 -->
    <div class="status-bar">
        <span id="screenStatus">💡 屏幕常亮: 正在初始化...</span>
        <span id="speechStatus">🗣 播放状态: 静止</span>
    </div>

    <!-- 主体区域：左表右文 -->
    <div class="main-container">
        <!-- 左侧表格 -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="col-chk"><input type="checkbox" id="selectAllChk"></th>
                        <th>新闻标题 (点击查看/单条播放)</th>
                    </tr>
                </thead>
                <tbody id="newsTableBody">
                    <tr><td colspan="2" style="text-align:center; color: var(--text-muted);">正在加载 RSS 新闻列表...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- 右侧文本框（高亮朗读区域） -->
        <div class="content-container">
            <div id="contentTitle" class="content-title">新闻详情预看</div>
            <div id="contentBody" class="content-body">在左侧选择一条新闻后，此处将显示完整详情。点击“中文播放”或“英文播放”开始朗读，朗读的句子会以黄色高亮突出。</div>
        </div>
    </div>

<script>
    // 预设 RSS 订阅源 (包含中文与英文)
    const DEFAULT_FEEDS = [
        { name: "BBC News (英文世界)", url: "https://feeds.bbci.co.uk/news/rss.xml" },
        { name: "RTHK 香港电台 (中文新闻)", url: "https://rthk.hk/rthk/news/rss/c_expressnews_clocal.xml" },
        { name: "RTHK World (英文新闻)", url: "https://rthk.hk/rthk/news/rss/e_expressnews_einternational.xml" },
        { name: "China.org.cn (中国网英文)", url: "https://www.china.org.cn/english/rss/201719.xml" },
        { name: "联合早报 (即时中文)", url: "https://www.zaobao.com.sg/realtime/china/rss.xml" }
    ];

    // 全局状态管理
    let rssList = [...DEFAULT_FEEDS];
    let currentNewsList = [];
    let selectedNewsIndex = 0;
    let wakeLock = null;
    let timerId = null;
    let timerTotalSeconds = 0;

    // 语音朗读相关变量
    let synth = window.speechSynthesis;
    let isPlaying = false;
    let currentPlayList = [];
    let currentPlayListIndex = 0;
    let currentSentences = [];
    let currentSentenceIndex = 0;
    let activeLang = 'zh-CN';

    // DOM 节点引用
    const rssSelect = document.getElementById('rssSelect');
    const addRssBtn = document.getElementById('addRssBtn');
    const delRssBtn = document.getElementById('delRssBtn');
    const newsTableBody = document.getElementById('newsTableBody');
    const selectAllChk = document.getElementById('selectAllChk');
    const contentTitle = document.getElementById('contentTitle');
    const contentBody = document.getElementById('contentBody');
    const filterBtn = document.getElementById('filterBtn');
    const playZhBtn = document.getElementById('playZhBtn');
    const playEnBtn = document.getElementById('playEnBtn');
    const stopBtn = document.getElementById('stopBtn');
    const timeInput = document.getElementById('timeInput');
    const startTimerBtn = document.getElementById('startTimerBtn');
    const stopTimerBtn = document.getElementById('stopTimerBtn');
    const timerDisplay = document.getElementById('timerDisplay');
    const screenStatus = document.getElementById('screenStatus');
    const speechStatus = document.getElementById('speechStatus');

    // CORS 代理服务器，用于绕过前端跨域问题
    const CORS_PROXY = "https://api.allorigins.win/raw?url=";

    // ------------------- 1. 初始化与屏幕常亮 -------------------
    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                screenStatus.textContent = "💡 屏幕常亮: 已开启 (防止屏幕熄灭)";
            } else {
                screenStatus.textContent = "💡 屏幕常亮: 浏览器不支持 WakeLock API";
            }
        } catch (err) {
            screenStatus.textContent = "💡 屏幕常亮: 无法锁定屏幕 (" + err.message + ")";
        }
    }

    // 页面不可见后重新恢复常亮
    document.addEventListener("visibilitychange", () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
            requestWakeLock();
        }
    });

    function initRssDropdown() {
        rssSelect.innerHTML = '';
        rssList.forEach((item, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.textContent = item.name;
            rssSelect.appendChild(opt);
        });
    }

    // ------------------- 2. RSS 抓取与解析 -------------------
    async function loadRss(url) {
        newsTableBody.innerHTML = `<tr><td colspan="2" style="text-align:center; color: var(--text-muted);">正在加载 RSS 源数据...</td></tr>`;
        try {
            const res = await fetch(CORS_PROXY + encodeURIComponent(url));
            if (!res.ok) throw new Error("网络错误");
            const xmlText = await res.text();
            
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "text/xml");
            const items = xmlDoc.querySelectorAll("item");

            currentNewsList = [];
            items.forEach((item) => {
                const title = item.querySelector("title")?.textContent || "无标题";
                let description = item.querySelector("description")?.textContent || title;
                // 清除 HTML 标签，只保留纯文本
                description = description.replace(/<[^>]+>/g, '').trim();

                currentNewsList.push({
                    title: title.trim(),
                    content: description || title.trim(),
                    checked: true // 默认选中
                });
            });

            renderTable();
            if (currentNewsList.length > 0) {
                selectNewsItem(0);
            } else {
                contentTitle.textContent = "未抓取到新闻";
                contentBody.textContent = "该 RSS 源目前暂无更新。";
            }
        } catch (err) {
            newsTableBody.innerHTML = `<tr><td colspan="2" style="text-align:center; color: var(--danger);">加载 RSS 失败: ${err.message}</td></tr>`;
        }
    }

    function renderTable() {
        newsTableBody.innerHTML = '';
        if (currentNewsList.length === 0) {
            newsTableBody.innerHTML = `<tr><td colspan="2" style="text-align:center; color: var(--text-muted);">列表为空</td></tr>`;
            return;
        }

        currentNewsList.forEach((news, idx) => {
            const tr = document.createElement('tr');
            if (idx === selectedNewsIndex) tr.classList.add('selected');

            tr.innerHTML = `
                <td class="col-chk"><input type="checkbox" class="news-chk" data-idx="${idx}" ${news.checked ? 'checked' : ''}></td>
                <td>${escapeHtml(news.title)}</td>
            `;

            // 点击整行（除了直接点 checkbox）切换到该新闻
            tr.addEventListener('click', (e) => {
                if (e.target.tagName !== 'INPUT') {
                    selectNewsItem(idx);
                }
            });

            const chk = tr.querySelector('.news-chk');
            chk.addEventListener('change', (e) => {
                currentNewsList[idx].checked = e.target.checked;
            });

            newsTableBody.appendChild(tr);
        });
    }

    function selectNewsItem(index) {
        selectedNewsIndex = index;
        renderTable();
        if (currentNewsList[index]) {
            contentTitle.textContent = currentNewsList[index].title;
            contentBody.textContent = currentNewsList[index].content;
        }
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // ------------------- 3. 筛选与删除 -------------------
    filterBtn.addEventListener('click', () => {
        currentNewsList = currentNewsList.filter(news => news.checked);
        selectedNewsIndex = 0;
        renderTable();
        if (currentNewsList.length > 0) {
            selectNewsItem(0);
        } else {
            contentTitle.textContent = "列表已清空";
            contentBody.textContent = "没有勾选任何新闻。";
        }
    });

    selectAllChk.addEventListener('change', (e) => {
        const isChecked = e.target.checked;
        currentNewsList.forEach(news => news.checked = isChecked);
        renderTable();
    });

    addRssBtn.addEventListener('click', () => {
        const name = prompt("请输入 RSS 新闻网站名称:");
        if (!name) return;
        const url = prompt("请输入 RSS 推送链接 (URL):");
        if (!url) return;

        rssList.push({ name, url });
        initRssDropdown();
        rssSelect.value = rssList.length - 1;
        loadRss(url);
    });

    delRssBtn.addEventListener('click', () => {
        if (rssList.length <= 1) {
            alert("至少保留一个 RSS 源！");
            return;
        }
        const idx = parseInt(rssSelect.value);
        rssList.splice(idx, 1);
        initRssDropdown();
        loadRss(rssList[0].url);
    });

    rssSelect.addEventListener('change', (e) => {
        const idx = parseInt(e.target.value);
        loadRss(rssList[idx].url);
    });

    // ------------------- 4. 朗读核心引擎 (带句子高亮) -------------------
    function startPlaylist(lang, startFromIndex = 0) {
        stopSpeech();
        activeLang = lang;

        // 挑选出需要朗读的新闻
        currentPlayList = [];
        currentNewsList.forEach((news, idx) => {
            if (news.checked && idx >= startFromIndex) {
                currentPlayList.push({ ...news, originalIndex: idx });
            }
        });

        if (currentPlayList.length === 0) {
            alert("没有找到需要播放的已勾选新闻！");
            return;
        }

        isPlaying = true;
        currentPlayListIndex = 0;
        playCurrentNewsItem();
    }

    function playCurrentNewsItem() {
        if (!isPlaying || currentPlayListIndex >= currentPlayList.length) {
            stopSpeech();
            speechStatus.textContent = "🗣 播放状态: 播放结束";
            return;
        }

        const news = currentPlayList[currentPlayListIndex];
        selectNewsItem(news.originalIndex);

        // 分句处理 (通过标点符号切割成数组)
        const textToRead = `${news.title}。${news.content}`;
        currentSentences = textToRead.split(/([。！？\n!;?]+)/).filter(Boolean);
        
        // 合并标点符号到上一个句子中
        let mergedSentences = [];
        for (let i = 0; i < currentSentences.length; i++) {
            if (i % 2 === 0) {
                let sentence = currentSentences[i];
                let punct = currentSentences[i+1] || '';
                if (sentence.trim()) {
                    mergedSentences.push(sentence + punct);
                }
            }
        }
        currentSentences = mergedSentences;
        currentSentenceIndex = 0;

        speechStatus.textContent = `🗣 播放状态: 正在播放第 (${currentPlayListIndex + 1}/${currentPlayList.length}) 条`;
        playNextSentence();
    }

    function playNextSentence() {
        if (!isPlaying) return;

        if (currentSentenceIndex >= currentSentences.length) {
            // 当前这篇新闻读完，播下一篇
            currentPlayListIndex++;
            playCurrentNewsItem();
            return;
        }

        const sentenceText = currentSentences[currentSentenceIndex];

        // 在右侧高亮显示当前读取的句子
        renderHighlightedContent(sentenceText);

        const utterance = new SpeechSynthesisUtterance(sentenceText);
        utterance.lang = activeLang;
        utterance.rate = 1.0;

        utterance.onend = () => {
            currentSentenceIndex++;
            playNextSentence();
        };

        utterance.onerror = (err) => {
            console.error("朗读错误:", err);
            currentSentenceIndex++;
            playNextSentence();
        };

        synth.speak(utterance);
    }

    function renderHighlightedContent(targetSentence) {
        const fullText = currentNewsList[selectedNewsIndex]?.content || "";
        const titleText = currentNewsList[selectedNewsIndex]?.title || "";

        let htmlTitle = escapeHtml(titleText);
        let htmlBody = escapeHtml(fullText);

        // 如果高亮句子出现在标题或正文中，进行包装
        const escapedTarget = escapeHtml(targetSentence.trim());
        if (escapedTarget && htmlTitle.includes(escapedTarget)) {
            htmlTitle = htmlTitle.replace(escapedTarget, `<span class="sentence-highlight">${escapedTarget}</span>`);
        } else if (escapedTarget && htmlBody.includes(escapedTarget)) {
            htmlBody = htmlBody.replace(escapedTarget, `<span class="sentence-highlight">${escapedTarget}</span>`);
        } else if (escapedTarget) {
            // 如果未能精确定位，直接展示带高亮的文本
            htmlBody = `<span class="sentence-highlight">${escapedTarget}</span><br>` + htmlBody;
        }

        contentTitle.innerHTML = htmlTitle;
        contentBody.innerHTML = htmlBody;
    }

    function stopSpeech() {
        isPlaying = false;
        if (synth) synth.cancel();
        speechStatus.textContent = "🗣 播放状态: 已停止";
        if (currentNewsList[selectedNewsIndex]) {
            contentTitle.textContent = currentNewsList[selectedNewsIndex].title;
            contentBody.textContent = currentNewsList[selectedNewsIndex].content;
        }
    }

    playZhBtn.addEventListener('click', () => startPlaylist('zh-CN', 0));
    playEnBtn.addEventListener('click', () => startPlaylist('en-US', 0));
    stopBtn.addEventListener('click', stopSpeech);

    // ------------------- 5. Timer 倒计时功能 -------------------
    function parseCustomTime(str) {
        if (!str) return 0;
        let seconds = 0;
        const regex = /(\d+)\s*([shm])/gi;
        let match;
        while ((match = regex.exec(str)) !== null) {
            const value = parseInt(match[1]);
            const unit = match[2].toLowerCase();
            if (unit === 's') seconds += value;
            if (unit === 'm') seconds += value * 60;
            if (unit === 'h') seconds += value * 3600;
        }
        return seconds;
    }

    function formatTime(totalSec) {
        const h = Math.floor(totalSec / 3600).toString().padStart(2, '0');
        const m = Math.floor((totalSec % 3600) / 60).toString().padStart(2, '0');
        const s = (totalSec % 60).toString().padStart(2, '0');
        return `${h}:${m}:${s}`;
    }

    startTimerBtn.addEventListener('click', () => {
        const inputStr = timeInput.value.trim();
        const seconds = parseCustomTime(inputStr);

        if (seconds <= 0) {
            alert("请输入有效的时间，格式如: 20s, 30m, 1h20m");
            return;
        }

        clearInterval(timerId);
        timerTotalSeconds = seconds;
        timerDisplay.textContent = formatTime(timerTotalSeconds);

        timerId = setInterval(() => {
            timerTotalSeconds--;
            timerDisplay.textContent = formatTime(timerTotalSeconds);

            if (timerTotalSeconds <= 0) {
                clearInterval(timerId);
                onTimerFinished();
            }
        }, 1000);
    });

    stopTimerBtn.addEventListener('click', () => {
        clearInterval(timerId);
        timerDisplay.textContent = "00:00:00";
    });

    function onTimerFinished() {
        // 1. 如果正在放新闻，停止播放新闻
        stopSpeech();

        // 2. 播放 "time is up" 提醒
        const utterance = new SpeechSynthesisUtterance("Time is up! 时间到了！");
        utterance.lang = "en-US";
        synth.speak(utterance);
        alert("⏱ 时间到！(Time is up)");
    }

    // ------------------- 6. 页面加载入口 -------------------
    window.addEventListener('DOMContentLoaded', () => {
        requestWakeLock();
        initRssDropdown();
        loadRss(rssList[0].url);
    });
</script>
</body>
</html>
